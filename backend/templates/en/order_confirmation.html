<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{subject}}</title>
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; }
    .header { background: #f8f9fa; padding: 20px; text-align: center; }
    .content { padding: 20px; border-left: 4px solid #007bff; }
    .footer { font-size: 12px; color: #666; text-align: center; padding: 20px; border-top: 1px solid #eee; }
    .btn { display: inline-block; padding: 10px 20px; background: #007bff; color: #fff; text-decoration: none; border-radius: 4px; }
    .rtl { direction: rtl; font-family: 'Cairo', Tahoma, sans-serif; }
  </style>
</head>
<body{{#if rtl}} class="rtl"{{/if}}}>
  <div class="header">
    <h1>{{#if rtl}}Business Discovery{{else}}Business Discovery{{/if}}</h1>
  </div>
  <div class="content">
    {{#if rtl}}<div dir="rtl">{{/if}}
    {{content}}
    {{#if rtl}}</div>{{/if}}
  </div>
  <div class="footer">
    <p>If you did not request this email, please ignore it.</p>
    <p>&copy; {{year}} Business Discovery. All rights reserved.</p>
  </div>
</body>
</html>
