<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Reset</title>
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; }
    .header { background: #f8f9fa; padding: 20px; text-align: center; }
    .content { padding: 20px; }
    .reset-code { font-size: 24px; font-weight: bold; color: #dc3545; text-align: center; padding: 20px; background: #f8d7da; border-radius: 4px; margin: 20px 0; }
    .footer { font-size: 12px; color: #666; text-align: center; padding: 20px; border-top: 1px solid #eee; }
    .btn { display: inline-block; padding: 10px 20px; background: #28a745; color: #fff; text-decoration: none; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Password Reset</h1>
  </div>
  <div class="content">
    <p>We received a request to reset your password.</p>
    <p>Your reset code is:</p>
    <div class="reset-code">{{resetCode}}</div>
    <div style="text-align: center; margin: 30px 0;">
      <a href="{{resetUrl}}" class="btn">Reset Password</a>
    </div>
    <p>This reset link will expire in 1 hour.</p>
    <p>If you did not request a password reset, please ignore this email.</p>
  </div>
  <div class="footer">
    <p>&copy; {{year}} Business Discovery. All rights reserved.</p>
  </div>
</body>
</html>
