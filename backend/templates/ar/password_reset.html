<!DOCTYPE html>
<html lang="ar" dir="rtl" style="direction: rtl;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إعادة تعيين كلمة المرور</title>
  <style>
    body { font-family: 'Cairo', Tahoma, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; }
    .header { background: #f8f9fa; padding: 20px; text-align: center; }
    .content { padding: 20px; }
    .reset-code { font-size: 24px; font-weight: bold; color: #dc3545; text-align: center; padding: 20px; background: #f8d7da; border-radius: 4px; margin: 20px 0; }
    .footer { font-size: 12px; color: #666; text-align: center; padding: 20px; border-top: 1px solid #eee; }
    .btn { display: inline-block; padding: 10px 20px; background: #28a745; color: #fff; text-decoration: none; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>إعادة تعيين كلمة المرور</h1>
  </div>
  <div class="content">
    <p>تم طلب إعادة تعيين كلمة المرور.</p>
    <p>كود إعادة التعيين هو:</p>
    <div class="reset-code">{{resetCode}}</div>
    <div style="text-align: center; margin: 30px 0;">
      <a href="{{resetUrl}}" class="btn">إعادة تعيين كلمة المرور</a>
    </div>
    <p>سيتم إغلاق هذا الرابط خلال ساعة واحدة.</p>
    <p>إذا لم تطلب إعادة تعيين كلمة المرور، يرجى تجاهل هذا البريد الإلكتروني.</p>
  </div>
  <div class="footer">
    <p>&copy; {{year}} Business Discovery. جميع الحقوق محفوظة.</p>
  </div>
</body>
</html>
