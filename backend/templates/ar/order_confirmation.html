<!DOCTYPE html>
<html lang="ar" dir="rtl" style="direction: rtl;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{subject}}</title>
  <style>
    body { font-family: 'Cairo', Tahoma, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; }
    .header { background: #f8f9fa; padding: 20px; text-align: center; }
    .content { padding: 20px; border-left: 4px solid #007bff; }
    .footer { font-size: 12px; color: #666; text-align: center; padding: 20px; border-top: 1px solid #eee; }
    .btn { display: inline-block; padding: 10px 20px; background: #007bff; color: #fff; text-decoration: none; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Business Discovery</h1>
  </div>
  <div class="content">
    {{content}}
  </div>
  <div class="footer">
    <p>إذا لم تطلب هذا البريد الإلكتروني، تجاهله.</p>
    <p>&copy; {{year}} Business Discovery. جميع الحقوق محفوظة.</p>
  </div>
</body>
</html>
