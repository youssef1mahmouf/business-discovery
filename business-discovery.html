<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مستكشف المشاريع – نظام اكتشاف الأعمال وقرار الشراكة</title>
  <meta name="description" content="تطبيق يعمل دون اتصال بالإنترنت لتقييم واكتشاف مشروع تجاري مناسب لشريكين">
  <style>
    * {
      box-sizing: border-box
    }

    :root {
      --bg: #f3f6fa;
      --surface: #ffffff;
      --surface2: #eef2f7;
      --text: #15202d;
      --muted: #5b6b7e;
      --line: #dbe2ec;
      --primary: #1f5fa8;
      --primary-ink: #ffffff;
      --primary-soft: #e8f0fa;
      --accent: #0d8f7d;
      --warn: #a86a12;
      --warn-soft: #fdf3e0;
      --danger: #b4332f;
      --danger-soft: #fdecea;
      --ok: #17744a;
      --ok-soft: #e6f5ed;
      --info: #4a5568;
      --shadow: 0 1px 2px rgba(16, 30, 48, .06), 0 6px 20px rgba(16, 30, 48, .07);
      --radius: 12px;
      --radius-sm: 8px;
      --fs: 15px;
      --maxw: 1180px;
    }

    [data-theme="dark"] {
      --bg: #0e131b;
      --surface: #161d27;
      --surface2: #1d2733;
      --text: #e7eef7;
      --muted: #9cb0c6;
      --line: #293545;
      --primary: #6aa9e6;
      --primary-ink: #06121f;
      --primary-soft: #17293d;
      --accent: #3cc3ad;
      --warn: #e3b75a;
      --warn-soft: #2e2716;
      --danger: #ef7b76;
      --danger-soft: #33191a;
      --ok: #59cf95;
      --ok-soft: #12301f;
      --info: #b6c2d2;
      --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .35);
    }

    html,
    body {
      margin: 0;
      padding: 0
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, "Traditional Arabic", "Noto Naskh Arabic", Arial, sans-serif;
      font-size: var(--fs);
      line-height: 1.75;
      direction: rtl;
      -webkit-text-size-adjust: 100%
    }

    h1,
    h2,
    h3,
    h4 {
      line-height: 1.4;
      margin: 0 0 .4em
    }

    h1 {
      font-size: 1.5rem
    }

    h2 {
      font-size: 1.22rem
    }

    h3 {
      font-size: 1.05rem
    }

    h4 {
      font-size: .98rem
    }

    p {
      margin: .4em 0
    }

    a {
      color: var(--primary)
    }

    small {
      font-size: .85em
    }

    code,
    kbd {
      font-family: Consolas, monospace;
      background: var(--surface2);
      padding: 1px 5px;
      border-radius: 5px;
      font-size: .9em;
      border: 1px solid var(--line)
    }

    hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 16px 0
    }

    :focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 2px;
      border-radius: 4px
    }

    /* layout */
    .app {
      display: flex;
      min-height: 100vh
    }

    .sidebar {
      width: 264px;
      flex: 0 0 264px;
      background: var(--surface);
      border-inline-start: 1px solid var(--line);
      padding: 16px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto
    }

    .brand {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 6px
    }

    .brand .logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--primary);
      color: var(--primary-ink);
      display: grid;
      place-items: center;
      font-weight: 700;
      flex: 0 0 auto
    }

    .brand h1 {
      font-size: 1rem;
      margin: 0
    }

    .brand small {
      color: var(--muted);
      display: block;
      font-size: .76rem
    }

    .nav {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 2px
    }

    .nav button {
      display: flex;
      align-items: center;
      gap: 9px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text);
      text-align: start;
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font: inherit;
      font-size: .94rem
    }

    .nav button:hover {
      background: var(--surface2)
    }

    .nav button.active {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: var(--line);
      font-weight: 600
    }

    .nav .grp {
      margin: 12px 8px 4px;
      font-size: .74rem;
      color: var(--muted);
      letter-spacing: .04em;
      text-transform: uppercase;
      font-weight: 700
    }

    .nav .ico {
      width: 22px;
      text-align: center;
      flex: 0 0 22px;
      opacity: .9
    }

    .nav .badge {
      margin-inline-start: auto;
      background: var(--surface2);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 0 7px;
      font-size: .74rem;
      color: var(--muted)
    }

    .main {
      flex: 1;
      min-width: 0;
      padding: 20px clamp(12px, 3vw, 30px) 60px
    }

    .topbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px
    }

    .topbar .spacer {
      flex: 1
    }

    .page-head {
      margin-bottom: 14px
    }

    .page-head h2 {
      margin: 0 0 2px
    }

    .page-head p {
      margin: 0;
      color: var(--muted);
      font-size: .92rem
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 16px
    }

    .card>h3:first-child {
      margin-top: 0
    }

    .grid {
      display: grid;
      gap: 14px
    }

    .g2 {
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr))
    }

    .g3 {
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr))
    }

    .g4 {
      grid-template-columns: repeat(auto-fit, minmax(165px, 1fr))
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center
    }

    .row.tight {
      gap: 6px
    }

    .end {
      margin-inline-start: auto
    }

    .muted {
      color: var(--muted)
    }

    .tiny {
      font-size: .8rem
    }

    .nowrap {
      white-space: nowrap
    }

    /* controls */
    .btn {
      font: inherit;
      font-size: .92rem;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600
    }

    .btn:hover {
      background: var(--surface2)
    }

    .btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-ink)
    }

    .btn.primary:hover {
      filter: brightness(1.08)
    }

    .btn.accent {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff
    }

    .btn.danger {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger)
    }

    .btn.ghost {
      background: transparent
    }

    .btn.sm {
      padding: 5px 10px;
      font-size: .84rem;
      font-weight: 600
    }

    .btn.xs {
      padding: 2px 7px;
      font-size: .78rem
    }

    .btn[disabled] {
      opacity: .5;
      cursor: not-allowed
    }

    .btn.link {
      background: none;
      border: none;
      color: var(--primary);
      text-decoration: underline;
      padding: 0;
      font-weight: 600
    }

    input[type=text],
    input[type=number],
    input[type=search],
    input[type=date],
    select,
    textarea {
      font: inherit;
      font-size: .94rem;
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text)
    }

    textarea {
      min-height: 88px;
      resize: vertical
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--primary)
    }

    label {
      display: block;
      font-size: .9rem;
      font-weight: 600;
      margin-bottom: 4px
    }

    fieldset {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      margin: 0 0 10px
    }

    legend {
      font-size: .86rem;
      font-weight: 700;
      padding: 0 5px;
      color: var(--muted)
    }

    .opt {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 400;
      margin: 0
    }

    .opt:hover {
      background: var(--surface2)
    }

    .opt input {
      margin-top: 6px;
      accent-color: var(--primary);
      flex: 0 0 auto;
      width: 16px;
      height: 16px
    }

    .opt .txt {
      font-weight: 400;
      font-size: .94rem
    }

    .scale {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center
    }

    .scale label {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      cursor: pointer;
      font-weight: 600;
      background: var(--surface);
      min-width: 42px;
      text-align: center
    }

    .scale label:has(input:checked) {
      background: var(--primary);
      color: var(--primary-ink);
      border-color: var(--primary)
    }

    .scale input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0
    }

    .badge,
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 9px;
      border-radius: 20px;
      font-size: .78rem;
      font-weight: 700;
      border: 1px solid var(--line);
      background: var(--surface2);
      color: var(--muted)
    }

    .pill.ok {
      background: var(--ok-soft);
      color: var(--ok);
      border-color: transparent
    }

    .pill.warn {
      background: var(--warn-soft);
      color: var(--warn);
      border-color: transparent
    }

    .pill.bad {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: transparent
    }

    .pill.info {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: transparent
    }

    .pill.acc {
      background: var(--ok-soft);
      color: var(--accent);
      border-color: transparent
    }

    .progress {
      height: 9px;
      background: var(--surface2);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--line)
    }

    .progress>i {
      display: block;
      height: 100%;
      background: var(--primary);
      border-radius: 20px
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 6px 0
    }

    .bar-row .nm {
      width: min(190px, 38%);
      font-size: .88rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .bar-row .track {
      flex: 1;
      height: 8px;
      background: var(--surface2);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--line)
    }

    .bar-row .track i {
      display: block;
      height: 100%;
      background: var(--accent)
    }

    .bar-row .val {
      font-size: .82rem;
      color: var(--muted);
      width: 78px;
      text-align: end
    }

    .stat {
      background: var(--surface2);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 12px
    }

    .stat .n {
      font-size: 1.5rem;
      font-weight: 800;
      line-height: 1.2;
      color: var(--primary)
    }

    .stat .l {
      font-size: .82rem;
      color: var(--muted)
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .9rem
    }

    th,
    td {
      border: 1px solid var(--line);
      padding: 7px 9px;
      text-align: start;
      vertical-align: top
    }

    th {
      background: var(--surface2);
      font-size: .85rem
    }

    .table-wrap {
      overflow: auto;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line)
    }

    details {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      background: var(--surface)
    }

    summary {
      cursor: pointer;
      font-weight: 700;
      list-style-position: inside
    }

    details[open] summary {
      margin-bottom: 8px
    }

    .empty {
      text-align: center;
      padding: 34px 16px;
      color: var(--muted);
      border: 2px dashed var(--line);
      border-radius: var(--radius)
    }

    .empty .big {
      font-size: 2rem;
      display: block;
      margin-bottom: 6px
    }

    .msg {
      padding: 10px 13px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      margin: 8px 0;
      font-size: .9rem
    }

    .msg.ok {
      background: var(--ok-soft);
      color: var(--ok);
      border-color: var(--ok)
    }

    .msg.bad {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: var(--danger)
    }

    .msg.warn {
      background: var(--warn-soft);
      color: var(--warn);
      border-color: var(--warn)
    }

    .msg.info {
      background: var(--primary-soft);
      color: var(--primary)
    }

    .toast-wrap {
      position: fixed;
      inset-block-end: 16px;
      inset-inline-start: 16px;
      z-index: 90;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: min(380px, 90vw)
    }

    .toast {
      background: var(--surface);
      border: 1px solid var(--line);
      border-inline-start: 4px solid var(--primary);
      box-shadow: var(--shadow);
      border-radius: var(--radius-sm);
      padding: 9px 13px;
      font-size: .9rem
    }

    .toast.ok {
      border-inline-start-color: var(--ok)
    }

    .toast.bad {
      border-inline-start-color: var(--danger)
    }

    .toast.warn {
      border-inline-start-color: var(--warn)
    }

    .modal-back {
      position: fixed;
      inset: 0;
      background: rgba(10, 18, 28, .55);
      display: grid;
      place-items: center;
      z-index: 100;
      padding: 16px
    }

    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      max-width: 560px;
      width: 100%;
      max-height: 88vh;
      overflow: auto;
      box-shadow: var(--shadow)
    }

    .modal .mh {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      font-weight: 800;
      display: flex;
      gap: 8px;
      align-items: center
    }

    .modal .mb {
      padding: 16px
    }

    .modal .mf {
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap
    }

    .modal.sm {
      max-width: 420px
    }

    /* misc app blocks */
    .qcard {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 12px;
      margin-bottom: 10px;
      background: var(--surface)
    }

    .qcard.answered {
      border-inline-start: 4px solid var(--ok)
    }

    .qcard.skipped {
      border-inline-start: 4px solid var(--warn)
    }

    .qcard.flagged {
      background: var(--warn-soft)
    }

    .qmeta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 6px
    }

    .qtext {
      font-weight: 600;
      margin-bottom: 8px;
      font-size: .98rem
    }

    .qhelp {
      font-size: .85rem;
      color: var(--muted);
      margin: -4px 0 8px
    }

    .qtools {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-top: 9px;
      padding-top: 8px;
      border-top: 1px dashed var(--line)
    }

    .tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
      margin-bottom: 14px
    }

    .tabs button {
      background: none;
      border: 0;
      border-bottom: 3px solid transparent;
      padding: 9px 12px;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      color: var(--muted)
    }

    .tabs button.active {
      color: var(--primary);
      border-bottom-color: var(--primary)
    }

    .list-item {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      margin-bottom: 7px;
      background: var(--surface);
      flex-wrap: wrap
    }

    .list-item .t {
      font-weight: 600
    }

    .cmp-tbl td.v {
      width: 23%;
      font-size: .88rem
    }

    .cmp-tbl th.nm {
      background: var(--primary-soft);
      color: var(--primary)
    }

    .cmp-tbl th.nm.hi {
      background: var(--primary);
      color: var(--primary-ink)
    }

    .hint {
      border-inline-start: 3px solid var(--info);
      padding: 8px 12px;
      background: var(--surface2);
      border-radius: 6px;
      font-size: .87rem;
      color: var(--muted)
    }

    .kbd-list {
      display: grid;
      gap: 6px
    }

    .kbd-list div {
      display: flex;
      gap: 8px;
      align-items: baseline;
      padding: 6px 0;
      border-bottom: 1px dashed var(--line)
    }

    .kbd-list div:last-child {
      border-bottom: 0
    }

    .badge-q {
      font-family: Consolas, monospace;
      font-size: .76rem;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--line);
      padding: 1px 6px;
      border-radius: 5px
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0
    }

    .menu-btn {
      display: none
    }

    .sidenote {
      font-size: .83rem;
      color: var(--muted)
    }

    hr.sep {
      border-top: 1px solid var(--line);
      margin: 14px 0
    }

    .idea {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 14px;
      background: var(--surface)
    }

    .idea.top {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary) inset
    }

    .idea h4 {
      margin: 0 0 4px
    }

    .score-pill {
      font-weight: 800;
      font-size: 1rem;
      color: var(--primary)
    }

    ul.tight {
      margin: .3em 0;
      padding-inline-start: 1.2em
    }

    ul.tight li {
      margin: .15em 0
    }

    .disc {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      background: var(--surface);
      flex-wrap: wrap
    }

    .disc.res {
      border-inline-start: 4px solid var(--ok)
    }

    .disc.todo {
      border-inline-start: 4px solid var(--danger)
    }

    .disc.disc2 {
      border-inline-start: 4px solid var(--warn)
    }

    .disc.accept {
      border-inline-start: 4px solid var(--accent)
    }

    .disc.later {
      border-inline-start: 4px solid var(--muted)
    }

    select.sel {
      width: auto;
      display: inline-block
    }

    /* responsive */
    @media (max-width:900px) {
      .app {
        flex-direction: column
      }

      .sidebar {
        position: fixed;
        inset-block: 0;
        inset-inline-end: 0;
        width: 280px;
        max-width: 86vw;
        transform: translateX(-100%);
        transition: transform .18s ease;
        z-index: 80;
        height: 100%;
        box-shadow: var(--shadow)
      }

      [dir=rtl] .sidebar {
        transform: translateX(100%)
      }

      .sidebar.open {
        transform: translateX(0) !important
      }

      [dir=rtl] .sidebar.open {
        transform: translateX(0)
      }

      .menu-btn {
        display: inline-flex
      }

      .main {
        padding: 14px 12px 70px
      }

      h1 {
        font-size: 1.25rem
      }

      .cmp-tbl {
        font-size: .82rem
      }

      .cmp-tbl th,
      .cmp-tbl td {
        padding: 5px
      }
    }

    @media (max-width:560px) {
      .g4 {
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr))
      }

      .stat .n {
        font-size: 1.25rem
      }
    }

    /* print */
    @media print {
      @page {
        margin: 14mm 12mm
      }

      body {
        background: #fff;
        color: #000;
        font-size: 11.5pt;
        line-height: 1.6
      }

<body>

    </main>
  </div>

  <div class="toast-wrap" id="toasts" aria-live="polite" aria-atomic="false"></div>
  <div id="modalHost"></div>
  <input type="file" id="fileInput" accept="application/json,.json" style="display:none">
  <input type="file" id="csvInput" accept="text/csv,.csv" style="display:none">
  <script>
    /* =====================================================================
       مستكشف المشاريع — Business Discovery & Co-Founder Decision System
       Single-file, offline, no external dependencies.
       ===================================================================== */
    'use strict';
    const APP = {
      name: 'مستكشف المشاريع',
      schema: '1.0.0',
      dataKey: 'bd_state_v1',
      prefKey: 'bd_prefs_v1'
    };

    /* ---------- tiny helpers ---------- */
    const $ = (s, r) => (r || document).querySelector(s);
    const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const uid = (p) => (p || 'id') + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
    const num = (v) => { const n = Number(v); return isFinite(n) ? n : null; };
    const fmtPct = (n) => (Math.round(n * 10) / 10).toFixed(1);
    const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
    const todayISO = () => new Date().toISOString().slice(0, 10);
    const nowISO = () => new Date().toISOString();
    const arr = (v) => (Array.isArray(v) ? v : []);
    const uniq = (a) => Array.from(new Set(a));
    const byId = (list, id) => list.find(x => x && x.id === id);
    const sum = (a) => a.reduce((x, y) => x + y, 0);
    const median = (a) => { if (!a.length) return null; const s = a.slice().sort((x, y) => x - y); const m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
    const mean = (a) => (a.length ? sum(a) / a.length : null);

    /* ---------- DOM helpers ---------- */
    function toast(msg, kind) {
      kind = kind || 'info';
      const w = $('#toasts');
      if (!w) return;
      const el = document.createElement('div');
      el.className = 'toast ' + kind;
      el.textContent = msg;
      w.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3600);
    }
    function on(root, sel, ev, fn) { const e = $(sel, root); if (e) e.addEventListener(ev, fn); return e; }
    function onAll(root, sel, ev, fn) { $$('#' + root.id + ' ' + sel).forEach(e => e.addEventListener(ev, fn)); }

    /* ---------- storage ---------- */
    function storeAvailable() {
      try { const k = '__bd_test__'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; }
      catch (e) { return false; }
    }
    function lsGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
    function lsSet(key, val) { try { localStorage.setItem(key, val); return true; } catch (e) { return false; } }
    function lsDel(key) { try { localStorage.removeItem(key); } catch (e) { } }

    /* ---------- default state ---------- */
    function defaultState() {
      return { schema: APP.schema, createdAt: nowISO(), activeProjectId: null, activeParticipantId: null, projects: [] };
    }
    let S = defaultState();
    let SAVE_TIMER = null;

    function saveState(immediate) {
      clearTimeout(SAVE_TIMER);
      const doIt = () => {
        const ok = lsSet(APP.dataKey, JSON.stringify(S));
        const el = $('#saveState');
        if (!ok) {
          if (el) { el.textContent = 'تعذّر الحفظ المحلي — استخدم التصدير'; el.style.color = 'var(--danger)'; }
          toast('تعذّر الحفظ في التخزين المحلي. صدّر نسخة احتياطية الآن.', 'bad');
        } else if (el) { el.textContent = 'تم الحفظ ' + new Date().toLocaleTimeString('ar-EG'); el.style.color = ''; }
      };
      if (immediate) doIt(); else SAVE_TIMER = setTimeout(doIt, 350);
    }
    function loadState() {
      const raw = lsGet(APP.dataKey);
      if (!raw) { S = defaultState(); return false; }
      try {
        const p = JSON.parse(raw);
        if (!p || typeof p !== 'object' || !Array.isArray(p.projects)) throw new Error('bad shape');
        S = Object.assign(defaultState(), p);
        S.projects = p.projects.map(normProject).filter(Boolean);
        S.activeProjectId = (p.activeProjectId && byId(S.projects, p.activeProjectId)) ? p.activeProjectId : (S.projects[0] ? S.projects[0].id : null);
        const pr = currentProject();
        S.activeParticipantId = (pr && pr.participants.some(x => x.id === p.activeParticipantId)) ? p.activeParticipantId : (pr && pr.participants[0] ? pr.participants[0].id : null);
        return true;
      } catch (e) {
        console.warn('state load failed', e);
        S = defaultState();
        return false;
      }
    }
    function normProject(p) {
      if (!p || typeof p !== 'object') return null;
      p.id = p.id || uid('prj');
      p.name = String(p.name || 'مشروع بدون اسم').slice(0, 120);
      p.createdAt = p.createdAt || nowISO();
      p.participants = arr(p.participants).map(normParticipant).filter(Boolean);
      p.customQuestions = arr(p.customQuestions).map(normQ).filter(Boolean);
      p.categoryOrder = arr(p.categoryOrder);
      p.decisionStatus = (p.decisionStatus && typeof p.decisionStatus === 'object') ? p.decisionStatus : {};
      p.notes = (p.notes && typeof p.notes === 'object') ? p.notes : {};
      p.shortlist = arr(p.shortlist);
      p.actionItems = arr(p.actionItems);
      return p;
    }
    function normParticipant(p) {
      if (!p || typeof p !== 'object') return null;
      p.id = p.id || uid('p');
      p.name = String(p.name || 'مشارك').slice(0, 120);
      p.sessionId = p.sessionId || uid('s');
      p.answers = (p.answers && typeof p.answers === 'object') ? p.answers : {};
      p.notes = (p.notes && typeof p.notes === 'object') ? p.notes : {};
      p.flags = (p.flags && typeof p.flags === 'object') ? p.flags : {};
      p.skipped = (p.skipped && typeof p.skipped === 'object') ? p.skipped : {};
      p.createdAt = p.createdAt || nowISO();
      p.updatedAt = p.updatedAt || p.createdAt;
      p.lastQuestionId = p.lastQuestionId || null;
      return p;
    }
    function normQ(q) {
      if (!q || typeof q !== 'object') return null;
      q.id = String(q.id || uid('q'));
      q.cat = String(q.cat || 'misc');
      q.type = q.type || 'text';
      q.text = String(q.text || '');
      q.options = arr(q.options);
      q.custom = true;
      return q;
    }

    /* =====================================================================
       QUESTION BANK
       Categories (12). Questions use compact raw arrays:
       [ localId, type, text, options?, extra? ]
       types: one | multi | yesno | text | long | num | rating | rank
       extra: {unit, min, max, maxChoices, showIf:{opt|value}}
       ===================================================================== */
    const CATS = [

      { id: 'skills', name: 'المهارات والخبرة والموارد', icon: '🧰', desc: 'ما الذي تجيده فعلاً؟ وما الأدوات والأصول المتاحة لديك؟' },

      { id: 'capital', name: 'رأس المال والقيود المالية', icon: '💰', desc: 'كم يمكنك أن تخاطر؟ وما حدودك المالية الحقيقية؟' },
      { id: 'time', name: 'الوقت والدراسة والالتزامات', icon: '⏱️', desc: 'كم ساعة يمكنك تخصيصها؟ وما الذي يجب ألّا يتأثر؟' },
      { id: 'models', name: 'نماذج الأعمال والخدمات', icon: '🏗️', desc: 'ما نوع النشاط الذي يريحك؟' },
      { id: 'market', name: 'العملاء والطلب والسوق', icon: '👥', desc: 'من ستخدم؟ وما المشكلة التي تحلّها؟' },
      { id: 'compete', name: 'المنافسة والميزة والحواجز', icon: '⚖️', desc: 'لماذا يسجّل أحدهم قبلك؟ وما الذي يميّزك؟' },

      { id: 'partner', name: 'الشراكة والمسؤوليات والقرارات', icon: '🤝', desc: 'كيف تعمل مع شريكك؟ ومن يقرر؟' },
      { id: 'money', name: 'التكاليف والإيراد والربحية والمخاطر', icon: '📊', desc: 'الاقتصاديات: هل تنجح الأرقام؟' },

    ];
    const CAT_MAP = {}; CATS.forEach(c => { CAT_MAP[c.id] = c; });

    const RAW = {};

    RAW.goals = [
      ['GO01', 'one', 'لماذا تفكر في بدء مشروع الآن تحديداً؟', ['أريد دخلاً إضافياً', 'أريد أن أعمل لحسابي بدل العمل عند الآخرين', 'أريد بناء شيء يكبر معي', 'لديّ فكرة أظنّ أنها تحل مشكلة', 'أريد أن أستخدم مهارتي بشكل أفضل', 'أستكشف فقط قبل أن ألتزم', 'أسباب أخرى']],
      ['GO02', 'long', 'اربط موقفاً أو تجربة سابقة دفعتك للتفكير في مشروع (وليس فقط ما تقرأه).', [], { rows: 4 }],
      ['GO03', 'one', 'ما النتيجة التي تعتبرها «نجاحاً» بعد سنة من البدء؟', ['دخل ثابت يغطي مصاريف', 'دخل كبير مع ادخار', 'مهنة أفضل للمستقبل', 'فريق صغير وتعلّم', 'منتج يعمل ويقبله الناس', 'تحقيق استقلال مالي', 'لا أعرف بعد']],
      ['GO04', 'num', 'كم تتصوّر أن تحتاج شهرياً من الدخل لتشعر أن المشروع يستحق وقتك؟', [], { unit: 'جنيه/شهر', min: 0, step: 100 }],

      ['GO06', 'rank', 'رتّب هذه الأهداف الثلاثة حسب الأولوية لك:', ['استقلال مالي', 'استخدام المهارات', 'كبر المشروع'], { max: 3 }],
      ['GO07', 'one', 'بعد كم مدة تريد أن تكون قد حسمت الأمر (بدأت المشروع أو استبعدته)؟', ['خلال 3 أشهر', 'خلال سنة', 'خلال سنتين', 'أبعد من ذلك', 'لا يوجد موعد نهائي']],
      ['GO08', 'one', 'لو لم يكن هناك مشروع، كيف تتوقع أن يتغير وضعك بعد 5 سنوات؟', ['سأكون في نفس المكان', 'سأتحسّن تدريجياً', 'أشعر بالملل والركود', 'لا أعرف']],

    RAW.skills = [
      ['SK01', 'multi', 'ما المهارات التي تجيدها فعلاً اليوم؟ (اختر ما تستطيع إثباته بمثال أو شهادة أو نتيجة)', ['الكتابة والمحتوى', 'التصميم الجرافيكي', 'البرمجة وتطوير المواقع', 'تطوير التطبيقات', 'تحليل البيانات', 'المحاسبة والتسجيل المحاسبي', 'التسويق الرقمي', 'إدارة المشاريع', 'المبيعات والتواصل', 'التصوير والمونتاج', 'الترجمة', 'التدريس', 'اللوجستيات والتوصيل', 'خدمة العملاء', 'المشتريات والتفاوض', 'الكتابة التقنية']],
      ['SK02', 'one', 'ما مؤهلاتك العلمية أو الدراسية الحالية؟', ['طالب ثانوي', 'طالب جامعة – تخصص تقني/هندسي', 'طالب جامعة – تخصص تجاري/إداري', 'طالب جامعة – تخصص علمي/طبي', 'طالب جامعة – تخصص إنساني/لغوي', 'خريج', 'ماجستير/دكتوراه', 'تعليم مهني/شهادات']],

      if (v === null || v === undefined || v === '') return false;

    function scoreRule(qid, v) {
      const rule = RULES[qid];
      if (!rule) return null;
      if (!isAnswered(v)) return null;
      if (rule.numeric) {
        const n = num(v);
        if (n === null) return null;
        const t = NUM_RULES[qid] || { min: 0, max: 100, higherBetter: true };
        const span = Math.max(1, t.max - t.min);
        let pct = clamp((n - t.min) / span, 0, 1);
        if (!t.higherBetter) pct = 1 - pct;
        return Math.round(20 + pct * 80);
      }
      if (YESNO_QIDS.indexOf(qid) >= 0) {
        if (typeof rule.yes === 'number') return v ? rule.yes : rule.no;
        return null;
      }
      if (typeof v === 'boolean') return v ? (rule.yes || 100) : (rule.no || 50);
      const s = String(v);
      if (rule.good && rule.good.indexOf(s) >= 0) return 100;
      if (rule.ok && rule.ok.indexOf(s) >= 0) return 60;
      if (rule.bad && rule.bad.indexOf(s) >= 0) return 20;
      return null;
    }

      const qs = questionsOf(currentProject(), catId);
      let total = 0, weight = 0, answered = 0;
      qs.forEach(q => {
        const s = scoreRule(q.id, answerOf(pt, q.id));
        const w = 1.4;
        if (s === null) return;
        total += s * w; weight += w; answered++;
      });
      return { score: weight ? Math.round(total / weight) : null, answered, total: qs.length };
    }

    function scoreAll(pt) {
      const cats = {};
      let sum = 0, count = 0;
      CATS.forEach(c => {
        const r = scoreCategory(pt, c.id);
        cats[c.id] = r.score;
        if (r.score !== null) { sum += r.score; count++; }
      });
      const overall = count ? Math.round(sum / count) : null;
      const qs = allQuestions(currentProject());
      const answered = qs.filter(q => isAnswered(answerOf(pt, q.id))).length;
      return { cats, overall, answered, totalQ: qs.length, completeness: qs.length ? Math.round(answered / qs.length * 100) : 0 };
    }

    /* =====================================================================
       COMPATIBILITY / RISK / READINESS
       ===================================================================== */
    function compatibility(pr) {
      const pts = arr(pr.participants);
      if (pts.length < 2) return null;
      const scores = pts.map(p => scoreAll(p));
      const perDim = {};
      let total = 0, n = 0;
      CATS.forEach(c => {
        const vals = scores.map(s => s.cats[c.id]).filter(v => v !== null && v !== undefined);
        if (vals.length < 2) return;
        const score = clamp(100 - Math.abs(vals[0] - vals[1]), 0, 100);
        perDim[c.id] = Math.round(score);
        total += score; n++;
      });
      return { total: n ? Math.round(total / n) : null, perDim };
    }
    function riskList(pt) {
      const out = [];
      const sc = scoreAll(pt);
      const risks = [
        { id: 'capital', label: 'رأس المال محدود', score: sc.cats.capital, low: 45 },
        { id: 'time', label: 'الوقت المتاح لا يكفي', score: sc.cats.time, low: 45 },
        { id: 'market', label: 'السوق غير مُثبت', score: sc.cats.market, low: 45 },
        { id: 'money', label: 'اقتصاديات المشروع غير واضحة', score: sc.cats.money, low: 45 },
        { id: 'compete', label: 'ضعف التميّز أمام المنافسة', score: sc.cats.compete, low: 45 },
        { id: 'partner', label: 'اتفاق الشراكة غير محسوم', score: sc.cats.partner, low: 45 },
        { id: 'validate', label: 'لم تبدأ التحقق من الفكرة', score: sc.cats.validate, low: 45 },
        { id: 'skills', label: 'فجوة في المهارات المطلوبة', score: sc.cats.skills, low: 45 },
        { id: 'goals', label: 'الأهداف غير واضحة', score: sc.cats.goals, low: 45 },
        { id: 'completeness', label: 'الاستبيان غير مكتمل', score: sc.completeness, low: 60 }
      ];
      risks.forEach(r => {
        if (r.score === null || r.score === undefined) return;
        if (r.score < r.low) out.push(Object.assign({}, r, { gap: r.low - r.score }));
      });
      out.sort((a, b) => b.gap - a.gap);
      return out;
    }
    function readinessVerdict(pr) {
      const pts = arr(pr.participants);
      if (!pts.length) return { level: 'none', label: 'لا يوجد مشاركون', tone: 'warn', score: 0 };
      const sc = pts.map(p => scoreAll(p));
      const ovs = sc.map(s => s.overall).filter(v => v !== null);
      const avg = ovs.length ? mean(ovs) : 0;
      const comp = sc.length ? Math.round(mean(sc.map(s => s.completeness))) : 0;
      const compat = compatibility(pr);
      const cv = compat && compat.total !== null ? compat.total : 0;
      const score = Math.round(clamp(avg * 0.5 + comp * 0.25 + cv * 0.25, 0, 100));
      let level = 'go', label = 'الانطلاق', tone = 'ok';
      if (score < 45) { level = 'no'; label = 'تأجيل — لا تلتزم'; tone = 'bad'; }
      else if (score < 65) { level = 'hold'; label = 'احذر — اختبر أولاً'; tone = 'warn'; }
      return { level, label, tone, score, avg: Math.round(avg), completeness: comp, compat: compat ? compat.total : null };
    }
    function ideaSuggestions(pr) {
      const out = [];
      const pts = arr(pr.participants);
      if (!pts.length) return out;
      const sc = pts.map(p => scoreAll(p));
      const catAvg = {};
      CATS.forEach(c => {
        const vals = sc.map(s => s.cats[c.id]).filter(v => v !== null && v !== undefined);
        catAvg[c.id] = vals.length ? Math.round(mean(vals)) : null;
      });
      const models = [], skills = [], caps = [], times = [];
      pts.forEach(p => {
        const mo = answerOf(p, 'MO02');
        if (mo && mo !== 'لا يوجد') models.push(mo);
        const sk = answerOf(p, 'SK17');
        if (sk && sk !== 'لا شيء محدد') skills.push(sk);
        const ca = answerOf(p, 'CA09');
        if (ca) caps.push(ca);
        const ti = answerOf(p, 'TI01');
        if (ti !== undefined && ti !== null && ti !== '') times.push(num(ti) || 0);
      });
      if (models.length) out.push({ icon: '🏗️', title: 'نموذج الأعمال المرجّح', body: 'النماذج المطروحة: ' + uniq(models).join('، ') });
      if (skills.length) out.push({ icon: '🧰', title: 'المهارة المحورية', body: uniq(skills).join('، ') });
      if (times.length) out.push({ icon: '⏱️', title: 'الوقت المتاح أسبوعياً', body: Math.round(mean(times)) + ' ساعة' });
      const strong = CATS.filter(c => catAvg[c.id] !== null).sort((a, b) => catAvg[b.id] - catAvg[a.id]).slice(0, 3);
      if (strong.length) out.push({ icon: '💡', title: 'نقاط القوة', body: strong.map(c => c.name + ' (' + catAvg[c.id] + ')').join('، ') });
      const weak = CATS.filter(c => catAvg[c.id] !== null).sort((a, b) => catAvg[a.id] - catAvg[b.id]).slice(0, 3);
      if (weak.length) out.push({ icon: '⚠️', title: 'نقاط الضعف', body: weak.map(c => c.name + ' (' + catAvg[c.id] + ')').join('، ') });
      return out;
    }

    /* =====================================================================
       APP SHELL — nav, router, helpers
       ===================================================================== */
    const VIEWS = [
      { id: 'projects', name: 'المشاريع', icon: '📁', grp: 'ابدأ هنا' },
      { id: 'participants', name: 'المشاركون', icon: '👤' },
      { id: 'questionnaire', name: 'الاستبيان', icon: '📝', grp: 'التقييم' },
      { id: 'compare', name: 'المقارنة', icon: '⚖️' },
      { id: 'insights', name: 'الرؤى والأفكار', icon: '💡' },

    function toneClass(t) { return t === 'ok' ? 'ok' : t === 'warn' ? 'warn' : t === 'bad' ? 'bad' : 'info'; }
    function setView(v) {
      VIEW = v;

      if (main) main.scrollTop = 0;
      window.scrollTo(0, 0);

    function go(v, cat) {
      if (cat) CAT_VIEW = cat;

    }

    function renderNav() {
      try {
        const nav = $('#nav');
        if (!nav) return;
        let html = '';
        VIEWS.forEach(v => {
          if (v.grp) html += '<div class="grp">' + esc(v.grp) + '</div>';
          let badge = '';
          const pr = currentProject();
          if (v.id === 'participants' && pr) badge = '<span class="badge">' + pr.participants.length + '</span>';

            const pt = currentParticipant();

          }

        console.error('renderNav error:', e);
      }

    function renderTopbar() {
      try {
        const pr = currentProject();
        const tp = $('#tbProject'), tk = $('#tbParticipant');
        if (tp) {
          tp.textContent = pr ? pr.name : 'لا يوجد مشروع';
          tp.className = 'pill info';
        }
        if (tk) {
          const pt = currentParticipant();
          tk.textContent = pt ? pt.name : 'لا يوجد مشارك';
          tk.className = 'pill';
        }
      } catch (e) {
        console.error('renderTopbar error:', e);
      }
    }

    function render() {
      renderNav();
      renderTopbar();
      const host = $('#view');
      if (!host) {
        console.error('Render skipped: #view host not found.');
        return;
      }
      const pr = currentProject();
      let html = '';
      try {
        if (!pr && VIEW !== 'projects' && VIEW !== 'data') {
          html = emptyState('لا يوجد مشروع بعد', 'ابدأ مشروعاً جديداً لتتمكن من استخدام هذه الشاشة.', '📁', 'مشروع جديد', 'new-project');
        } else {
          switch (VIEW) {
            case 'projects': html = viewProjects(); break;
            case 'participants': html = viewParticipants(); break;
            case 'questionnaire': html = viewQuestionnaire(); break;
            case 'compare': html = viewCompare(); break;
            case 'insights': html = viewInsights(); break;
            case 'decision': html = viewDecision(); break;
            case 'actions': html = viewActions(); break;
            case 'data': html = viewData(); break;
            default: html = viewProjects();
          }
        }
      } catch (e) {
        console.error('Render error:', e);
        html = '<div class="empty"><span class="big">⚠️</span>' +
          '<div><strong>خطأ في عرض المحتوى</strong></div>' +
          '<div class="tiny muted" style="margin-top:6px">' + esc(e.message) + '</div>' +
          '<div style="margin-top:12px"><button class="btn primary" onclick="location.reload()">إعادة تحميل الصفحة</button></div>' +
          '</div>';
      }
      host.innerHTML = html;
      bindView();
    }

    function emptyState(big, msg, icon, btnLabel, act) {
      return '<div class="empty"><span class="big">' + (icon || '📭') + '</span>' +
        '<div><strong>' + esc(big) + '</strong></div>' +
        '<div class="tiny muted" style="margin-top:6px">' + esc(msg) + '</div>' +
        (btnLabel ? '<div style="margin-top:12px"><button class="btn primary" data-act="' + act + '">' + esc(btnLabel) + '</button></div>' : '') +
        '</div>';
    }
    function pageHead(title, sub) {
      return '<div class="page-head"><h2>' + esc(title) + '</h2>' +
        (sub ? '<p>' + esc(sub) + '</p>' : '') + '</div>';
    }
    function card(title, body, cls) {
      return '<div class="card ' + (cls || '') + '">' +
        (title ? '<h3>' + esc(title) + '</h3>' : '') + body + '</div>';
    }
    function progressBar(v) {
      const p = v === null || v === undefined ? 0 : clamp(v, 0, 100);
      return '<div class="progress"><i style="width:' + p + '%"></i></div>';
    }
    function scorePill(v) {
      if (v === null || v === undefined) return '<span class="pill">—</span>';
      const t = v >= 70 ? 'ok' : v >= 50 ? 'warn' : 'bad';
      return '<span class="pill ' + t + '">' + v + '</span>';
    }
    function barRow(name, v) {
      const p = v === null || v === undefined ? 0 : clamp(v, 0, 100);
      return '<div class="bar-row"><div class="nm">' + esc(name) + '</div>' +
        '<div class="track"><i style="width:' + p + '%"></i></div>' +
        '<div class="val">' + (v === null || v === undefined ? '—' : v) + '</div></div>';
    }

    /* =====================================================================
       VIEW: PROJECTS
       ===================================================================== */
    function viewProjects() {

      html += '<div class="row no-print" style="margin-bottom:14px">' +
        '<button class="btn primary" data-act="new-project">+ مشروع جديد</button>' +

       VIEW: PARTICIPANTS
       ===================================================================== */

    /* =====================================================================
       VIEW: QUESTIONNAIRE
       ===================================================================== */
    function qInput(q, v, pt) {
      const id = 'q_' + q.id;
      const name = 'qn_' + q.id;
      if (q.type === 'one') {
        return q.options.map(o => {
          const on = v === o;
          return '<label class="opt"><input type="radio" name="' + name + '" data-q="' + esc(q.id) + '" value="' + esc(o) + '"' + (on ? ' checked' : '') + '>' +
            '<span class="txt">' + esc(o) + '</span></label>';
        }).join('');
      }
      if (q.type === 'multi') {
        const cur = arr(v);
        return q.options.map(o => {
          const on = cur.indexOf(o) >= 0;
          return '<label class="opt"><input type="checkbox" data-q="' + esc(q.id) + '" value="' + esc(o) + '"' + (on ? ' checked' : '') + '>' +
            '<span class="txt">' + esc(o) + '</span></label>';
        }).join('');
      }
      if (q.type === 'yesno') {
        return '<div class="row tight">' +
          '<label class="opt"><input type="radio" name="' + name + '" data-q="' + esc(q.id) + '" data-val="1"' + (v === true ? ' checked' : '') + '><span class="txt">نعم</span></label>' +
          '<label class="opt"><input type="radio" name="' + name + '" data-q="' + esc(q.id) + '" data-val="0"' + (v === false ? ' checked' : '') + '><span class="txt">لا</span></label>' +
          '</div>';
      }
      if (q.type === 'rating') {
        const max = q.extra && q.extra.max ? q.extra.max : 5;
        const min = q.extra && q.extra.min ? q.extra.min : 1;
        let out = '<div class="scale">';
        for (let i = min; i <= max; i++) {
          out += '<label><input type="radio" name="' + name + '" data-q="' + esc(q.id) + '" value="' + i + '"' + (num(v) === i ? ' checked' : '') + '>' + i + '</label>';
        }
        out += '</div>';
        return out;
      }
      if (q.type === 'rateeach') {
        const max = q.extra && q.extra.scale ? q.extra.scale : 5;
        const cur = (v && typeof v === 'object') ? v : {};
        return '<div class="table-wrap"><table><thead><tr><th>الهدف</th><th>التقييم</th></tr></thead><tbody>' +
          q.options.map(o => {
            let cells = '';
            for (let i = 1; i <= max; i++) {
              cells += '<td style="text-align:center"><label style="margin:0"><input type="radio" name="re_' + esc(q.id) + '_' + esc(o) + '" data-rate="' + esc(q.id) + '" data-opt="' + esc(o) + '" value="' + i + '"' + (num(cur[o]) === i ? ' checked' : '') + '> ' + i + '</label></td>';
            }
            return '<tr><td>' + esc(o) + '</td>' + cells + '</tr>';
          }).join('') + '</tbody></table></div>';
      }
      if (q.type === 'rank') {
        const cur = arr(v);
        return '<div id="rank_' + esc(q.id) + '" data-rank="' + esc(q.id) + '">' +
          q.options.map(o => '<div class="list-item" draggable="true" data-rank-opt="' + esc(o) + '">' +
            '<span class="badge-q">≡</span><span class="t" style="flex:1">' + esc(o) + '</span>' +
            '<span class="tiny muted">الترتيب ' + (cur.indexOf(o) >= 0 ? (cur.indexOf(o) + 1) : '—') + '</span>' +
            '<button class="btn xs" data-rank-up="' + esc(o) + '" data-q="' + esc(q.id) + '">▲</button>' +
            '<button class="btn xs" data-rank-down="' + esc(o) + '" data-q="' + esc(q.id) + '">▼</button>' +
            '</div>').join('') + '</div>';
      }
      if (q.type === 'num') {
        const e = q.extra || {};
        return '<input type="number" id="' + id + '" data-q="' + esc(q.id) + '" value="' + esc(v === undefined || v === null ? '' : v) + '"' +
          (e.min !== undefined ? ' min="' + e.min + '"' : '') + (e.max !== undefined ? ' max="' + e.max + '"' : '') +
          (e.step !== undefined ? ' step="' + e.step + '"' : '') + '>' +
          (e.unit ? '<div class="tiny muted">' + esc(e.unit) + '</div>' : '');
      }
      if (q.type === 'long') {
        const rows = q.extra && q.extra.rows ? q.extra.rows : 4;
        return '<textarea id="' + id + '" data-q="' + esc(q.id) + '" rows="' + rows + '">' + esc(v === undefined || v === null ? '' : v) + '</textarea>';
      }
      return '<input type="text" id="' + id + '" data-q="' + esc(q.id) + '" value="' + esc(v === undefined || v === null ? '' : v) + '">';
    }

    function viewQuestionnaire() {
      const pr = currentProject();
      const pt = currentParticipant();
      let html = pageHead('الاستبيان', 'أجب عن الأسئلة في كل قسم — يمكنك التخطي والعودة لاحقاً.');
      if (!pt) {
        html += card('', emptyState('لا يوجد مشارك', 'أضف مشاركاً ثم عد إلى هنا.', '👤', 'إضافة مشارك', 'add-participant'));
        return html;
      }
      html += '<div class="row no-print" style="margin-bottom:12px">' +
        '<label style="margin:0">المشارك</label>' +
        '<select class="sel" id="ptSel" aria-label="المشارك">' +
        arr(pr.participants).map(p => '<option value="' + esc(p.id) + '"' + (p.id === pt.id ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('') +
        '</select><span class="spacer"></span>' +
        '<button class="btn sm" data-act="prev-cat">◀ السابق</button>' +
        '<button class="btn sm" data-act="next-cat">التالي ▶</button></div>';

      const sc = scoreAll(pt);
      html += card('التقدم العام',
        '<div class="row"><div style="flex:1">' + progressBar(sc.completeness) + '</div>' +

    /* =====================================================================
       MODAL + PROMPTS
       ===================================================================== */
    function openModal(title, bodyHtml, onOk, okLabel) {
      const host = $('#modalHost');
      host.innerHTML = '<div class="modal-back" data-modal-back>' +
        '<div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
        '<h3>' + esc(title) + '</h3>' +
        '<div class="modal-body">' + bodyHtml + '</div>' +
        '<div class="row" style="justify-content:flex-end;margin-top:14px">' +
        '<button class="btn ghost" data-modal-cancel>إلغاء</button>' +
        '<button class="btn primary" data-modal-ok>' + esc(okLabel || 'حفظ') + '</button>' +
        '</div></div></div>';
      const back = $('[data-modal-back]', host);
      const close = () => { host.innerHTML = ''; };
      on(host, '[data-modal-cancel]', 'click', close);
      on(host, '[data-modal-back]', 'click', (e) => { if (e.target === back) close(); });
      on(host, '[data-modal-ok]', 'click', () => {
        const ok = onOk();
        if (ok !== false) close();
      });
      const inp = $('input,textarea', host);
      if (inp) { inp.focus(); if (inp.select) inp.select(); }
      return close;
    }
    function promptText(title, label, value, onOk, multiline) {
      const v = value === undefined || value === null ? '' : value;
      openModal(title,
        '<label>' + esc(label) + '</label>' +
        (multiline
          ? '<textarea id="pmIn" rows="4">' + esc(v) + '</textarea>'
          : '<input type="text" id="pmIn" value="' + esc(v) + '">'),
        () => { const val = $('#pmIn').value.trim(); if (!val) { toast('اكتب قيمة أولاً', 'warn'); return false; } onOk(val); return true; });
      const inp = $('#pmIn');
      if (inp) inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !multiline) { e.preventDefault(); const b = $('[data-modal-ok]'); if (b) b.click(); } });
    }
    function confirmBox(title, message, onOk) {
      openModal(title, '<div>' + esc(message) + '</div>', () => { onOk(); return true; }, 'تأكيد');
    }

    /* =====================================================================
       IMPORT / EXPORT
       ===================================================================== */
    function download(filename, content, mime) {
      const blob = new Blob([content], { type: mime || 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
    }
    function exportJSON() {
      const data = JSON.stringify(S, null, 2);
      download('business-discovery-' + todayISO() + '.json', data, 'application/json;charset=utf-8');
      toast('تم تصدير الملف', 'ok');
    }
    function csvCell(v) {
      const s = v === undefined || v === null ? '' : String(v);
      return '"' + s.replace(/"/g, '""') + '"';
    }
    function exportCSV() {
      const pr = currentProject();
      if (!pr) { toast('لا يوجد مشروع', 'warn'); return; }
      const pts = arr(pr.participants);
      const qs = allQuestions(pr);
      const rows = [];
      rows.push(['المشروع', pr.name]);
      rows.push(['المشارك', 'القسم', 'السؤال', 'الإجابة', 'الدرجة']);
      pts.forEach(p => {
        const sc = scoreAll(p);
        rows.push([p.name, '—', 'الدرجة الكلية', '', sc.overall === null ? '' : sc.overall]);
        CATS.forEach(c => {
          rows.push([p.name, c.name, 'درجة القسم', '', sc.cats[c.id] === null || sc.cats[c.id] === undefined ? '' : sc.cats[c.id]]);
        });
        qs.forEach(q => {
          const v = answerOf(p, q.id);
          rows.push([p.name, (CAT_MAP[q.cat] ? CAT_MAP[q.cat].name : q.cat), q.text, answerText(q, v)]);
        });
      });
      const csv = '\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
      download('business-discovery-' + todayISO() + '.csv', csv, 'text/csv;charset=utf-8');
      toast('تم تصدير CSV', 'ok');
    }
    function importJSON(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(String(reader.result));
          if (!data || !Array.isArray(data.projects)) throw new Error('صيغة غير صالحة');
          S = Object.assign(defaultState(), data);
          saveState(true);
          toast('تم الاستيراد بنجاح', 'ok');
          render();
        } catch (e) {
          toast('تعذّر قراءة الملف: ' + e.message, 'bad');
        }
      };
      reader.readAsText(file, 'utf-8');
    }
    function importCSV(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const txt = String(reader.result).replace(/^\ufeff/, '');
          const lines = txt.split(/\r?\n/).filter(l => l.trim());
          if (!lines.length) throw new Error('ملف فارغ');
          const pr = currentProject();
          if (!pr) { toast('أنشئ مشروعاً أولاً', 'warn'); return; }
          const parse = (line) => {
            const out = []; let cur = '', inQ = false;
            for (let i = 0; i < line.length; i++) {
              const ch = line[i];
              if (ch === '"') {
                if (inQ && line[i + 1] === '"') { cur += '"'; i++; }
                else inQ = !inQ;
              } else if (ch === ',' && !inQ) { out.push(cur); cur = ''; }
              else cur += ch;
            }
            out.push(cur); return out;
          };
          const rows = lines.map(parse);
          let matched = 0;
          rows.forEach(r => {
            const [name, catName, qtext, ans] = r;
            if (!qtext || !ans) return;
            const pt = pr.participants.find(x => x.name === name);
            if (!pt) return;
            const q = allQuestions(pr).find(x => x.text === qtext);
            if (!q) return;
            let val = ans;
            if (q.type === 'yesno') val = /^(نعم|yes|true|1)$/i.test(ans.trim());
            else if (q.type === 'num' || q.type === 'rating') val = num(ans);
            setAnswer(pt, q.id, val);
            matched++;
          });
          saveState(true);
          toast('تم استيراد ' + matched + ' إجابة', matched ? 'ok' : 'warn');
          render();
        } catch (e) {
          toast('تعذّر قراءة الملف: ' + e.message, 'bad');
        }
      };
      reader.readAsText(file, 'utf-8');
    }
    function wipeAll() {
      confirmBox('مسح كل البيانات', 'سيتم حذف كل المشاريع والمشاركين والإجابات نهائياً. هل أنت متأكد؟', () => {
        lsDel(APP.dataKey);
        S = defaultState();
        saveState(true);
        toast('تم مسح البيانات', 'ok');
        go('projects');
      });
    }

    /* =====================================================================
       EVENT WIRING
       ===================================================================== */
    function answerFromInput(el) {
      const qid = el.getAttribute('data-q');
      const q = allQuestions(currentProject()).find(x => x.id === qid);
      const type = el.getAttribute('type');
      if (el.hasAttribute('data-val')) return el.getAttribute('data-val') === '1';
      if (type === 'checkbox') return el.value;
      if (type === 'radio') {
        if (q && q.type === 'rating') return num(el.value);
        return el.value;
      }
      if (el.type === 'number') return el.value === '' ? '' : num(el.value);
      return el.value;
    }
    function refreshQuestionnaireLight(pt, qid) {
      const card = $('[data-qcard="' + qid + '"]');
      if (!card) return;
      const answered = isAnswered(answerOf(pt, qid));
      card.classList.toggle('answered', answered);
      const meta = $('.qmeta', card);
      if (meta) {
        const flags = pt.flags && pt.flags[qid];
        const sk = pt.skipped && pt.skipped[qid];
        meta.innerHTML = '<span class="badge-q">' + esc(qid) + '</span>' +
          (answered ? '<span class="pill ok">مُجاب</span>' : sk ? '<span class="pill warn">متخطّى</span>' : '') +
          (flags ? '<span class="pill bad">معلّم</span>' : '');
      }
    }
    function updateProgress() {
      const pt = currentParticipant();
      if (!pt) return;
      const sc = scoreAll(pt);
      const bar = $('#view .progress i');
      if (bar) bar.style.width = clamp(sc.completeness, 0, 100) + '%';
      const pill = $('#view .card .row .pill');
      if (pill && /%$/.test(pill.textContent)) {
        pill.textContent = sc.completeness + '%';
        pill.className = 'pill ' + (sc.completeness >= 80 ? 'ok' : sc.completeness >= 40 ? 'warn' : 'bad');
      }
    }

    function bindView() {
      const pr = currentProject();
      const pt = currentParticipant();

      $$('#view [data-act]').forEach(b => {
        b.addEventListener('click', (e) => {
          handleAction(b.getAttribute('data-act'), b.getAttribute('data-id'), b, e);
        });
      });

      const prjSel = $('#prjSel');
      if (prjSel) {
        prjSel.innerHTML = arr(S.projects).map(p =>
          '<option value="' + esc(p.id) + '"' + (p.id === S.activeProjectId ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('');
        prjSel.addEventListener('change', () => {
          S.activeProjectId = prjSel.value;
          S.activeParticipantId = null;
          saveState(true);
          render();
        });
      }
      const ptSel = $('#ptSel');
      if (ptSel) {
        ptSel.addEventListener('change', () => {
          S.activeParticipantId = ptSel.value;
          saveState(true);
          render();
        });
      }
      const pn = $('#projNotes');
      if (pn && pr) {
        pn.addEventListener('input', () => {
          pr.notes = pr.notes || {};
          pr.notes.main = pn.value;
          pr.updatedAt = nowISO();
          saveState();
        });
      }
      const cn = $('#catNotes');
      if (cn && pt) {
        cn.addEventListener('input', () => {
          pt.notes = pt.notes || {};
          pt.notes[CAT_VIEW] = cn.value;
          pt.updatedAt = nowISO();
          saveState();
        });
      }
      const dn = $('#decNotes');
      if (dn && pr) {
        dn.addEventListener('input', () => {
          pr.decisionStatus = pr.decisionStatus || { final: '', notes: '' };
          pr.decisionStatus.notes = dn.value;
          saveState();
        });
      }
      $$('#qList [data-q]').forEach(el => {
        el.addEventListener('change', () => {
          const qid = el.getAttribute('data-q');
          const q = allQuestions(pr).find(x => x.id === qid);
          if (!q || !pt) return;
          if (q.type === 'multi') {
            const boxes = $$('#qList input[data-q="' + qid + '"]');
            setAnswer(pt, qid, boxes.filter(b => b.checked).map(b => b.value));
          } else {
            setAnswer(pt, qid, answerFromInput(el));
          }
          refreshQuestionnaireLight(pt, qid);
          updateProgress();
        });
      });
      $$('#qList [data-rate]').forEach(el => {
        el.addEventListener('change', () => {
          const qid = el.getAttribute('data-rate');
          const opt = el.getAttribute('data-opt');
          const cur = (pt.answers[qid] && typeof pt.answers[qid] === 'object') ? pt.answers[qid] : {};
          cur[opt] = num(el.value);
          setAnswer(pt, qid, cur);
          refreshQuestionnaireLight(pt, qid);
          updateProgress();
        });
      });

      $$('#qList [data-rank-up], #qList [data-rank-down]').forEach(b => {
        b.addEventListener('click', () => {
          const qid = b.getAttribute('data-q');
          const opt = b.getAttribute('data-rank-up') || b.getAttribute('data-rank-down');
          const up = !!b.getAttribute('data-rank-up');
          const list = arr(answerOf(pt, qid)).slice();
          const i = list.indexOf(opt);
          if (i < 0) list.push(opt);
          else {
            const j = up ? i - 1 : i + 1;
            if (j < 0 || j >= list.length) return;
            list.splice(j, 0, list.splice(i, 1)[0]);
          }
          setAnswer(pt, qid, list);
          render();
        });
      });
      $$('#view [data-task-check]').forEach(cb => {
        cb.addEventListener('change', () => {
          const item = arr(pr.actionItems).find(x => x.id === cb.getAttribute('data-task-check'));
          if (!item) return;
          item.done = cb.checked;
          saveState(true);
          render();
        });
      });
      $$('#view [data-task-status]').forEach(sel => {
        sel.addEventListener('change', () => {
          const item = arr(pr.actionItems).find(x => x.id === sel.getAttribute('data-task-status'));
          if (!item) return;
          item.status = sel.value;
          saveState(true);
          render();
        });
      });
      const nt = $('#newTask');
      if (nt) {
        nt.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); const b = $('[data-act="add-task"]'); if (b) b.click(); }
        });
      }
      $$('#view input[name="decision"]').forEach(r => {
        r.addEventListener('change', () => {
          if (!pr) return;
          pr.decisionStatus = pr.decisionStatus || { final: '', notes: '' };
          pr.decisionStatus.final = r.value;
          saveState();
        });
      });
    }

    /* =====================================================================
       ACTION DISPATCH
       ===================================================================== */
    function handleAction(act, id, el) {
      const pr = currentProject();
      const pt = currentParticipant();
      switch (act) {
        case 'new-project': newProject(); break;
        case 'add-participant': addParticipant(); break;
        case 'import-json': { const f = $('#fileInput'); if (f) { f.value = ''; f.click(); } break; }
        case 'import-csv': { const f = $('#csvInput'); if (f) { f.value = ''; f.click(); } break; }
        case 'export-json': exportJSON(); break;
        case 'export-csv': exportCSV(); break;
        case 'save-now': saveState(true); toast('تم الحفظ', 'ok'); break;
        case 'wipe': wipeAll(); break;
        case 'print-report': printReport(); break;
        case 'open-project':
          if (id) {
            S.activeProjectId = id;
            S.activeParticipantId = null;
            saveState(true);
            go('participants');
          }
          break;
        case 'rename-project': {
          const p = byId(S.projects, id);
          if (!p) break;
          promptText('إعادة تسمية المشروع', 'الاسم الجديد', p.name, (nm) => { p.name = nm; saveState(true); render(); });
          break;
        }
        case 'duplicate-project': {
          const p = byId(S.projects, id);
          if (!p) break;
          const copy = JSON.parse(JSON.stringify(p));
          copy.id = uid('prj');
          copy.name = p.name + ' (نسخة)';
          copy.createdAt = nowISO();
          copy.participants.forEach(x => { x.id = uid('pt'); });
          S.projects.push(copy);
          saveState(true);
          toast('تم نسخ المشروع', 'ok');
          render();
          break;
        }
        case 'delete-project':
          if (!id) break;
          confirmBox('حذف المشروع', 'سيتم حذف المشروع وجميع المشاركين وإجاباتهم. متابعة؟', () => {
            S.projects = S.projects.filter(p => p.id !== id);
            if (S.activeProjectId === id) { S.activeProjectId = null; S.activeParticipantId = null; }
            saveState(true);
            toast('تم الحذف', 'ok');
            render();
          });
          break;
        case 'select-participant':
          if (!id) break;
          S.activeParticipantId = id;
          saveState(true);
          go('questionnaire');
          break;
        case 'rename-participant': {
          const p = byId(pr.participants, id);
          if (!p) break;
          promptText('تعديل الاسم', 'الاسم الجديد', p.name, (nm) => { p.name = nm; saveState(true); render(); });
          break;
        }
        case 'delete-participant':
          if (!id) break;
          confirmBox('حذف المشارك', 'سيتم حذف إجابات هذا المشارك نهائياً. متابعة؟', () => {
            pr.participants = pr.participants.filter(x => x.id !== id);
            if (S.activeParticipantId === id) S.activeParticipantId = null;
            saveState(true);
            toast('تم الحذف', 'ok');
            render();
          });
          break;
        case 'pick-cat':
          CAT_VIEW = el.getAttribute('data-cat');
          render();
          break;
        case 'prev-cat': {
          const i = CATS.findIndex(c => c.id === CAT_VIEW);
          CAT_VIEW = CATS[(i - 1 + CATS.length) % CATS.length].id;
          render();
          break;
        }
        case 'next-cat': {
          const i = CATS.findIndex(c => c.id === CAT_VIEW);
          CAT_VIEW = CATS[(i + 1) % CATS.length].id;
          render();
          break;
        }
        case 'skip-q': {
          if (!pt || !id) break;
          pt.skipped = pt.skipped || {};
          if (pt.skipped[id]) delete pt.skipped[id]; else pt.skipped[id] = true;
          saveState(true);
          render();
          break;
        }
        case 'flag-q': {
          if (!pt || !id) break;
          pt.flags = pt.flags || {};
          if (pt.flags[id]) delete pt.flags[id]; else pt.flags[id] = true;
          saveState(true);
          render();
          break;
        }
        case 'clear-q': {
          if (!pt || !id) break;
          delete pt.answers[id];
          saveState(true);
          render();
          break;
        }
        case 'save-decision': {
          if (!pr) break;
          const sel = $('input[name="decision"]:checked');
          pr.decisionStatus = pr.decisionStatus || { final: '', notes: '' };
          pr.decisionStatus.final = sel ? sel.value : pr.decisionStatus.final;
          const dn = $('#decNotes');
          if (dn) pr.decisionStatus.notes = dn.value;
          saveState(true);
          toast('تم حفظ القرار', 'ok');
          break;
        }
        case 'add-task': {
          if (!pr) break;
          const inp = $('#newTask');
          const text = inp ? inp.value.trim() : '';
          if (!text) { toast('اكتب نص المهمة أولاً', 'warn'); if (inp) inp.focus(); break; }
          pr.actionItems = arr(pr.actionItems);
          pr.actionItems.push({
            id: uid('task'), text: text, status: 'todo', done: false,
            owner: '', due: '', createdAt: nowISO()
          });
          saveState(true);
          toast('تمت إضافة المهمة', 'ok');
          render();
          break;
        }
        case 'delete-task': {
          if (!pr || !id) break;
          pr.actionItems = arr(pr.actionItems).filter(t => t.id !== id);
          saveState(true);
          render();
          break;
        }
        default: break;
      }
    }

    /* =====================================================================
       PRINT REPORT
       ===================================================================== */
    function printReport() {
      const pr = currentProject();
      if (!pr) { toast('لا يوجد مشروع', 'warn'); return; }
      const pts = arr(pr.participants);
      const v = readinessVerdict(pr);
      const compat = compatibility(pr);
      const win = window.open('', '_blank');
      if (!win) { toast('تعذّر فتح نافذة الطباعة — تحقّق من مانع النوافذ', 'warn'); return; }
      let h = '<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">' +
        '<title>تقرير — ' + esc(pr.name) + '</title>' +
        '<style>body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7;margin:24px;color:#111}' +
        'h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:18px 0 6px;border-bottom:1px solid #999;padding-bottom:3px}' +
        'table{border-collapse:collapse;width:100%;font-size:12px;margin-top:6px}' +
        'th,td{border:1px solid #999;padding:4px 6px;text-align:right}' +
        'th{background:#eee}.muted{color:#666;font-size:11px}.kpi{display:flex;gap:12px;flex-wrap:wrap}' +
        '.kpi div{border:1px solid #999;padding:6px 10px;font-size:12px}</style></head><body>';
      h += '<div class="print-head"><div class="t">تقرير مشروع: ' + esc(pr.name) + '</div>' +
        '<div class="m">تاريخ التقرير: ' + esc(todayISO()) + ' · عدد المشاركين: ' + pts.length + '</div></div>';
      h += '<h2>الخلاصة</h2><div class="kpi">' +
        '<div>الدرجة: <strong>' + (v.score || 0) + '/100</strong></div>' +
        '<div>التوصية: <strong>' + esc(v.label) + '</strong></div>' +
        '<div>متوسط الدرجات: <strong>' + (v.avg === null ? '—' : v.avg) + '</strong></div>' +
        '<div>اكتمال الاستبيان: <strong>' + v.completeness + '%</strong></div>' +
        '<div>التوافق: <strong>' + (v.compat === null ? '—' : v.compat) + '</strong></div></div>';
      if (pr.decisionStatus && pr.decisionStatus.final) {
        const d = DECISIONS.find(x => x.id === pr.decisionStatus.final);
        h += '<h2>القرار</h2><p><strong>' + esc(d ? d.label : pr.decisionStatus.final) + '</strong></p>' +
          (pr.decisionStatus.notes ? '<p>' + esc(pr.decisionStatus.notes) + '</p>' : '');
      }
      h += '<h2>الدرجات حسب القسم</h2><table><thead><tr><th>القسم</th>' +
        pts.map(p => '<th>' + esc(p.name) + '</th>').join('') + '<th>الفارق</th></tr></thead><tbody>';
      CATS.forEach(c => {
        const vals = pts.map(p => scoreAll(p).cats[c.id]);
        const nums = vals.filter(x => x !== null && x !== undefined);
        const gap = nums.length >= 2 ? Math.abs(nums[0] - nums[1]) : null;
        h += '<tr><td>' + esc(c.name) + '</td>' +
          vals.map(x => '<td>' + (x === null || x === undefined ? '—' : x) + '</td>').join('') +
          '<td>' + (gap === null ? '—' : gap) + '</td></tr>';
      });
      h += '</tbody></table>';
      if (compat) {
        h += '<h2>توافق الأقسام</h2><table><thead><tr><th>القسم</th><th>الدرجة</th></tr></thead><tbody>' +
          CATS.filter(c => compat.perDim[c.id] !== undefined)
            .map(c => '<tr><td>' + esc(c.name) + '</td><td>' + compat.perDim[c.id] + '</td></tr>').join('') +
          '</tbody></table>';
      }
      h += '<h2>إجابات المشاركين</h2>';
      pts.forEach(p => {
        h += '<div class="print-cat">' + esc(p.name) + ' — الدرجة ' + (scoreAll(p).overall === null ? '—' : scoreAll(p).overall) + '</div>';
        h += '<table><thead><tr><th>السؤال</th><th>الإجابة</th></tr></thead><tbody>';
        allQuestions(pr).forEach(q => {
          const val = answerOf(p, q.id);
          h += '<tr><td>' + esc(q.text) + '</td><td>' + esc(answerText(q, val) || '—') + '</td></tr>';
        });
        h += '</tbody></table>';
      });
      const items = arr(pr.actionItems);
      if (items.length) {
        h += '<h2>المهام</h2><table><thead><tr><th>المهمة</th><th>الحالة</th><th>منجز</th></tr></thead><tbody>' +
          items.map(i => '<tr><td>' + esc(i.text) + '</td><td>' + esc(TASK_GROUPS[i.status] || i.status) + '</td><td>' + (i.done ? 'نعم' : 'لا') + '</td></tr>').join('') +
          '</tbody></table>';
      }
      h += '<div class="print-foot">مستكشف المشاريع — تقرير محلي بدون إنترنت · ' + esc(todayISO()) + '</div>';
      // Build closing tags in pieces so the HTML parser does not mistake them
      // for the end of this inline script while reading the source file.
      h += '<' + '/body><' + '/html>';
      win.document.open(); win.document.write(h); win.document.close();
      win.focus();
      setTimeout(() => { try { win.print(); } catch (e) { } }, 400);
    }

    /* =====================================================================
       THEME + INIT
       ===================================================================== */
    function loadPrefs() {
      try { return JSON.parse(lsGet(APP.prefKey) || '{}') || {}; } catch (e) { return {}; }
    }
    function applyTheme(theme) {
      const t = theme === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      lsSet(APP.prefKey, JSON.stringify(Object.assign(loadPrefs(), { theme: t })));
      const b = $('#themeBtn');
      if (b) b.textContent = t === 'dark' ? 'المظهر: داكن ☾' : 'المظهر: فاتح ☀';
    }
    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      applyTheme(cur === 'dark' ? 'light' : 'dark');
    }
    function initShell() {
      on(document, '#themeBtn', 'click', toggleTheme);
      on(document, '#wipeBtn', 'click', () => wipeAll());
      on(document, '#saveNowBtn', 'click', () => { saveState(true); toast('تم الحفظ', 'ok'); });
      on(document, '#menuBtn', 'click', () => {
        const sb = $('#sidebar');
        if (sb) sb.classList.toggle('open');
      });
      on(document, '#fileInput', 'change', (e) => {
        const f = e.target.files && e.target.files[0];
        if (f) importJSON(f);
      });
      on(document, '#csvInput', 'change', (e) => {
        const f = e.target.files && e.target.files[0];
        if (f) importCSV(f);
      });
      window.addEventListener('hashchange', () => {
        const v = location.hash.replace('#', '');
        if (v && v !== VIEW && VIEWS.some(x => x.id === v)) { VIEW = v; render(); }
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          const host = $('#modalHost');
          if (host) host.innerHTML = '';
        }
      });
      window.addEventListener('beforeunload', () => saveState(true));
    }
    function init() {
      const prefs = loadPrefs();
      applyTheme(prefs.theme || 'light');
      loadState();
      if (!storeAvailable()) {
        toast('التخزين المحلي غير متاح — لن تُحفظ بياناتك. استخدم التصدير.', 'warn');
      }
      const hash = location.hash.replace('#', '');
      if (hash && VIEWS.some(x => x.id === hash)) VIEW = hash;
      initShell();
      render();
      if (!arr(S.projects).length) {
        setTimeout(() => { toast('ابدأ بإنشاء مشروع وإضافة المشاركين', 'info'); }, 600);
      }
    }
    /* ---------- global error handler ---------- */
    window.addEventListener('error', (e) => {
      console.error('Uncaught error:', e.message, e.filename, e.lineno, e.colno);
      const host = $('#view');
      if (host && !host.innerHTML.trim()) {
        host.innerHTML = '<div class="empty"><span class="big">⚠️</span>' +
          '<div><strong>حدث خطأ أثناء تحميل الصفحة</strong></div>' +
          '<div class="tiny muted" style="margin-top:6px">' + esc(e.message) + '</div>' +
          '<div style="margin-top:12px"><button class="btn primary" onclick="location.reload()">إعادة تحميل الصفحة</button></div>' +
          '</div>';
      }
    });

    window.addEventListener('unhandledrejection', (e) => {
      console.error('Unhandled promise rejection:', e.reason);
      const host = $('#view');
      if (host && !host.innerHTML.trim()) {
        host.innerHTML = '<div class="empty"><span class="big">⚠️</span>' +
          '<div><strong>حدث خطأ غير متوقع</strong></div>' +
          '<div class="tiny muted" style="margin-top:6px">حدث خطأ في تحميل البيانات</div>' +
          '<div style="margin-top:12px"><button class="btn primary" onclick="location.reload()">إعادة تحميل الصفحة</button></div>' +
          '</div>';
      }
    });

    function safeInit() {
      try {
        init();
      } catch (e) {
        console.error('Init failed:', e);
        const host = $('#view');
        if (host) {
          host.innerHTML = '<div class="empty"><span class="big">⚠️</span>' +
            '<div><strong>فشل تهيئة التطبيق</strong></div>' +
            '<div class="tiny muted" style="margin-top:6px">' + esc(e.message) + '</div>' +
            '<div style="margin-top:12px"><button class="btn primary" onclick="location.reload()">إعادة تحميل الصفحة</button></div>' +
            '</div>';
        }
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', safeInit);
    } else {
      safeInit();
    }

  </script>
</body>
