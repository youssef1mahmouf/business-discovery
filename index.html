      on(document, '#csvInput', 'change', (e) => {
        const f = e.target.files && e.target.files[0];
        if (f) importCSV(f);
      });
      window.addEventListener('hashchange', () => {
        const v = location.hash.replace('#', '');
        if (v && v !== VIEW && VIEWS.some(x => x.id === v)) { VIEW = v; render(); }
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          const host = $('#modalHost');
          if (host) host.innerHTML = '';
        }
      });
      const saveBeforePageExit = () => {
        if (!AUTH_USER) return;
        // localStorage is synchronous; persist here even if the browser closes
        // before a pending debounce fires, then begin the remote write.
        const ok = lsSet(accountDataKey(), JSON.stringify(S));
        if (!ok) {
          const el = $('#saveState');
          if (el) { el.textContent = 'تعذّر الحفظ المحلي — استخدم التصدير'; el.style.color = 'var(--danger)'; }
        }
        if (cloudReady() && STATE_REVISION > CLOUD_SYNCED_REVISION) {
          syncCloudState().catch(e => console.error('exit cloud sync failed', e));
        }
      };
      window.addEventListener('beforeunload', saveBeforePageExit);
      window.addEventListener('pagehide', saveBeforePageExit);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') saveBeforePageExit();
      });
      window.setInterval(() => {
        if (!AUTH_USER) return;
        const ok = lsSet(accountDataKey(), JSON.stringify(S));
        if (!ok) {
          const el = $('#saveState');
          if (el) { el.textContent = 'تعذّر الحفظ المحلي — استخدم التصدير'; el.style.color = 'var(--danger)'; }
          return;
        }
        if (cloudReady() && STATE_REVISION > CLOUD_SYNCED_REVISION) {
          syncCloudState().catch(e => {
            console.error('automatic cloud save failed', e);
            const el = $('#saveState');
            if (el) { el.textContent = 'الحفظ المحلي يعمل؛ تعذرت المزامنة السحابية'; el.style.color = 'var(--danger)'; }
          });
        }
      }, 60000);
    }
    async function init() {
      const prefs = loadPrefs();
      applyTheme(prefs.theme || 'light');
      initShell();
      const urlInvite = new URLSearchParams(location.search).get('invite');
      if (urlInvite) lsSet(PENDING_INVITE_KEY, urlInvite);
      if (!storeAvailable()) {
        toast('التخزين المحلي غير متاح — لن تُحفظ بياناتك. استخدم التصدير.', 'warn');
      }
      if (window.supabaseReady) await window.supabaseReady;
      if (!makeCloudClient()) {
        authScreen(window.supabase ? '' : 'تعذر تحميل مكتبة Supabase. تحقق من اتصال الإنترنت ثم أعد تحميل الصفحة.');
        return;
      }
      try {
        const { data, error } = await SUPA.auth.getSession();
        if (error) throw error;
        if (data.session) {
          if (location.hash.includes('type=recovery')) { authScreen('', 'recovery'); return; }
          await enterApp(data.session.user); return;
        }
      } catch (e) { authScreen('تعذر الاتصال بـ Supabase: ' + e.message, 'login'); return; }
      authScreen('', 'login');
    }
    /* ---------- global error handler ---------- */
    window.addEventListener('error', (e) => {
      console.error('Uncaught error:', e.message, e.filename, e.lineno, e.colno);
      const host = $('#view');
      if (host && !host.innerHTML.trim()) {
        host.innerHTML = '<div class="empty"><span class="big">⚠️</span>' +
          '<div><strong>حدث خطأ أثناء تحميل الصفحة</strong></div>' +
          '<div class="tiny muted" style="margin-top:6px">' + esc(e.message) + '</div>' +
          '<div style="margin-top:12px"><button class="btn primary" onclick="location.reload()">إعادة تحميل الصفحة</button></div>' +
          '</div>';
      }
    });

    window.addEventListener('unhandledrejection', (e) => {
      console.error('Unhandled promise rejection:', e.reason);
      const host = $('#view');
      if (host && !host.innerHTML.trim()) {
        host.innerHTML = '<div class="empty"><span class="big">⚠️</span>' +
          '<div><strong>حدث خطأ غير متوقع</strong></div>' +
          '<div class="tiny muted" style="margin-top:6px">حدث خطأ في تحميل البيانات</div>' +
          '<div style="margin-top:12px"><button class="btn primary" onclick="location.reload()">إعادة تحميل الصفحة</button></div>' +
          '</div>';
      }
    });

    function safeInit() {
      try {
        init().catch(e => { console.error('Init failed:', e); authScreen(e.message || 'فشل تشغيل التطبيق'); });
      } catch (e) {
        console.error('Init failed:', e);
        const host = $('#view');
        if (host) {
          host.innerHTML = '<div class="empty"><span class="big">⚠️</span>' +
            '<div><strong>فشل تهيئة التطبيق</strong></div>' +
            '<div class="tiny muted" style="margin-top:6px">' + esc(e.message) + '</div>' +
            '<div style="margin-top:12px"><button class="btn primary" onclick="location.reload()">إعادة تحميل الصفحة</button></div>' +
            '</div>';
        }
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', safeInit);
    } else {
      safeInit();
    }

  </script>
</body>

</html>
