<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>مستكشف المشاريع – نظام اكتشاف الأعمال وقرار الشراكة</title>
  <meta name="description" content="تطبيق يعمل دون اتصال بالإنترنت لتقييم واكتشاف مشروع تجاري مناسب لشريكين">
  <style>
    * {
      box-sizing: border-box
    }

    :root {
      --bg: #f3f6fa;
      --surface: #ffffff;
      --surface2: #eef2f7;
      --text: #15202d;
      --muted: #5b6b7e;
      --line: #dbe2ec;
      --primary: #1f5fa8;
      --primary-ink: #ffffff;
      --primary-soft: #e8f0fa;
      --accent: #0d8f7d;
      --warn: #a86a12;
      --warn-soft: #fdf3e0;
      --danger: #b4332f;
      --danger-soft: #fdecea;
      --ok: #17744a;
      --ok-soft: #e6f5ed;
      --info: #4a5568;
      --shadow: 0 1px 2px rgba(16, 30, 48, .06), 0 6px 20px rgba(16, 30, 48, .07);
      --radius: 12px;
      --radius-sm: 8px;
      --fs: 15px;
      --maxw: 1180px;
    }

    [data-theme="dark"] {
      --bg: #0e131b;
      --surface: #161d27;
      --surface2: #1d2733;
      --text: #e7eef7;
      --muted: #9cb0c6;
      --line: #293545;
      --primary: #6aa9e6;
      --primary-ink: #06121f;
      --primary-soft: #17293d;
      --accent: #3cc3ad;
      --warn: #e3b75a;
      --warn-soft: #2e2716;
      --danger: #ef7b76;
      --danger-soft: #33191a;
      --ok: #59cf95;
      --ok-soft: #12301f;
      --info: #b6c2d2;
      --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .35);
    }

    html,
    body {
      margin: 0;
      padding: 0
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, "Traditional Arabic", "Noto Naskh Arabic", Arial, sans-serif;
      font-size: var(--fs);
      line-height: 1.75;
      direction: rtl;
      -webkit-text-size-adjust: 100%;
      overflow-x: hidden
    }

    h1,
    h2,
    h3,
    h4 {
      line-height: 1.4;
      margin: 0 0 .4em
    }

    h1 {
      font-size: 1.5rem
    }

    h2 {
      font-size: 1.22rem
    }

    h3 {
      font-size: 1.05rem
    }

    h4 {
      font-size: .98rem
    }

    p {
      margin: .4em 0
    }

    a {
      color: var(--primary)
    }

    small {
      font-size: .85em
    }

    code,
    kbd {
      font-family: Consolas, monospace;
      background: var(--surface2);
      padding: 1px 5px;
      border-radius: 5px;
      font-size: .9em;
      border: 1px solid var(--line)
    }

    hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 16px 0
    }

    :focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 2px;
      border-radius: 4px
    }

    /* layout */
    .app {
      display: flex;
      min-height: 100vh
    }

    .sidebar {
      width: 264px;
      flex: 0 0 264px;
      background: var(--surface);
      border-inline-start: 1px solid var(--line);
      padding: 16px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto
    }

    .brand {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 6px
    }

    .brand .logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--primary);
      color: var(--primary-ink);
      display: grid;
      place-items: center;
      font-weight: 700;
      flex: 0 0 auto
    }

    .brand h1 {
      font-size: 1rem;
      margin: 0
    }

    .brand small {
      color: var(--muted);
      display: block;
      font-size: .76rem
    }

    .nav {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 2px
    }

    .nav button {
      display: flex;
      align-items: center;
      gap: 9px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text);
      text-align: start;
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font: inherit;
      font-size: .94rem
    }

    .nav button:hover {
      background: var(--surface2)
    }

    .nav button.active {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: var(--line);
      font-weight: 600
    }

    .nav .grp {
      margin: 12px 8px 4px;
      font-size: .74rem;
      color: var(--muted);
      letter-spacing: .04em;
      text-transform: uppercase;
      font-weight: 700
    }

    .nav .ico {
      width: 22px;
      text-align: center;
      flex: 0 0 22px;
      opacity: .9
    }

    .nav .badge {
      margin-inline-start: auto;
      background: var(--surface2);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 0 7px;
      font-size: .74rem;
      color: var(--muted)
    }

    .main {
      flex: 1;
      min-width: 0;
      padding: 20px clamp(12px, 3vw, 30px) 60px
    }

    .topbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px
    }

    .topbar .spacer {
      flex: 1
    }
    .account-tools { display:flex; align-items:center; gap:8px; margin-inline-start:auto }
    .auth-screen { max-width:520px; margin:8vh auto; padding:24px }
    .auth-screen .card { padding:22px }
    .auth-screen input { margin:6px 0 12px }

    .page-head {
      margin-bottom: 14px
    }

    .page-head h2 {
      margin: 0 0 2px
    }

    .page-head p {
      margin: 0;
      color: var(--muted);
      font-size: .92rem
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 16px
    }

    .card>h3:first-child {
      margin-top: 0
    }

    .grid {
      display: grid;
      gap: 14px
    }

    .g2 {
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr))
    }

    .g3 {
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr))
    }

    .g4 {
      grid-template-columns: repeat(auto-fit, minmax(165px, 1fr))
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center
    }

    .row.tight {
      gap: 6px
    }

    .end {
      margin-inline-start: auto
    }

    .muted {
      color: var(--muted)
    }

    .tiny {
      font-size: .8rem
    }

    .nowrap {
      white-space: nowrap
    }

    /* controls */
    .btn {
      font: inherit;
      font-size: .92rem;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600
    }

    .btn:hover {
      background: var(--surface2)
    }

    .btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-ink)
    }

    .btn.primary:hover {
      filter: brightness(1.08)
    }

    .btn.accent {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff
    }

    .btn.danger {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger)
    }

    .btn.ghost {
      background: transparent
    }

    .btn.sm {
      padding: 5px 10px;
      font-size: .84rem;
      font-weight: 600
    }

    .btn.xs {
      padding: 2px 7px;
      font-size: .78rem
    }

    .btn[disabled] {
      opacity: .5;
      cursor: not-allowed
    }

    .btn.link {
      background: none;
      border: none;
      color: var(--primary);
      text-decoration: underline;
      padding: 0;
      font-weight: 600
    }

    input[type=text],
    input[type=email],
    input[type=password],
    input[type=url],
    input[type=number],
    input[type=search],
    input[type=date],
    select,
    textarea {
      font: inherit;
      font-size: .94rem;
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text)
    }

    textarea {
      min-height: 88px;
      resize: vertical
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--primary)
    }

    label {
      display: block;
      font-size: .9rem;
      font-weight: 600;
      margin-bottom: 4px
    }

    fieldset {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      margin: 0 0 10px
    }

    legend {
      font-size: .86rem;
      font-weight: 700;
      padding: 0 5px;
      color: var(--muted)
    }

    .opt {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 400;
      margin: 0
    }

    .opt:hover {
      background: var(--surface2)
    }

    .opt input {
      margin-top: 6px;
      accent-color: var(--primary);
      flex: 0 0 auto;
      width: 16px;
      height: 16px
    }

    .opt .txt {
      font-weight: 400;
      font-size: .94rem
    }

    .scale {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center
    }

    .scale label {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      cursor: pointer;
      font-weight: 600;
      background: var(--surface);
      min-width: 42px;
      text-align: center
    }

    .scale label:has(input:checked) {
      background: var(--primary);
      color: var(--primary-ink);
      border-color: var(--primary)
    }

    .scale input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0
    }

    .badge,
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 9px;
      border-radius: 20px;
      font-size: .78rem;
      font-weight: 700;
      border: 1px solid var(--line);
      background: var(--surface2);
      color: var(--muted)
    }

    .pill.ok {
      background: var(--ok-soft);
      color: var(--ok);
      border-color: transparent
    }

    .pill.warn {
      background: var(--warn-soft);
      color: var(--warn);
      border-color: transparent
    }

    .pill.bad {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: transparent
    }

    .pill.info {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: transparent
    }

    .pill.acc {
      background: var(--ok-soft);
      color: var(--accent);
      border-color: transparent
    }

    .progress {
      height: 9px;
      background: var(--surface2);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--line)
    }

    .progress>i {
      display: block;
      height: 100%;
      background: var(--primary);
      border-radius: 20px
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 6px 0
    }

    .bar-row .nm {
      width: min(190px, 38%);
      font-size: .88rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .bar-row .track {
      flex: 1;
      height: 8px;
      background: var(--surface2);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--line)
    }

    .bar-row .track i {
      display: block;
      height: 100%;
      background: var(--accent)
    }

    .bar-row .val {
      font-size: .82rem;
      color: var(--muted);
      width: 78px;
      text-align: end
    }

    .stat {
      background: var(--surface2);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 12px
    }

    .stat .n {
      font-size: 1.5rem;
      font-weight: 800;
      line-height: 1.2;
      color: var(--primary)
    }

    .stat .l {
      font-size: .82rem;
      color: var(--muted)
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .9rem
    }

    th,
    td {
      border: 1px solid var(--line);
      padding: 7px 9px;
      text-align: start;
      vertical-align: top
    }

    th {
      background: var(--surface2);
      font-size: .85rem
    }

    .table-wrap {
      overflow: auto;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line)
    }

    details {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      background: var(--surface)
    }

    summary {
      cursor: pointer;
      font-weight: 700;
      list-style-position: inside
    }

    details[open] summary {
      margin-bottom: 8px
    }

    .empty {
      text-align: center;
      padding: 34px 16px;
      color: var(--muted);
      border: 2px dashed var(--line);
      border-radius: var(--radius)
    }

    .empty .big {
      font-size: 2rem;
      display: block;
      margin-bottom: 6px
    }

    .msg {
      padding: 10px 13px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      margin: 8px 0;
      font-size: .9rem
    }

    .msg.ok {
      background: var(--ok-soft);
      color: var(--ok);
      border-color: var(--ok)
    }

    .msg.bad {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: var(--danger)
    }

    .msg.warn {
      background: var(--warn-soft);
      color: var(--warn);
      border-color: var(--warn)
    }

    .msg.info {
      background: var(--primary-soft);
      color: var(--primary)
    }

    .toast-wrap {
      position: fixed;
      inset-block-end: 16px;
      inset-inline-start: 16px;
      z-index: 90;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: min(380px, 90vw)
    }

    .toast {
      background: var(--surface);
      border: 1px solid var(--line);
      border-inline-start: 4px solid var(--primary);
      box-shadow: var(--shadow);
      border-radius: var(--radius-sm);
      padding: 9px 13px;
      font-size: .9rem
    }

    .toast.ok {
      border-inline-start-color: var(--ok)
    }

    .toast.bad {
      border-inline-start-color: var(--danger)
    }

    .toast.warn {
      border-inline-start-color: var(--warn)
    }

    .modal-back {
      position: fixed;
      inset: 0;
      background: rgba(10, 18, 28, .55);
      display: grid;
      place-items: center;
      z-index: 100;
      padding: 16px
    }

    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      max-width: 560px;
      width: 100%;
      max-height: 88vh;
      overflow: auto;
      box-shadow: var(--shadow)
    }

    .modal .mh {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      font-weight: 800;
      display: flex;
      gap: 8px;
      align-items: center
    }

    .modal .mb {
      padding: 16px
    }

    .modal .mf {
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap
    }

    .modal.sm {
      max-width: 420px
    }

    /* misc app blocks */
    .qcard {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 12px;
      margin-bottom: 10px;
      background: var(--surface)
    }

    .qcard.answered {
      border-inline-start: 4px solid var(--ok)
    }

    .qcard.skipped {
      border-inline-start: 4px solid var(--warn)
    }

    .qcard.flagged {
      background: var(--warn-soft)
    }

    .qmeta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 6px
    }

    .qtext {
      font-weight: 600;
      margin-bottom: 8px;
      font-size: .98rem
    }

    .qhelp {
      font-size: .85rem;
      color: var(--muted);
      margin: -4px 0 8px
    }

    .qtools {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-top: 9px;
      padding-top: 8px;
      border-top: 1px dashed var(--line)
    }

    .tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
      margin-bottom: 14px
    }

    .tabs button {
      background: none;
      border: 0;
      border-bottom: 3px solid transparent;
      padding: 9px 12px;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      color: var(--muted)
    }

    .tabs button.active {
      color: var(--primary);
      border-bottom-color: var(--primary)
    }

    .list-item {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      margin-bottom: 7px;
      background: var(--surface);
      flex-wrap: wrap
    }

    .list-item .t {
      font-weight: 600
    }

    .cmp-tbl td.v {
      width: 23%;
      font-size: .88rem
    }

    .cmp-tbl th.nm {
      background: var(--primary-soft);
      color: var(--primary)
    }

    .cmp-tbl th.nm.hi {
      background: var(--primary);
      color: var(--primary-ink)
    }

    .hint {
      border-inline-start: 3px solid var(--info);
      padding: 8px 12px;
      background: var(--surface2);
      border-radius: 6px;
      font-size: .87rem;
      color: var(--muted)
    }

    .readonly-banner {
      margin-bottom: 12px;
      padding: 10px 14px;
      border-radius: 9px;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--line)
    }

    .kbd-list {
      display: grid;
      gap: 6px
    }

    .kbd-list div {
      display: flex;
      gap: 8px;
      align-items: baseline;
      padding: 6px 0;
      border-bottom: 1px dashed var(--line)
    }

    .kbd-list div:last-child {
      border-bottom: 0
    }

    .badge-q {
      font-family: Consolas, monospace;
      font-size: .76rem;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--line);
      padding: 1px 6px;
      border-radius: 5px
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0
    }

    .menu-btn {
      display: none
    }

    .sidenote {
      font-size: .83rem;
      color: var(--muted)
    }

    hr.sep {
      border-top: 1px solid var(--line);
      margin: 14px 0
    }

    .idea {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 14px;
      background: var(--surface)
    }

    .idea.top {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary) inset
    }

    .idea h4 {
      margin: 0 0 4px
    }

    .score-pill {
      font-weight: 800;
      font-size: 1rem;
      color: var(--primary)
    }

    ul.tight {
      margin: .3em 0;
      padding-inline-start: 1.2em
    }

    ul.tight li {
      margin: .15em 0
    }

    .disc {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      background: var(--surface);
      flex-wrap: wrap
    }

    .disc.res {
      border-inline-start: 4px solid var(--ok)
    }

    .disc.todo {
      border-inline-start: 4px solid var(--danger)
    }

    .disc.disc2 {
      border-inline-start: 4px solid var(--warn)
    }

    .disc.accept {
      border-inline-start: 4px solid var(--accent)
    }

    .disc.later {
      border-inline-start: 4px solid var(--muted)
    }

    select.sel {
      width: auto;
      display: inline-block
    }

    /* responsive */
    @media (max-width:900px) {
      .app {
        flex-direction: column
      }

      .sidebar {
        position: fixed;
        inset-block: 0;
        inset-inline-end: 0;
        width: 280px;
        max-width: 86vw;
        transform: translateX(-100%);
        transition: transform .18s ease;
        z-index: 80;
        height: 100dvh;
        box-shadow: var(--shadow)
      }

      [dir=rtl] .sidebar {
        transform: translateX(100%)
      }

      .sidebar.open {
        transform: translateX(0) !important
      }

      [dir=rtl] .sidebar.open {
        transform: translateX(0)
      }

      .menu-btn {
        display: inline-flex
      }

      .main {
        padding: 14px max(12px, env(safe-area-inset-left)) 70px
      }

      h1 {

create or replace function public.bd_create_workspace_invite(p_project jsonb, p_email text, p_role text, p_workspace_id uuid default null)
returns jsonb
language plpgsql
security definer
set search_path = ''
as $$
declare
  v_workspace_id uuid := pg_catalog.gen_random_uuid();
  v_invite_code uuid := pg_catalog.gen_random_uuid();
  v_email text := lower(trim(p_email));
begin
  if auth.uid() is null then raise exception 'يجب تسجيل الدخول أولاً'; end if;
  if v_email = '' or position('@' in v_email) < 2 then raise exception 'البريد الإلكتروني غير صحيح'; end if;
  if v_email = lower(coalesce(auth.jwt() ->> 'email', '')) then raise exception 'لا يمكنك دعوة حسابك نفسه'; end if;
  if jsonb_typeof(p_project) <> 'object' then raise exception 'بيانات المشروع غير صالحة'; end if;
  if p_role not in ('assistant', 'security') then raise exception 'نوع الدور غير صالح'; end if;

  if p_workspace_id is null then
    insert into public.bd_workspaces(id, owner_id, invite_email, invite_code, project)
    values (v_workspace_id, auth.uid(), v_email, v_invite_code, p_project);
  else
    v_workspace_id := p_workspace_id;
    update public.bd_workspaces set project = p_project, updated_at = now()
      where id = v_workspace_id and owner_id = auth.uid();
    if not found then raise exception 'فقط المالك يستطيع دعوة أعضاء لهذا المشروع'; end if;
  end if;
  insert into public.bd_workspace_members(workspace_id, invite_email, role, invite_code)
  values (v_workspace_id, v_email, p_role, v_invite_code);
  return jsonb_build_object('workspace_id', v_workspace_id, 'invite_code', v_invite_code);
end;
$$;

create or replace function public.bd_my_workspace_roles()
returns table(workspace_id uuid, role text)
language sql security definer set search_path = ''
as $$
  select m.workspace_id, m.role from public.bd_workspace_members m where m.user_id = auth.uid()
  union all
  select w.id, 'assistant'::text from public.bd_workspaces w
   where w.partner_id = auth.uid() and not exists (select 1 from public.bd_workspace_members m where m.workspace_id = w.id and m.user_id = auth.uid());
$$;

create or replace function public.bd_list_workspace_members(p_workspace_id uuid)
returns table(invite_email text, role text, accepted boolean)
language plpgsql security definer set search_path = ''
as $$
begin
  if not exists (select 1 from public.bd_workspaces w where w.id = p_workspace_id and w.owner_id = auth.uid()) then
    raise exception 'فقط المالك يستطيع عرض أعضاء المشروع';
  end if;
  return query select m.invite_email, m.role, m.user_id is not null
    from public.bd_workspace_members m where m.workspace_id = p_workspace_id order by m.created_at;
end;
$$;

create or replace function public.bd_accept_workspace_invite(p_code uuid)
returns void
language plpgsql
security definer
set search_path = ''
as $$
declare
  v_count integer;
  v_workspace_id uuid;
begin
  if auth.uid() is null then raise exception 'يجب تسجيل الدخول أولاً'; end if;
  update public.bd_workspace_members set user_id = auth.uid(), invite_code = null, accepted_at = now()
   where invite_code = p_code and user_id is null
     and invite_email = lower(coalesce(auth.jwt() ->> 'email', ''))
   returning workspace_id into v_workspace_id;
  get diagnostics v_count = row_count;
  if v_count = 1 then
    update public.bd_workspaces w set partner_id = auth.uid(), invite_code = null, updated_at = now()
     where w.id = v_workspace_id and w.partner_id is null;
    return;
  end if;
  update public.bd_workspaces
     set partner_id = auth.uid(), invite_code = null, updated_at = now()
   where invite_code = p_code
     and partner_id is null
     and invite_email = lower(coalesce(auth.jwt() ->> 'email', ''));
  get diagnostics v_count = row_count;
  if v_count <> 1 then raise exception 'الدعوة غير صالحة أو انتهت أو أُرسلت إلى بريد مختلف'; end if;
end;
$$;

create or replace function public.bd_delete_workspace(p_id uuid)
returns void
language plpgsql
security definer
set search_path = ''
as $$
declare
  v_count integer;
begin
  delete from public.bd_workspaces where id = p_id and owner_id = auth.uid();
  get diagnostics v_count = row_count;
  if v_count <> 1 then raise exception 'فقط صاحب المشروع يستطيع حذفه من مساحة الشراكة'; end if;
end;
$$;

create or replace function public.bd_save_workspace_project(p_id uuid, p_project jsonb)
returns void
language plpgsql
security definer
set search_path = ''
as $$
declare
  v_count integer;
begin
  update public.bd_workspaces
     set project = p_project, updated_at = now()
   where id = p_id and (
     owner_id = auth.uid() or
     (partner_id = auth.uid() and not exists (select 1 from public.bd_workspace_members m where m.workspace_id = p_id and m.user_id = auth.uid() and m.role = 'security')) or
     exists (select 1 from public.bd_workspace_members m where m.workspace_id = p_id and m.user_id = auth.uid() and m.role = 'assistant')
   );
  get diagnostics v_count = row_count;
  if v_count <> 1 then raise exception 'لا تملك صلاحية تعديل هذا المشروع'; end if;
end;
$$;

create or replace function public.bd_admin_list_accounts()
returns jsonb language plpgsql security definer set search_path = ''
as $$
declare
  v_accounts jsonb;
begin
  if auth.uid() is null or not exists (
    select 1 from public.bd_profiles p where p.user_id = auth.uid() and p.site_role = 'site_admin'
  ) then raise exception 'لوحة مدير الموقع متاحة للحساب الإداري فقط'; end if;

  select coalesce(jsonb_agg(jsonb_build_object(
    'user_id', u.id,
    'email', u.email,
    'full_name', coalesce(p.full_name, ''),
    'username', coalesce(p.username, ''),
    'phone', coalesce(p.phone, ''),
    'site_role', coalesce(p.site_role, 'member'),
    'created_at', u.created_at,
    'private_data', coalesce(a.data, '{}'::jsonb),
    'shared_projects', coalesce((
      select jsonb_agg(jsonb_build_object(
        'workspace_id', w.id,
        'role', case when w.owner_id = u.id then 'owner' else coalesce(m.role, 'assistant') end,
        'project', w.project
      ) order by w.updated_at desc)
      from public.bd_workspaces w
      left join public.bd_workspace_members m on m.workspace_id = w.id and m.user_id = u.id
      where w.owner_id = u.id or w.partner_id = u.id or exists (
        select 1 from public.bd_workspace_members m2 where m2.workspace_id = w.id and m2.user_id = u.id
      )
    ), '[]'::jsonb)
  ) order by lower(coalesce(p.full_name, u.email))) , '[]'::jsonb)
    into v_accounts
    from auth.users u
    left join public.bd_profiles p on p.user_id = u.id
    left join public.bd_account_data a on a.user_id = u.id;
  return v_accounts;
end;
$$;

$$;

      CLOUD_BUSY = true;
      const syncingRevision = STATE_REVISION;
      const sync = (async () => { try {
        const privateState = Object.assign({}, S, { projects: S.projects.filter(p => !p._bdWorkspaceId) });
        const { error } = await SUPA.from('bd_account_data').upsert({ user_id: AUTH_USER.id, data: privateState, updated_at: nowISO() }, { onConflict: 'user_id' });
        if (error) throw error;
        for (const project of S.projects.filter(p => p._bdWorkspaceId && canEditProject(p))) {
          const data = JSON.parse(JSON.stringify(project)); delete data._bdWorkspaceId;
          const result = await SUPA.rpc('bd_save_workspace_project', { p_id: project._bdWorkspaceId, p_project: data });
          if (result.error) throw result.error;
        }
        CLOUD_SYNCED_REVISION = Math.max(CLOUD_SYNCED_REVISION, syncingRevision);
        const status = $('#saveState');
        if (status && syncingRevision === STATE_REVISION) {
          status.textContent = 'تم الحفظ على هذا الجهاز والسحابة ' + new Date().toLocaleTimeString('ar-EG');
          status.style.color = '';

          try { await syncCloudState(); }
          catch (e) { console.error('queued cloud sync failed', e); throw e; }
        }
      }
      })();

    function buildQuestions(catId, custom) {

        id: String(q.id), cat: q.cat, type: q.type || 'text', text: q.text || '',

      return base.concat(extra);

    function isAnswered(v) {
      if (v === null || v === undefined || v === '') return false;

    const NUM_RULES = {

    function scoreRule(qid, v) {
      const rule = RULES[qid];
      if (!rule) return null;
      if (!isAnswered(v)) return null;
      if (rule.numeric) {
        const n = num(v);
        if (n === null) return null;
        const t = NUM_RULES[qid] || { min: 0, max: 100, higherBetter: true };
        const span = Math.max(1, t.max - t.min);
        let pct = clamp((n - t.min) / span, 0, 1);
        if (!t.higherBetter) pct = 1 - pct;
        return Math.round(20 + pct * 80);
      }
      if (YESNO_QIDS.indexOf(qid) >= 0) {
        if (typeof rule.yes === 'number') return v ? rule.yes : rule.no;
        return null;
      }
      if (typeof v === 'boolean') return v ? (rule.yes || 100) : (rule.no || 50);
      const s = String(v);
      if (rule.good && rule.good.indexOf(s) >= 0) return 100;
      if (rule.ok && rule.ok.indexOf(s) >= 0) return 60;
      if (rule.bad && rule.bad.indexOf(s) >= 0) return 20;
      return null;
    }

    /* =====================================================================
       SCORING ENGINE
       ===================================================================== */
    function scoreCategory(pt, catId) {
      const qs = questionsOf(currentProject(), catId);
      let total = 0, weight = 0, answered = 0;
      qs.forEach(q => {
        const s = scoreRule(q.id, answerOf(pt, q.id));
        const w = 1.4;
        if (s === null) return;
        total += s * w; weight += w; answered++;
      });
      return { score: weight ? Math.round(total / weight) : null, answered, total: qs.length };
    }

    function scoreAll(pt) {
      const cats = {};
      let sum = 0, count = 0;
      CATS.forEach(c => {
        const r = scoreCategory(pt, c.id);
        cats[c.id] = r.score;
        if (r.score !== null) { sum += r.score; count++; }
      });
      const overall = count ? Math.round(sum / count) : null;
      const qs = allQuestions(currentProject());
      const answered = qs.filter(q => isAnswered(answerOf(pt, q.id))).length;
      return { cats, overall, answered, totalQ: qs.length, completeness: qs.length ? Math.round(answered / qs.length * 100) : 0 };
    }

      const pts = arr(pr.participants);

      CATS.forEach(c => {
        const vals = scores.map(s => s.cats[c.id]).filter(v => v !== null && v !== undefined);
        if (vals.length < 2) return;
        const score = clamp(100 - Math.abs(vals[0] - vals[1]), 0, 100);
        perDim[c.id] = Math.round(score);
        total += score; n++;
      });
      return { total: n ? Math.round(total / n) : null, perDim };
    }

        if (r.score < r.low) out.push(Object.assign({}, r, { gap: r.low - r.score }));

    function readinessVerdict(pr) {
      const pts = arr(pr.participants);
      if (!pts.length) return { level: 'none', label: 'لا يوجد مشاركون', tone: 'warn', score: 0 };
      const sc = pts.map(p => scoreAll(p));
      const ovs = sc.map(s => s.overall).filter(v => v !== null);
      const avg = ovs.length ? mean(ovs) : 0;
      const comp = sc.length ? Math.round(mean(sc.map(s => s.completeness))) : 0;
      const compat = compatibility(pr);
      const cv = compat && compat.total !== null ? compat.total : 0;
      const score = Math.round(clamp(avg * 0.5 + comp * 0.25 + cv * 0.25, 0, 100));

        if (!nav) return;
        let html = '';
        VIEWS.forEach(v => {
          if (v.id === 'site-admin' && AUTH_SITE_ROLE !== 'site_admin') return;
          if (v.grp) html += '<div class="grp">' + esc(v.grp) + '</div>';
          let badge = '';
          const pr = currentProject();
          if (v.id === 'participants' && pr) badge = '<span class="badge">' + pr.participants.length + '</span>';
          if (v.id === 'questionnaire' && pr) {
            const pt = currentParticipant();
            if (pt) { const s = scoreAll(pt); badge = '<span class="badge">' + s.completeness + '%</span>'; }
          }
          if (v.id === 'actions' && pr && pr.actionItems.length) badge = '<span class="badge">' + pr.actionItems.length + '</span>';
          html += '<button data-nav="' + v.id + '" class="' + (VIEW === v.id ? 'active' : '') + '">' +
            '<span class="ico">' + v.icon + '</span><span>' + esc(v.name) + '</span>' + badge + '</button>';
        });
        nav.innerHTML = html;
        $$('#nav button').forEach(b => b.addEventListener('click', () => go(b.getAttribute('data-nav'))));
      } catch (e) {
        console.error('renderNav error:', e);
      }
    }

    function renderTopbar() {
      try {
        const pr = currentProject();
        const tp = $('#tbProject'), tk = $('#tbParticipant');
        if (tp) {
          tp.textContent = pr ? pr.name : 'لا يوجد مشروع';
          tp.className = 'pill info';
        }
        if (tk) {
          const pt = currentParticipant();
          tk.textContent = pt ? pt.name : 'لا يوجد مشارك';
          tk.className = 'pill';
        }
      } catch (e) {
        console.error('renderTopbar error:', e);
      }
    }

    function render() {
      renderNav();
      renderTopbar();
      const host = $('#view');
      if (!host) {
        console.error('Render skipped: #view host not found.');
        return;
      }
      const pr = currentProject();
      let html = '';
      try {
        if (!pr && VIEW !== 'projects' && VIEW !== 'data' && VIEW !== 'site-admin') {
          html = emptyState('لا يوجد مشروع بعد', 'ابدأ مشروعاً جديداً لتتمكن من استخدام هذه الشاشة.', '📁', 'مشروع جديد', 'new-project');
        } else {
          switch (VIEW) {
            case 'projects': html = viewProjects(); break;
            case 'partners': html = viewPartners(); break;
            case 'site-admin': html = AUTH_SITE_ROLE === 'site_admin' ? viewSiteAdmin() : '<div class="msg warn">لوحة إدارة الموقع متاحة لمدير الموقع فقط.</div>'; break;
            case 'participants': html = viewParticipants(); break;
            case 'questionnaire': html = viewQuestionnaire(); break;
            case 'compare': html = viewCompare(); break;
            case 'insights': html = viewInsights(); break;
            case 'decision': html = viewDecision(); break;
            case 'actions': html = viewActions(); break;
            case 'data': html = viewData(); break;
            default: html = viewProjects();
          }
        }
      } catch (e) {
        console.error('Render error:', e);
        html = '<div class="empty"><span class="big">⚠️</span>' +
          '<div><strong>خطأ في عرض المحتوى</strong></div>' +
          '<div class="tiny muted" style="margin-top:6px">' + esc(e.message) + '</div>' +
          '<div style="margin-top:12px"><button class="btn primary" onclick="location.reload()">إعادة تحميل الصفحة</button></div>' +
          '</div>';
      }
      const readonly = isReadOnlyProject(pr);
      host.classList.toggle('read-only', readonly);
      host.innerHTML = (CLOUD_LOAD_WARNING ? '<div class="msg warn" role="status" style="margin-bottom:12px">' + esc(CLOUD_LOAD_WARNING) + '</div>' : '') +
        (readonly ? '<div class="readonly-banner">دور الأمن: يمكنك مشاهدة هذا المشروع فقط، ولا يمكنك تعديل بياناته.</div>' : '') + html;
      if (readonly) {
        $$('#view input, #view textarea, #view select').forEach(el => { el.disabled = true; });
        $$('#view button').forEach(btn => {
          const act = btn.getAttribute('data-act');
          if (!act || !READ_ONLY_ACTIONS.has(act)) btn.disabled = true;
        });
      }
      bindView();
      if (VIEW === 'partners' && pr && canManageProject(pr) && pr._bdWorkspaceId) refreshWorkspaceRoster(pr._bdWorkspaceId);
      if (VIEW === 'site-admin' && AUTH_SITE_ROLE === 'site_admin') refreshSiteAdminDashboard();
    }

    function emptyState(big, msg, icon, btnLabel, act) {
      return '<div class="empty"><span class="big">' + (icon || '📭') + '</span>' +
        '<div><strong>' + esc(big) + '</strong></div>' +
        '<div class="tiny muted" style="margin-top:6px">' + esc(msg) + '</div>' +
        (btnLabel ? '<div style="margin-top:12px"><button class="btn primary" data-act="' + act + '">' + esc(btnLabel) + '</button></div>' : '') +
        '</div>';
    }
    function pageHead(title, sub) {
      return '<div class="page-head"><h2>' + esc(title) + '</h2>' +
        (sub ? '<p>' + esc(sub) + '</p>' : '') + '</div>';
    }
    function card(title, body, cls) {
      return '<div class="card ' + (cls || '') + '">' +
        (title ? '<h3>' + esc(title) + '</h3>' : '') + body + '</div>';
    }
    function progressBar(v) {
      const p = v === null || v === undefined ? 0 : clamp(v, 0, 100);
      return '<div class="progress"><i style="width:' + p + '%"></i></div>';
    }
    function scorePill(v) {
      if (v === null || v === undefined) return '<span class="pill">—</span>';
      const t = v >= 70 ? 'ok' : v >= 50 ? 'warn' : 'bad';
      return '<span class="pill ' + t + '">' + v + '</span>';
    }
    function barRow(name, v) {
      const p = v === null || v === undefined ? 0 : clamp(v, 0, 100);
      return '<div class="bar-row"><div class="nm">' + esc(name) + '</div>' +
        '<div class="track"><i style="width:' + p + '%"></i></div>' +
        '<div class="val">' + (v === null || v === undefined ? '—' : v) + '</div></div>';
    }

    /* =====================================================================
       VIEW: PROJECTS
       ===================================================================== */
    function viewProjects() {
      let html = pageHead('المشاريع', 'أنشئ مشروعاً، أضف المشاركين، ثم ابدأ الاستبيان.');
      html += '<div class="row no-print" style="margin-bottom:14px">' +
        '<button class="btn primary" data-act="new-project">+ مشروع جديد</button>' +
        '<button class="btn" data-act="import-json">استيراد ملف</button>' +
        '<button class="btn ghost" data-act="export-json">تصدير نسخة</button></div>';
      const list = arr(S.projects);
      if (!list.length) {
        html += card('', emptyState('لا توجد مشاريع بعد', 'ابدأ بمشروع واحد وابدأ الإجابة.', '📁', 'مشروع جديد', 'new-project'));
        return html;
      }
      html += '<div class="grid g2">';
      list.forEach(p => {
        const v = readinessVerdict(p);
        const pts = arr(p.participants);
        const maxScores = pts.length ? Math.max.apply(null, pts.map(x => scoreAll(x).overall || 0)) : 0;
        html += '<div class="idea' + (p.id === S.activeProjectId ? ' top' : '') + '">' +
          '<div class="row"><h4 style="margin:0;flex:1">' + esc(p.name) + '</h4>' +
          '<span class="pill ' + toneClass(v.tone) + '">' + esc(v.label) + '</span></div>' +
          '<div class="tiny muted" style="margin:6px 0">أُنشئ ' + esc((p.createdAt || '').slice(0, 10)) + ' · ' + pts.length + ' مشارك</div>' +
          '<div class="score-pill">' + (v.score || 0) + ' / 100</div>' +
          '<div style="margin-top:6px">' + progressBar(v.score) + '</div>' +
          '<div class="row" style="margin-top:10px">' +
          '<button class="btn sm" data-act="open-project" data-id="' + esc(p.id) + '">فتح</button>' +
          '<button class="btn sm" data-act="rename-project" data-id="' + esc(p.id) + '">إعادة تسمية</button>' +
          '<button class="btn sm" data-act="duplicate-project" data-id="' + esc(p.id) + '">نسخ</button>' +
          '<button class="btn sm danger" data-act="delete-project" data-id="' + esc(p.id) + '">حذف</button>' +
          '</div></div>';
      });
      html += '</div>';
      return html;
    }

    /* =====================================================================
       VIEW: PARTICIPANTS
       ===================================================================== */
    function viewParticipants() {

      let html = pageHead('المشاركون', 'كل مشارك يجيب عن نفس الأسئلة، ثم نقارن بينكم.');
      html += '<div class="row no-print" style="margin-bottom:14px">' +
        '<button class="btn primary" data-act="add-participant">+ مشارك جديد</button>' +
        '<select class="sel" id="prjSel" aria-label="المشروع الحالي"></select></div>';

      if (!pts.length) {
        html += card('', emptyState('لا يوجد مشاركون', 'أضف مشاركاً واحداً على الأقل لبدء التقييم.', '👤', 'إضافة مشارك', 'add-participant'));
        return html;
      }
      html += '<div class="grid g3">';
      pts.forEach(p => {
        const s = scoreAll(p);

          '<div class="row"><h4 style="margin:0;flex:1">' + esc(p.name) + '</h4>' +
          (isActive ? '<span class="pill info">الحالي</span>' : '') + '</div>' +
          '<div class="tiny muted" style="margin:4px 0 8px">آخر تحديث ' + esc((p.updatedAt || '').slice(0, 10)) + '</div>' +
          '<div class="score-pill">' + (s.overall === null ? '—' : s.overall) + '</div>' +
          '<div class="tiny muted">اكتمال ' + s.completeness + '% (' + s.answered + '/' + s.totalQ + ')</div>' +
          '<div style="margin-top:6px">' + progressBar(s.completeness) + '</div>' +
          '<div class="row" style="margin-top:10px">' +
          '<button class="btn sm" data-act="select-participant" data-id="' + esc(p.id) + '">اختيار</button>' +
          '<button class="btn sm" data-act="rename-participant" data-id="' + esc(p.id) + '">تعديل الاسم</button>' +

          '</div></div>';

    /* =====================================================================
       VIEW: QUESTIONNAIRE
       ===================================================================== */
    function qInput(q, v, pt) {
      const id = 'q_' + q.id;
      const name = 'qn_' + q.id;
      if (q.type === 'one') {
        return q.options.map(o => {
          const on = v === o;
          return '<label class="opt"><input type="radio" name="' + name + '" data-q="' + esc(q.id) + '" value="' + esc(o) + '"' + (on ? ' checked' : '') + '>' +
            '<span class="txt">' + esc(o) + '</span></label>';
        }).join('');
      }
      if (q.type === 'multi') {
        const cur = arr(v);
        return q.options.map(o => {
          const on = cur.indexOf(o) >= 0;
          return '<label class="opt"><input type="checkbox" data-q="' + esc(q.id) + '" value="' + esc(o) + '"' + (on ? ' checked' : '') + '>' +
            '<span class="txt">' + esc(o) + '</span></label>';
        }).join('');
      }
      if (q.type === 'yesno') {
        return '<div class="row tight">' +
          '<label class="opt"><input type="radio" name="' + name + '" data-q="' + esc(q.id) + '" data-val="1"' + (v === true ? ' checked' : '') + '><span class="txt">نعم</span></label>' +
          '<label class="opt"><input type="radio" name="' + name + '" data-q="' + esc(q.id) + '" data-val="0"' + (v === false ? ' checked' : '') + '><span class="txt">لا</span></label>' +
          '</div>';
      }
      if (q.type === 'rating') {
        const max = q.extra && q.extra.max ? q.extra.max : 5;
        const min = q.extra && q.extra.min ? q.extra.min : 1;
        let out = '<div class="scale">';
        for (let i = min; i <= max; i++) {
          out += '<label><input type="radio" name="' + name + '" data-q="' + esc(q.id) + '" value="' + i + '"' + (num(v) === i ? ' checked' : '') + '>' + i + '</label>';
        }
        out += '</div>';
        return out;
      }
      if (q.type === 'rateeach') {
        const max = q.extra && q.extra.scale ? q.extra.scale : 5;
        const cur = (v && typeof v === 'object') ? v : {};
        return '<div class="table-wrap"><table><thead><tr><th>الهدف</th><th>التقييم</th></tr></thead><tbody>' +
          q.options.map(o => {
            let cells = '';
            for (let i = 1; i <= max; i++) {
              cells += '<td style="text-align:center"><label style="margin:0"><input type="radio" name="re_' + esc(q.id) + '_' + esc(o) + '" data-rate="' + esc(q.id) + '" data-opt="' + esc(o) + '" value="' + i + '"' + (num(cur[o]) === i ? ' checked' : '') + '> ' + i + '</label></td>';
            }
            return '<tr><td>' + esc(o) + '</td>' + cells + '</tr>';
          }).join('') + '</tbody></table></div>';
      }
      if (q.type === 'rank') {
        const cur = arr(v);
        return '<div id="rank_' + esc(q.id) + '" data-rank="' + esc(q.id) + '">' +
          q.options.map(o => '<div class="list-item" draggable="true" data-rank-opt="' + esc(o) + '">' +
            '<span class="badge-q">≡</span><span class="t" style="flex:1">' + esc(o) + '</span>' +
            '<span class="tiny muted">الترتيب ' + (cur.indexOf(o) >= 0 ? (cur.indexOf(o) + 1) : '—') + '</span>' +
            '<button class="btn xs" data-rank-up="' + esc(o) + '" data-q="' + esc(q.id) + '">▲</button>' +
            '<button class="btn xs" data-rank-down="' + esc(o) + '" data-q="' + esc(q.id) + '">▼</button>' +
            '</div>').join('') + '</div>';
      }
      if (q.type === 'num') {
        const e = q.extra || {};
        return '<input type="number" id="' + id + '" data-q="' + esc(q.id) + '" value="' + esc(v === undefined || v === null ? '' : v) + '"' +
          (e.min !== undefined ? ' min="' + e.min + '"' : '') + (e.max !== undefined ? ' max="' + e.max + '"' : '') +
          (e.step !== undefined ? ' step="' + e.step + '"' : '') + '>' +
          (e.unit ? '<div class="tiny muted">' + esc(e.unit) + '</div>' : '');
      }
      if (q.type === 'long') {
        const rows = q.extra && q.extra.rows ? q.extra.rows : 4;
        return '<textarea id="' + id + '" data-q="' + esc(q.id) + '" rows="' + rows + '">' + esc(v === undefined || v === null ? '' : v) + '</textarea>';
      }
      return '<input type="text" id="' + id + '" data-q="' + esc(q.id) + '" value="' + esc(v === undefined || v === null ? '' : v) + '">';
    }

    function viewQuestionnaire() {
      const pr = currentProject();
      const pt = currentParticipant();
      let html = pageHead('الاستبيان', 'أجب عن الأسئلة في كل قسم — يمكنك التخطي والعودة لاحقاً.');
      if (!pt) {
        html += card('', emptyState('لا يوجد مشارك', 'أضف مشاركاً ثم عد إلى هنا.', '👤', 'إضافة مشارك', 'add-participant'));
        return html;
      }
      html += '<div class="row no-print" style="margin-bottom:12px">' +
        '<label style="margin:0">المشارك</label>' +
        '<select class="sel" id="ptSel" aria-label="المشارك">' +
        arr(pr.participants).map(p => '<option value="' + esc(p.id) + '"' + (p.id === pt.id ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('') +
        '</select><span class="spacer"></span>' +
        '<button class="btn sm" data-act="prev-cat">◀ السابق</button>' +
        '<button class="btn sm" data-act="next-cat">التالي ▶</button></div>';

      const sc = scoreAll(pt);
      html += card('التقدم العام',
        '<div class="row"><div style="flex:1">' + progressBar(sc.completeness) + '</div>' +
        '<span class="pill ' + (sc.completeness >= 80 ? 'ok' : sc.completeness >= 40 ? 'warn' : 'bad') + '">' + sc.completeness + '%</span></div>' +
        '<div class="tiny muted" style="margin-top:6px">' + sc.answered + ' من ' + sc.totalQ + ' سؤال · الدرجة الكلية ' + (sc.overall === null ? '—' : sc.overall) + '</div>');

      html += '<div class="tabs no-print">';
      CATS.forEach(c => {
        const v = sc.cats[c.id];
        html += '<button data-act="pick-cat" data-cat="' + esc(c.id) + '" class="' + (CAT_VIEW === c.id ? 'active' : '') + '">' +
          c.icon + ' ' + esc(c.name) + ' ' + (v === null || v === undefined ? '' : '<span class="badge-q">' + v + '</span>') + '</button>';
      });
      html += '</div>';

      const cat = CAT_MAP[CAT_VIEW] || CATS[0];
      const qs = questionsOf(pr, cat.id);
      html += card(cat.icon + ' ' + cat.name + ' — ' + cat.desc, '<div id="qList">' + qs.map(q => {
        const v = answerOf(pt, q.id);
        const answered = isAnswered(v);
        const skipped = pt.skipped && pt.skipped[q.id];
        const flagged = pt.flags && pt.flags[q.id];
        return '<div class="qcard' + (answered ? ' answered' : skipped ? ' skipped' : '') + (flagged ? ' flagged' : '') + '" data-qcard="' + esc(q.id) + '">' +
          '<div class="qmeta"><span class="badge-q">' + esc(q.id) + '</span>' +
          (answered ? '<span class="pill ok">مُجاب</span>' : skipped ? '<span class="pill warn">متخطّى</span>' : '') +
          (flagged ? '<span class="pill bad">معلّم</span>' : '') + '</div>' +
          '<div class="qtext">' + esc(q.text) + '</div>' +
          qInput(q, v, pt) +
          '<div class="qtools no-print">' +
          '<button class="btn xs" data-act="skip-q" data-id="' + esc(q.id) + '">' + (skipped ? 'إلغاء التخطي' : 'تخطّي') + '</button>' +
          '<button class="btn xs" data-act="flag-q" data-id="' + esc(q.id) + '">' + (flagged ? 'إزالة العلامة' : 'علّم للمراجعة') + '</button>' +
          '<button class="btn xs" data-act="clear-q" data-id="' + esc(q.id) + '">مسح</button>' +
          '</div></div>';
      }).join('') + '</div>');

      html += card('ملاحظات على هذا القسم', '<textarea id="catNotes" placeholder="ملاحظاتك…">' +
        esc((pt.notes && pt.notes[cat.id]) ? pt.notes[cat.id] : '') + '</textarea>');
      return html;
    }

    /* =====================================================================
       VIEW: COMPARE
       ===================================================================== */
    function viewCompare() {
      const pr = currentProject();
      const pts = arr(pr.participants);
      let html = pageHead('المقارنة', 'قارن إجابات المشاركين جنباً إلى جنب لكل قسم.');
      if (!pts.length) {
        html += card('', emptyState('لا يوجد مشاركون للمقارنة', 'أضف مشاركين على الأقل.', '👥', 'إضافة مشارك', 'add-participant'));
        return html;
      }
      const compat = compatibility(pr);
      if (compat) {
        html += card('درجة التوافق بين المشاركين',
          '<div class="row"><div style="flex:1">' + progressBar(compat.total) + '</div>' +
          '<span class="pill ' + (compat.total >= 70 ? 'ok' : compat.total >= 45 ? 'warn' : 'bad') + '">' + compat.total + ' / 100</span></div>' +
          '<div class="tiny muted" style="margin-top:6px">كلما قلّ الفارق بين إجاباتكم في كل قسم ارتفعت درجة التوافق.</div>');
      }
      const scores = pts.map(p => scoreAll(p));
      html += card('الدرجات حسب القسم', '<div class="table-wrap"><table class="cmp-tbl"><thead><tr><th>القسم</th>' +
        pts.map((p, i) => '<th class="nm' + (scores[i].overall !== null && scores[i].overall >= 70 ? ' hi' : '') + '">' + esc(p.name) + '</th>').join('') +
        '<th>الفارق</th></tr></thead><tbody>' +
        CATS.map(c => {
          const vals = scores.map(s => s.cats[c.id]);
          const nums = vals.filter(v => v !== null && v !== undefined);
          const gap = nums.length >= 2 ? Math.abs(nums[0] - nums[1]) : null;
          return '<tr><td>' + c.icon + ' ' + esc(c.name) + '</td>' +
            vals.map(v => '<td class="v">' + (v === null || v === undefined ? '—' : v) + '</td>').join('') +
            '<td class="v">' + (gap === null ? '—' : gap) + '</td></tr>';
        }).join('') +
        '<tr><td><strong>المجموع</strong></td>' +
        scores.map(s => '<td class="v"><strong>' + (s.overall === null ? '—' : s.overall) + '</strong></td>').join('') +
        '<td class="v">—</td></tr></tbody></table></div>');

      const qset = arr(pr.customQuestions);
      html += card('قائمة المقارنة', '<div class="table-wrap"><table><thead><tr><th>السؤال</th>' +
        pts.map(p => '<th>' + esc(p.name) + '</th>').join('') + '</tr></thead><tbody>' +
        allQuestions(pr).map(q => {
          const cat = CAT_MAP[q.cat];
          return '<tr><td><div class="tiny muted">' + esc(cat ? cat.name : q.cat) + '</div>' + esc(q.text) + '</td>' +
            pts.map(p => '<td>' + esc(answerText(q, answerOf(p, q.id)) || '—') + '</td>').join('') + '</tr>';
        }).join('') + '</tbody></table></div>');
      return html;
    }

    /* =====================================================================
       VIEW: INSIGHTS
       ===================================================================== */
    function viewInsights() {
      const pr = currentProject();
      const pts = arr(pr.participants);
      let html = pageHead('الرؤى والأفكار', 'ما يقوله النموذج عن نقاط القوة والفجوات.');
      const sug = ideaSuggestions(pr);
      if (!sug.length) {
        html += card('', emptyState('لا توجد رؤى بعد', 'أكمل الاستبيان أولاً.', '💡'));

      }
      html += '<div class="grid g2">';
      sug.forEach(s => {
        html += '<div class="idea"><h4>' + s.icon + ' ' + esc(s.title) + '</h4>' +
          '<div style="margin-top:4px">' + esc(s.body) + '</div></div>';
      });
      html += '</div>';

      const compat = compatibility(pr);

          const privateProjects = arr(account.private_data && account.private_data.projects);
          const sharedProjects = arr(account.shared_projects);
          const roleLabel = account.site_role === 'site_admin' ? 'مدير الموقع' : 'مستخدم';

            '<div class="row" style="margin-top:10px"><select class="sel" data-site-admin-role="' + esc(account.user_id) + '"' + (isSelf ? ' disabled' : '') + '><option value="member"' + (account.site_role !== 'site_admin' ? ' selected' : '') + '>مستخدم</option><option value="site_admin"' + (account.site_role === 'site_admin' ? ' selected' : '') + '>مدير الموقع</option></select>' +
            '<button class="btn xs" data-site-admin-save="' + esc(account.user_id) + '"' + (isSelf ? ' disabled' : '') + '>حفظ الصلاحية</button></div>' +
            '<details style="margin-top:12px"><summary>البيانات والمشاريع الخاصة (' + privateProjects.length + ')</summary><pre style="white-space:pre-wrap;overflow:auto;max-height:360px;direction:ltr;text-align:left">' + esc(JSON.stringify(account.private_data || {}, null, 2)) + '</pre></details>' +

        }).join('');

          const userId = button.getAttribute('data-site-admin-save');

      }

    /* =====================================================================
       MODAL + PROMPTS
       ===================================================================== */
    function openModal(title, bodyHtml, onOk, okLabel) {
      const host = $('#modalHost');
      host.innerHTML = '<div class="modal-back" data-modal-back>' +
        '<div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
        '<h3>' + esc(title) + '</h3>' +
        '<div class="modal-body">' + bodyHtml + '</div>' +
        '<div class="row" style="justify-content:flex-end;margin-top:14px">' +
        '<button class="btn ghost" data-modal-cancel>إلغاء</button>' +
        '<button class="btn primary" data-modal-ok>' + esc(okLabel || 'حفظ') + '</button>' +
        '</div></div></div>';
      const back = $('[data-modal-back]', host);
      const close = () => { host.innerHTML = ''; };
      on(host, '[data-modal-cancel]', 'click', close);
      on(host, '[data-modal-back]', 'click', (e) => { if (e.target === back) close(); });
      on(host, '[data-modal-ok]', 'click', () => {
        const ok = onOk();
        if (ok !== false) close();
      });
      const inp = $('input,textarea', host);
      if (inp) { inp.focus(); if (inp.select) inp.select(); }
      return close;
    }
    function promptText(title, label, value, onOk, multiline) {
      const v = value === undefined || value === null ? '' : value;
      openModal(title,
        '<label>' + esc(label) + '</label>' +
        (multiline
          ? '<textarea id="pmIn" rows="4">' + esc(v) + '</textarea>'
          : '<input type="text" id="pmIn" value="' + esc(v) + '">'),
        () => { const val = $('#pmIn').value.trim(); if (!val) { toast('اكتب قيمة أولاً', 'warn'); return false; } onOk(val); return true; });
      const inp = $('#pmIn');
      if (inp) inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !multiline) { e.preventDefault(); const b = $('[data-modal-ok]'); if (b) b.click(); } });
    }
    function confirmBox(title, message, onOk) {
      openModal(title, '<div>' + esc(message) + '</div>', () => { onOk(); return true; }, 'تأكيد');
    }

    function makeProject(name) {
      return {
        id: uid('prj'), name: name, createdAt: nowISO(), updatedAt: nowISO(),
        participants: [], customQuestions: [], actionItems: [],
        notes: { main: '' }, decisionStatus: { final: '', notes: '' }
      };
    }
    function makeParticipant(name) {
      return {
        id: uid('pt'), name: name, createdAt: nowISO(), updatedAt: nowISO(),
        answers: {}, skipped: {}, flags: {}, notes: {}
      };
    }
    function newProject() {
      promptText('مشروع جديد', 'اسم المشروع', '', (name) => {
        const p = makeProject(name);
        S.projects.push(p);
        S.activeProjectId = p.id;
        S.activeParticipantId = null;
        saveState(true);
        toast('تم إنشاء المشروع: ' + name, 'ok');
        go('participants');
      });
    }
    function addParticipant() {
      const pr = currentProject();
      if (!pr) { toast('أنشئ مشروعاً أولاً', 'warn'); return; }
      promptText('مشارك جديد', 'اسم المشارك', '', (name) => {
        const p = makeParticipant(name);
        pr.participants.push(p);
        S.activeParticipantId = p.id;
        pr.updatedAt = nowISO();
        saveState(true);
        toast('تمت إضافة: ' + name, 'ok');
        render();
      });
    }

    /* =====================================================================
       IMPORT / EXPORT
       ===================================================================== */
    function download(filename, content, mime) {
      const blob = new Blob([content], { type: mime || 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
    }
    function exportJSON() {
      const data = JSON.stringify(S, null, 2);
      download('business-discovery-' + todayISO() + '.json', data, 'application/json;charset=utf-8');
      toast('تم تصدير الملف', 'ok');
    }
    function csvCell(v) {
      const s = v === undefined || v === null ? '' : String(v);
      return '"' + s.replace(/"/g, '""') + '"';
    }
    function exportCSV() {
      const pr = currentProject();
      if (!pr) { toast('لا يوجد مشروع', 'warn'); return; }
      const pts = arr(pr.participants);
      const qs = allQuestions(pr);
      const rows = [];
      rows.push(['المشروع', pr.name]);
      rows.push(['المشارك', 'القسم', 'السؤال', 'الإجابة', 'الدرجة']);
      pts.forEach(p => {
        const sc = scoreAll(p);
        rows.push([p.name, '—', 'الدرجة الكلية', '', sc.overall === null ? '' : sc.overall]);
        CATS.forEach(c => {
          rows.push([p.name, c.name, 'درجة القسم', '', sc.cats[c.id] === null || sc.cats[c.id] === undefined ? '' : sc.cats[c.id]]);
        });
        qs.forEach(q => {
          const v = answerOf(p, q.id);
          rows.push([p.name, (CAT_MAP[q.cat] ? CAT_MAP[q.cat].name : q.cat), q.text, answerText(q, v)]);
        });
      });
      const csv = '\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
      download('business-discovery-' + todayISO() + '.csv', csv, 'text/csv;charset=utf-8');
      toast('تم تصدير CSV', 'ok');
    }
    function importJSON(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(String(reader.result));
          if (!data || !Array.isArray(data.projects)) throw new Error('صيغة غير صالحة');
          S = Object.assign(defaultState(), data);
          saveState(true);
          toast('تم الاستيراد بنجاح', 'ok');
          render();
        } catch (e) {
          toast('تعذّر قراءة الملف: ' + e.message, 'bad');
        }
      };
      reader.readAsText(file, 'utf-8');
    }
    function importCSV(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const txt = String(reader.result).replace(/^\ufeff/, '');
          const lines = txt.split(/\r?\n/).filter(l => l.trim());
          if (!lines.length) throw new Error('ملف فارغ');
          const pr = currentProject();
          if (!pr) { toast('أنشئ مشروعاً أولاً', 'warn'); return; }
          const parse = (line) => {
            const out = []; let cur = '', inQ = false;
            for (let i = 0; i < line.length; i++) {
              const ch = line[i];
              if (ch === '"') {
                if (inQ && line[i + 1] === '"') { cur += '"'; i++; }
                else inQ = !inQ;
              } else if (ch === ',' && !inQ) { out.push(cur); cur = ''; }
              else cur += ch;
            }
            out.push(cur); return out;
          };
          const rows = lines.map(parse);
          let matched = 0;
          rows.forEach(r => {
            const [name, catName, qtext, ans] = r;
            if (!qtext || !ans) return;
            const pt = pr.participants.find(x => x.name === name);
            if (!pt) return;
            const q = allQuestions(pr).find(x => x.text === qtext);
            if (!q) return;
            let val = ans;
            if (q.type === 'yesno') val = /^(نعم|yes|true|1)$/i.test(ans.trim());
            else if (q.type === 'num' || q.type === 'rating') val = num(ans);
            setAnswer(pt, q.id, val);
            matched++;
          });
          saveState(true);
          toast('تم استيراد ' + matched + ' إجابة', matched ? 'ok' : 'warn');
          render();
        } catch (e) {
          toast('تعذّر قراءة الملف: ' + e.message, 'bad');
        }
      };
      reader.readAsText(file, 'utf-8');
    }
    function wipeAll() {
      confirmBox('مسح بيانات الحساب', 'سيتم حذف المشاريع الخاصة والمشاركين والإجابات من حسابك. تبقى المشاريع المشتركة متاحة لشريكك. هل أنت متأكد؟', () => {
        lsDel(accountDataKey());
        S = defaultState();
        saveState(true);
        toast('تم مسح البيانات', 'ok');
        go('projects');
      });
    }

    /* =====================================================================
       EVENT WIRING
       ===================================================================== */
    function answerFromInput(el) {
      const qid = el.getAttribute('data-q');
      const q = allQuestions(currentProject()).find(x => x.id === qid);
      const type = el.getAttribute('type');
      if (el.hasAttribute('data-val')) return el.getAttribute('data-val') === '1';
      if (type === 'checkbox') return el.value;
      if (type === 'radio') {
        if (q && q.type === 'rating') return num(el.value);
        return el.value;
      }
      if (el.type === 'number') return el.value === '' ? '' : num(el.value);
      return el.value;
    }
    function refreshQuestionnaireLight(pt, qid) {
      const card = $('[data-qcard="' + qid + '"]');
      if (!card) return;
      const answered = isAnswered(answerOf(pt, qid));
      card.classList.toggle('answered', answered);
      const meta = $('.qmeta', card);
      if (meta) {
        const flags = pt.flags && pt.flags[qid];
        const sk = pt.skipped && pt.skipped[qid];
        meta.innerHTML = '<span class="badge-q">' + esc(qid) + '</span>' +
          (answered ? '<span class="pill ok">مُجاب</span>' : sk ? '<span class="pill warn">متخطّى</span>' : '') +
          (flags ? '<span class="pill bad">معلّم</span>' : '');
      }
    }
    function updateProgress() {
      const pt = currentParticipant();
      if (!pt) return;
      const sc = scoreAll(pt);
      const bar = $('#view .progress i');
      if (bar) bar.style.width = clamp(sc.completeness, 0, 100) + '%';
      const pill = $('#view .card .row .pill');
      if (pill && /%$/.test(pill.textContent)) {
        pill.textContent = sc.completeness + '%';
        pill.className = 'pill ' + (sc.completeness >= 80 ? 'ok' : sc.completeness >= 40 ? 'warn' : 'bad');
      }
    }

        });
      }

        });

          pr.decisionStatus.notes = dn.value;

        });
      }
      $$('#qList [data-q]').forEach(el => {
        el.addEventListener('change', () => {
          const qid = el.getAttribute('data-q');
          const q = allQuestions(pr).find(x => x.id === qid);
          if (!q || !pt) return;
          if (q.type === 'multi') {
            const boxes = $$('#qList input[data-q="' + qid + '"]');
            setAnswer(pt, qid, boxes.filter(b => b.checked).map(b => b.value));
          } else {
            setAnswer(pt, qid, answerFromInput(el));
          }

          updateProgress();
        });
      });
      $$('#qList [data-rate]').forEach(el => {
        el.addEventListener('change', () => {
          const qid = el.getAttribute('data-rate');
          const opt = el.getAttribute('data-opt');
          const cur = (pt.answers[qid] && typeof pt.answers[qid] === 'object') ? pt.answers[qid] : {};
          cur[opt] = num(el.value);
          setAnswer(pt, qid, cur);
          refreshQuestionnaireLight(pt, qid);
          updateProgress();
        });
      });

      $$('#qList [data-rank-up], #qList [data-rank-down]').forEach(b => {
        b.addEventListener('click', () => {
          const qid = b.getAttribute('data-q');
          const opt = b.getAttribute('data-rank-up') || b.getAttribute('data-rank-down');
          const up = !!b.getAttribute('data-rank-up');
          const list = arr(answerOf(pt, qid)).slice();
          const i = list.indexOf(opt);
          if (i < 0) list.push(opt);
          else {
            const j = up ? i - 1 : i + 1;
            if (j < 0 || j >= list.length) return;
            list.splice(j, 0, list.splice(i, 1)[0]);
          }
          setAnswer(pt, qid, list);
          render();
        });
      });
      $$('#view [data-task-check]').forEach(cb => {
        cb.addEventListener('change', () => {
          const item = arr(pr.actionItems).find(x => x.id === cb.getAttribute('data-task-check'));
          if (!item) return;
          item.done = cb.checked;
          saveState(true);
          render();
        });
      });
      $$('#view [data-task-status]').forEach(sel => {
        sel.addEventListener('change', () => {
          const item = arr(pr.actionItems).find(x => x.id === sel.getAttribute('data-task-status'));
          if (!item) return;
          item.status = sel.value;
          saveState(true);
          render();
        });
      });
      const nt = $('#newTask');
      if (nt) {
        nt.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); const b = $('[data-act="add-task"]'); if (b) b.click(); }
        });
      }
      $$('#view input[name="decision"]').forEach(r => {
        r.addEventListener('change', () => {
          if (!pr) return;
          pr.decisionStatus = pr.decisionStatus || { final: '', notes: '' };
          pr.decisionStatus.final = r.value;
          saveState();
        });
      });
    }

    /* =====================================================================
       ACTION DISPATCH
       ===================================================================== */
    function handleAction(act, id, el, event) {
      if (isReadOnlyProject() && !READ_ONLY_ACTIONS.has(act)) {
        if (event) event.preventDefault();
        toast('دور الأمن يسمح بالمشاهدة فقط.', 'warn');
        return;
      }
      const pr = currentProject();
      const pt = currentParticipant();
      switch (act) {
        case 'invite-partner':
          if (!cloudReady()) { toast('سجّل الدخول أولاً', 'warn'); break; }
          promptText('دعوة شريك', 'البريد الإلكتروني للشريك', '', (email) => {
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast('اكتب بريداً إلكترونياً صحيحاً', 'warn'); return; }
            createWorkspaceInvite(email, $('#inviteRole') ? $('#inviteRole').value : 'assistant').catch(e => toast('تعذر إنشاء الدعوة: ' + e.message, 'bad'));
          });
          break;
        case 'new-project': newProject(); break;
        case 'add-participant': addParticipant(); break;
        case 'import-json': { const f = $('#fileInput'); if (f) { f.value = ''; f.click(); } break; }
        case 'import-csv': { const f = $('#csvInput'); if (f) { f.value = ''; f.click(); } break; }
        case 'export-json': exportJSON(); break;
        case 'export-csv': exportCSV(); break;
        case 'save-now': saveState(true); toast('تم الحفظ', 'ok'); break;
        case 'wipe': wipeAll(); break;
        case 'print-report': printReport(); break;
        case 'open-project':
          if (id) {
            S.activeProjectId = id;
            S.activeParticipantId = null;
            saveState(true);
            go('participants');
          }
          break;
        case 'rename-project': {
          const p = byId(S.projects, id);
          if (!p) break;
          promptText('إعادة تسمية المشروع', 'الاسم الجديد', p.name, (nm) => { p.name = nm; saveState(true); render(); });
          break;
        }
        case 'duplicate-project': {
          const p = byId(S.projects, id);
          if (!p) break;
          const copy = JSON.parse(JSON.stringify(p));
          copy.id = uid('prj');
          delete copy._bdWorkspaceId;
          copy.name = p.name + ' (نسخة)';
          copy.createdAt = nowISO();
          copy.participants.forEach(x => { x.id = uid('pt'); });
          S.projects.push(copy);
          saveState(true);
          toast('تم نسخ المشروع', 'ok');
          render();
          break;
        }
        case 'delete-project':
          if (!id) break;
          confirmBox('حذف المشروع', 'سيتم حذف المشروع وجميع المشاركين وإجاباتهم. متابعة؟', () => {
            (async () => {
              const target = byId(S.projects, id);
              if (target && target._bdWorkspaceId) {
                const { error } = await SUPA.rpc('bd_delete_workspace', { p_id: target._bdWorkspaceId });
                if (error) { toast(error.message, 'bad'); return; }
              }
              S.projects = S.projects.filter(p => p.id !== id);
              if (S.activeProjectId === id) { S.activeProjectId = null; S.activeParticipantId = null; }
              saveState(true); toast('تم الحذف', 'ok'); render();
            })().catch(e => toast('تعذر حذف المشروع: ' + e.message, 'bad'));
          });
          break;
        case 'select-participant':
          if (!id) break;
          S.activeParticipantId = id;
          saveState(true);
          go('questionnaire');
          break;
        case 'rename-participant': {
          const p = byId(pr.participants, id);
          if (!p) break;
          promptText('تعديل الاسم', 'الاسم الجديد', p.name, (nm) => { p.name = nm; saveState(true); render(); });
          break;
        }
        case 'delete-participant':
          if (!id) break;
          confirmBox('حذف المشارك', 'سيتم حذف إجابات هذا المشارك نهائياً. متابعة؟', () => {
            pr.participants = pr.participants.filter(x => x.id !== id);
            if (S.activeParticipantId === id) S.activeParticipantId = null;
            saveState(true);
            toast('تم الحذف', 'ok');
            render();
          });
          break;
        case 'pick-cat':
          CAT_VIEW = el.getAttribute('data-cat');
          render();
          break;
        case 'prev-cat': {
          const i = CATS.findIndex(c => c.id === CAT_VIEW);
          CAT_VIEW = CATS[(i - 1 + CATS.length) % CATS.length].id;
          render();
          break;
        }
        case 'next-cat': {
          const i = CATS.findIndex(c => c.id === CAT_VIEW);
          CAT_VIEW = CATS[(i + 1) % CATS.length].id;
          render();
          break;
        }
        case 'skip-q': {
          if (!pt || !id) break;
          pt.skipped = pt.skipped || {};
          if (pt.skipped[id]) delete pt.skipped[id]; else pt.skipped[id] = true;
          saveState(true);
          render();
          break;
        }
        case 'flag-q': {
          if (!pt || !id) break;
          pt.flags = pt.flags || {};
          if (pt.flags[id]) delete pt.flags[id]; else pt.flags[id] = true;
          saveState(true);
          render();
          break;
        }
        case 'clear-q': {
          if (!pt || !id) break;
          delete pt.answers[id];
          saveState(true);
          render();
          break;
        }
        case 'save-decision': {
          if (!pr) break;
          const sel = $('input[name="decision"]:checked');
          pr.decisionStatus = pr.decisionStatus || { final: '', notes: '' };
          pr.decisionStatus.final = sel ? sel.value : pr.decisionStatus.final;
          const dn = $('#decNotes');
          if (dn) pr.decisionStatus.notes = dn.value;
          saveState(true);
          toast('تم حفظ القرار', 'ok');
          break;
        }
        case 'add-task': {
          if (!pr) break;
          const inp = $('#newTask');
          const text = inp ? inp.value.trim() : '';
          if (!text) { toast('اكتب نص المهمة أولاً', 'warn'); if (inp) inp.focus(); break; }
          pr.actionItems = arr(pr.actionItems);
          pr.actionItems.push({
            id: uid('task'), text: text, status: 'todo', done: false,
            owner: '', due: '', createdAt: nowISO()
          });
          saveState(true);
          toast('تمت إضافة المهمة', 'ok');
          render();
          break;
        }
        case 'delete-task': {
          if (!pr || !id) break;
          pr.actionItems = arr(pr.actionItems).filter(t => t.id !== id);
          saveState(true);
          render();
          break;
        }
        default: break;
      }
    }

        const nums = vals.filter(x => x !== null && x !== undefined);

    function loadPrefs() {

    }
    function applyTheme(theme) {
      const t = theme === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      lsSet(APP.prefKey, JSON.stringify(Object.assign(loadPrefs(), { theme: t })));
      const b = $('#themeBtn');
      if (b) b.textContent = t === 'dark' ? 'المظهر: داكن ☾' : 'المظهر: فاتح ☀';
    }
    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      applyTheme(cur === 'dark' ? 'light' : 'dark');
    }

      on(document, '#wipeBtn', 'click', () => wipeAll());

        // a write and immediately signing out can leave the last edit only local.
        saveState(true);
        if (cloudReady()) {
          try { await syncCloudState(); }
          catch (e) {
            toast('لم يتم تسجيل الخروج لأن آخر التغييرات لم تصل إلى السحابة. تحقق من الاتصال ثم حاول مجدداً. ' + (e.message || ''), 'bad');
            return;
          }
        }
        const { error } = await SUPA.auth.signOut();
        if (error) { toast('تعذر تسجيل الخروج: ' + error.message, 'bad'); return; }
        AUTH_USER = null; AUTH_ROLE = null; AUTH_SITE_ROLE = 'member'; WORKSPACE_ROLES = Object.create(null); $('#accountEmail').textContent = ''; $('#signOutBtn').style.display = 'none';
        $('.app').style.display = 'none'; S = defaultState(); authScreen('تم تسجيل الخروج.', 'login');
      });
      on(document, '#menuBtn', 'click', () => {
