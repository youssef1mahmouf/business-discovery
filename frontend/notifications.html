<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإشعارات | Business Discovery</title><link rel="stylesheet" href="assets/css/main.css"></head><body>
<div class="app-shell" id="appShell">
  <aside class="sidebar" id="bdSidebar">
    <div class="sidebar-brand"><div class="brand-icon">BD</div><span class="brand-text">Business Discovery</span></div>
    <button class="sidebar-toggle" id="bdCollapseBtn">⇔</button>
    <nav class="sidebar-nav" id="bdSidebarNav"></nav>
    <div class="sidebar-footer">© 2026</div>
  </aside>
  <div class="sidebar-overlay" id="bdOverlay"></div>
  <div class="main-area">
    <header class="topbar" id="bdTopbar">
      <button class="mobile-menu-btn" id="bdMenuBtn">☰</button>
      <div class="topbar-left"><h1 class="page-title" id="bdPageTitle"></h1></div>
      <div class="topbar-search"><input type="search" id="bdSearch" placeholder="بحث في الإشعارات..."></div>
      <div class="topbar-actions">
        <a href="notifications.html" class="icon-btn">🔔<span class="badge-count" id="bdNotifCount" style="display:none"></span></a>
        <div class="profile-menu">
          <button class="profile-btn" id="bdProfileBtn">👤 <span id="bdUserEmail"></span></button>
          <div class="profile-dropdown" id="bdProfileDropdown">
            <a href="settings.html">الإعدادات</a>
            <a href="#" id="bdLogout">تسجيل الخروج</a>
          </div>
        </div>
      </div>
    </header>
    <main class="content" id="bdContent">
      <div class="container">
        <div class="card">
          <div class="card-header">
            <h2>الإشعارات</h2>
            <span id="notifCount" class="badge badge-blue">0</span>
          </div>
          <div id="list"></div>
        </div>
      </div>
    </main>
    <footer class="app-footer" id="bdFooter">Business Discovery © 2026 — جميع الحقوق محفوظة</footer>
  </div>
</div>
<script src="assets/js/common.js"></script>
<script src="assets/js/layout.js"></script>
<script>
BD.requireAuth();
async function load(){ try{ const d=await BD.api('/api/notifications'); const list=document.getElementById('list'); const countEl=document.getElementById('notifCount'); list.textContent=''; if(!d.notifications||!d.notifications.length){ list.innerHTML='<div class="empty-state"><span class="empty-icon">🔔</span><h3>لا توجد إشعارات</h3><p>جميع الإشعارات محدثة.</p></div>'; countEl.textContent='0'; return;} countEl.textContent=d.notifications.length; d.notifications.forEach(n=>{ const card=document.createElement('div'); card.className='card'; card.style.padding='16px'; card.style.marginBottom='12px'; card.style.display='flex'; card.style.justifyContent='space-between'; card.style.alignItems='center'; const info=document.createElement('div'); const type=document.createElement('div'); type.style.fontWeight='700'; type.style.color='var(--text)'; type.textContent=n.type||'إشعار'; info.appendChild(type); const from=document.createElement('div'); from.style.color='var(--text-muted)'; from.style.fontSize='14px'; from.textContent=n.from||'—'; info.appendChild(from); card.appendChild(info); const badge=document.createElement('span'); badge.className='badge badge-purple'; badge.textContent='جديد'; card.appendChild(badge); list.appendChild(card); }); }catch(e){ list.innerHTML='<div class="empty-state"><span class="empty-icon">⚠️</span><h3>حدث خطأ</h3><p>'+e.message+'</p></div>';} }
load();
</script></body></html>
