<div class="container"><div class="card"><h2>الإشعارات</h2><div id="list"></div></div></div>
<script src="assets/js/common.js"></script>
<script>
BD.requireAuth();
async function load(){ try{ const d=await BD.api('/api/notifications'); document.getElementById('list').innerHTML=d.notifications.map(n=>'<div class="card">'+n.type+' من '+n.from+'</div>').join('')||'لا توجد إشعارات'; }catch(e){ document.getElementById('list').textContent=e.message;} }
load();
</script></body></html>
