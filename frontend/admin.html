<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإدارة</title><link rel="stylesheet" href="assets/css/main.css"></head><body>
<nav class="nav"><a href="index.html">الرئيسية</a><a href="projects.html">المشاريع</a><a href="friends.html">الأصدقاء</a><a href="tasks.html">المهام</a><a href="notifications.html">الإشعارات</a><a href="admin.html">الإدارة</a><a href="settings.html">الإعدادات</a></nav>
<div class="container">
<div class="card"><h2>لوحة الإدارة <span id="badge"></span></h2><div id="stats"></div></div>
<div class="card"><h3>المستخدمون</h3><input id="q" placeholder="بحث"><button class="btn" onclick="search()">بحث</button><div id="users"></div></div>
</div>
<script src="assets/js/common.js"></script>
<script>
BD.requireAuth();
async function loadStats(){ try{ const d=await BD.api('/api/admin/stats'); document.getElementById('stats').textContent=JSON.stringify(d.stats); document.getElementById('badge').innerHTML='<span class="badge">Main Super Admin</span>'; }catch(e){ document.getElementById('stats').textContent=e.message; document.getElementById('badge').textContent=''; } }
async function search(){ const q=document.getElementById('q').value; try{ const d=await BD.api('/api/admin/users?q='+encodeURIComponent(q)); document.getElementById('users').innerHTML=d.users.map(u=>'<div>'+u.email+' - '+u.role+'</div>').join(''); }catch(e){ document.getElementById('users').textContent=e.message;} }
loadStats(); search();
</script></body></html>
