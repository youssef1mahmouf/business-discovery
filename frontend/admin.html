<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإدارة</title><link rel="stylesheet" href="assets/css/main.css"></head><body>
<div class="app-shell" id="appShell">
  <aside class="sidebar" id="bdSidebar">
    <div class="sidebar-brand"><div class="brand-icon">BD</div><span class="brand-text">Business Discovery</span></div>
    <button class="sidebar-toggle" id="bdCollapseBtn">⇔</button>
    <nav class="sidebar-nav" id="bdSidebarNav"></nav>
    <div class="sidebar-footer">© 2026</div>
  </aside>
  <div class="sidebar-overlay" id="bdOverlay"></div>
  <div class="main-area">
    <header class="topbar" id="bdTopbar">
      <button class="mobile-menu-btn" id="bdMenuBtn">☰</button>
      <div class="topbar-left"><h1 class="page-title" id="bdPageTitle"></h1></div>
      <div class="topbar-search"><input type="search" id="bdSearch" placeholder="بحث..."></div>
      <div class="topbar-actions">
        <a href="notifications.html" class="icon-btn">🔔<span class="badge-count" id="bdNotifCount" style="display:none"></span></a>
        <div class="profile-menu">
          <button class="profile-btn" id="bdProfileBtn">👤 <span id="bdUserEmail"></span></button>
          <div class="profile-dropdown" id="bdProfileDropdown">
            <a href="settings.html">الإعدادات</a>
            <a href="#" id="bdLogout">تسجيل الخروج</a>
          </div>
        </div>
      </div>
    </header>
    <main class="content" id="bdContent">
      <div class="container">
        <div class="card"><h2>لوحة الإدارة <span id="badge"></span></h2><div id="stats"></div></div>
        <div class="card"><h3>المستخدمون</h3><input id="q" placeholder="بحث"><button class="btn" onclick="search()">بحث</button><div id="users"></div></div>
      </div>
    </main>
    <footer class="app-footer" id="bdFooter">Business Discovery © 2026 — جميع الحقوق محفوظة</footer>
  </div>
</div>
<script src="assets/js/common.js"></script>
<script src="assets/js/layout.js"></script>
<script>
BD.requireAuth();
async function loadStats(){ try{ const d=await BD.api('/api/admin/stats'); document.getElementById('stats').textContent=JSON.stringify(d.stats); document.getElementById('badge').innerHTML='<span class="badge">Main Super Admin</span>'; }catch(e){ document.getElementById('stats').textContent=e.message; document.getElementById('badge').textContent=''; } }
async function search(){ const q=document.getElementById('q').value; try{ const d=await BD.api('/api/admin/users?q='+encodeURIComponent(q)); const ul=document.getElementById('users'); ul.textContent=''; (d.users||[]).forEach(u=>{ const div=document.createElement('div'); div.textContent=(u.email||'')+' - '+(u.role||''); ul.appendChild(div); }); }catch(e){ document.getElementById('users').textContent=e.message;} }
loadStats(); search();
</script></body></html>
