<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>المشاريع | Business Discovery</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<div class="app-shell" id="appShell">
  <aside class="sidebar" id="bdSidebar">
    <div class="sidebar-brand"><div class="brand-icon">BD</div><span class="brand-text">Business Discovery</span></div>
    <button class="sidebar-toggle" id="bdCollapseBtn" type="button" aria-label="طي القائمة">⇔</button>
    <nav class="sidebar-nav" id="bdSidebarNav"></nav>
    <div class="sidebar-footer">© 2026</div>
  </aside>
  <div class="sidebar-overlay" id="bdOverlay"></div>
  <div class="main-area">
    <header class="topbar" id="bdTopbar">
      <button class="mobile-menu-btn" id="bdMenuBtn" type="button" aria-label="فتح القائمة">☰</button>
      <div class="topbar-left"><h1 class="page-title" id="bdPageTitle"></h1></div>
      <div class="topbar-search"><input type="search" id="bdSearch" placeholder="بحث عن مشروع..." aria-label="بحث عن مشروع"></div>
      <div class="topbar-actions">
        <a href="notifications.html" class="icon-btn" aria-label="الإشعارات">🔔<span class="badge-count" id="bdNotifCount" style="display:none"></span></a>
        <div class="profile-menu">
          <button class="profile-btn" id="bdProfileBtn" type="button">👤 <span id="bdUserEmail"></span></button>
          <div class="profile-dropdown" id="bdProfileDropdown">
            <a href="settings.html">الإعدادات</a>
            <a href="#" id="bdLogout">تسجيل الخروج</a>
          </div>
        </div>
      </div>
    </header>
    <main class="content" id="bdContent">
      <div class="container">
        <section class="card">
          <div class="card-header"><h2>مشاريعي</h2><span id="projectCount" class="badge badge-blue">0</span></div>
          <div id="projectList" aria-live="polite"></div>
        </section>
        <section class="card">
          <div class="card-header"><h2>إنشاء مشروع جديد</h2></div>
          <form id="createProjectForm" class="gap-16 flex-col">
            <div><label class="label" for="projectName">اسم المشروع</label><input id="projectName" class="input" type="text" maxlength="160" required></div>
            <div><label class="label" for="projectDescription">الوصف (اختياري)</label><textarea id="projectDescription" class="input" rows="3" maxlength="4000"></textarea></div>
            <div><button id="createProjectBtn" class="btn btn-primary" type="submit">إنشاء المشروع</button></div>
            <p id="projectFormMessage" class="small" role="status" aria-live="polite"></p>
          </form>
        </section>
      </div>
    </main>
    <footer class="app-footer" id="bdFooter">Business Discovery © 2026 — جميع الحقوق محفوظة</footer>
  </div>
</div>
<script src="assets/js/common.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  BD.requireAuth();
  const projectList = document.getElementById('projectList');
  const search = document.getElementById('bdSearch');
  let projects = [];

  function emptyState(message) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    const description = document.createElement('p');
    description.textContent = message;
    empty.appendChild(description);
    return empty;
  }

  function createEditForm(project) {
    const form = document.createElement('form');
    form.className = 'gap-16 flex-col mt-16';
    const nameLabel = document.createElement('label');
    nameLabel.className = 'label';
    nameLabel.textContent = 'اسم المشروع';
    const name = document.createElement('input');
    name.className = 'input';
    name.maxLength = 160;
    name.required = true;
    name.value = project.name;
    nameLabel.appendChild(name);
    const descriptionLabel = document.createElement('label');
    descriptionLabel.className = 'label';
    descriptionLabel.textContent = 'الوصف';
    const description = document.createElement('textarea');
    description.className = 'input';
    description.rows = 3;
    description.maxLength = 4000;
    description.value = project.description || '';
    descriptionLabel.appendChild(description);
    const controls = document.createElement('div');
    controls.className = 'flex gap-8';
    const save = document.createElement('button');
    save.className = 'btn btn-primary btn-sm';
    save.type = 'submit';
    save.textContent = 'حفظ التعديلات';
    controls.appendChild(save);
    form.append(nameLabel, descriptionLabel, controls);
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      save.disabled = true;
      try {
        await BD.api('/api/projects/' + encodeURIComponent(project.id), {
          method: 'PUT',
          body: JSON.stringify({ name: name.value.trim(), description: description.value.trim() })
        });
        BD.showToast('تم تحديث المشروع');
        await load();
      } catch (error) {
        save.disabled = false;
        BD.showToast(error.message, 'error');
      }
    });
    return form;
  }

  function render() {
    const query = search.value.trim().toLowerCase();
    const visible = projects.filter((project) =>
      [project.name, project.description].some((value) => String(value || '').toLowerCase().includes(query)));
    document.getElementById('projectCount').textContent = String(visible.length);
    projectList.textContent = '';
    if (!visible.length) {
      projectList.appendChild(emptyState(query ? 'لا توجد مشاريع مطابقة للبحث.' : 'لا توجد مشاريع بعد. أنشئ مشروعك الأول أدناه.'));
      return;
    }

    visible.forEach((project) => {
      const card = document.createElement('article');
      card.className = 'card';
      card.style.padding = '16px';
      card.style.marginBottom = '12px';
      const heading = document.createElement('div');
      heading.className = 'flex items-center justify-between gap-16';
      const name = document.createElement('h3');
      name.textContent = project.name;
      const role = document.createElement('span');
      role.className = 'badge badge-blue';
      role.textContent = project.role === 'owner' ? 'مالك' : project.role === 'project_manager' ? 'مدير مشروع' : 'عضو';
      heading.append(name, role);
      card.appendChild(heading);
      const description = document.createElement('p');
      description.textContent = project.description || 'لا يوجد وصف';
      card.appendChild(description);

      if (project.role === 'owner') {
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        summary.textContent = 'إدارة المشروع';
        details.append(summary, createEditForm(project));
        const archive = document.createElement('button');
        archive.className = 'btn btn-danger btn-sm mt-16';
        archive.type = 'button';
        archive.textContent = 'أرشفة المشروع';
        archive.addEventListener('click', async () => {
          if (!confirm('ستتم أرشفة المشروع وإخفاؤه من القائمة. هل تريد المتابعة؟')) return;
          archive.disabled = true;
          try {
            await BD.api('/api/projects/' + encodeURIComponent(project.id), { method: 'DELETE' });
            BD.showToast('تمت أرشفة المشروع');
            await load();
          } catch (error) {
            archive.disabled = false;
            BD.showToast(error.message, 'error');
          }
        });
        details.appendChild(archive);
        card.appendChild(details);
      }
      projectList.appendChild(card);
    });
  }

  async function load() {
    try {
      const data = await BD.api('/api/projects?limit=50');
      projects = data.projects || [];
      render();
    } catch (error) {
      projectList.textContent = '';
      projectList.appendChild(emptyState(error.message || 'تعذر تحميل المشاريع.'));
    }
  }

  document.getElementById('createProjectForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    const button = document.getElementById('createProjectBtn');
    const message = document.getElementById('projectFormMessage');
    const body = {
      name: document.getElementById('projectName').value.trim(),
      description: document.getElementById('projectDescription').value.trim()
    };
    button.disabled = true;
    message.textContent = '';
    try {
      await BD.api('/api/projects', { method: 'POST', body: JSON.stringify(body) });
      event.currentTarget.reset();
      BD.showToast('تم إنشاء المشروع');
      await load();
    } catch (error) {
      message.textContent = error.message;
      message.style.color = 'var(--danger)';
    } finally {
      button.disabled = false;
    }
  });
  search.addEventListener('input', render);
  load();
</script>
</body>
</html>
