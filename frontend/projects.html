<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>المشاريع | Business Discovery</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<div class="app-shell" id="appShell">
  <aside class="sidebar" id="bdSidebar">
    <div class="sidebar-brand"><div class="brand-icon">BD</div><span class="brand-text">Business Discovery</span></div>
    <button class="sidebar-toggle" id="bdCollapseBtn" type="button" aria-label="طي القائمة">⇔</button>
    <nav class="sidebar-nav" id="bdSidebarNav"></nav>
    <div class="sidebar-footer">© 2026</div>
  </aside>
  <div class="sidebar-overlay" id="bdOverlay"></div>
  <div class="main-area">
    <header class="topbar" id="bdTopbar">
      <button class="mobile-menu-btn" id="bdMenuBtn" type="button" aria-label="فتح القائمة">☰</button>
      <div class="topbar-left"><h1 class="page-title" id="bdPageTitle"></h1></div>
      <div class="topbar-search"><input type="search" id="bdSearch" placeholder="بحث عن مشروع..." aria-label="بحث عن مشروع"></div>
      <div class="topbar-actions">
        <a href="notifications.html" class="icon-btn" aria-label="الإشعارات">🔔<span class="badge-count" id="bdNotifCount" style="display:none"></span></a>
        <div class="profile-menu">
          <button class="profile-btn" id="bdProfileBtn" type="button">👤 <span id="bdUserEmail"></span></button>
          <div class="profile-dropdown" id="bdProfileDropdown">
            <a href="settings.html">الإعدادات</a>
            <a href="#" id="bdLogout">تسجيل الخروج</a>
          </div>
        </div>
      </div>
    </header>
    <main class="content" id="bdContent">
      <div class="container">
        <section class="card">
          <div class="card-header"><h2>مشاريعي</h2><span id="projectCount" class="badge badge-blue">0</span></div>
          <div id="projectList" aria-live="polite"></div>
        </section>
        <section class="card">
          <div class="card-header"><h2>إنشاء مشروع جديد</h2></div>
          <form id="createProjectForm" class="gap-16 flex-col">
            <div><label class="label" for="projectName">اسم المشروع</label><input id="projectName" class="input" type="text" maxlength="160" required></div>
            <div><label class="label" for="projectType">نوع المشروع</label><select id="projectType" class="input"><option value="">غير محدد</option><option value="saas">خدمة برمجية</option><option value="ecommerce">تجارة إلكترونية</option><option value="services">خدمات</option><option value="retail">تجارة / متجر</option><option value="marketplace">منصة وساطة</option><option value="other">أخرى</option></select></div>
            <div><label class="label" for="projectIndustry">المجال</label><input id="projectIndustry" class="input" maxlength="120"></div>
            <div><label class="label" for="projectStage">المرحلة</label><select id="projectStage" class="input"><option value="">غير محددة</option><option value="idea">فكرة</option><option value="validation">التحقق من الفكرة</option><option value="mvp">المنتج الأولي</option><option value="launched">تم الإطلاق</option><option value="growth">النمو</option></select></div>
            <div><label class="label" for="projectTargetMarket">السوق أو العملاء المستهدفون</label><input id="projectTargetMarket" class="input" maxlength="500"></div>
            <div class="wide"><label class="label" for="projectProblem">المشكلة التي يحلها</label><textarea id="projectProblem" class="input" rows="2" maxlength="2000"></textarea></div>
            <div><label class="label" for="projectDescription">الوصف (اختياري)</label><textarea id="projectDescription" class="input" rows="3" maxlength="4000"></textarea></div>
            <div><button id="createProjectBtn" class="btn btn-primary" type="submit">إنشاء المشروع</button></div>
            <p id="projectFormMessage" class="small" role="status" aria-live="polite"></p>
          </form>
        </section>
      </div>
    </main>
    <footer class="app-footer" id="bdFooter">Business Discovery © 2026 — جميع الحقوق محفوظة</footer>
  </div>
</div>
<script src="assets/js/common.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  BD.requireAuth();
  const projectList = document.getElementById('projectList');
  const search = document.getElementById('bdSearch');
  let projects = [];

  function emptyState(message) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    const description = document.createElement('p');
    description.textContent = message;
    empty.appendChild(description);
    return empty;
  }

  function createEditForm(project) {
    const form = document.createElement('form');
    form.className = 'gap-16 flex-col mt-16';
    const nameLabel = document.createElement('label');
    nameLabel.className = 'label';
    nameLabel.textContent = 'اسم المشروع';
    const name = document.createElement('input');
    name.className = 'input';
    name.maxLength = 160;
    name.required = true;
    name.value = project.name;
    nameLabel.appendChild(name);
    const descriptionLabel = document.createElement('label');
    descriptionLabel.className = 'label';
    descriptionLabel.textContent = 'الوصف';
    const description = document.createElement('textarea');
    description.className = 'input';
    description.rows = 3;
    description.maxLength = 4000;
    description.value = project.description || '';
    descriptionLabel.appendChild(description);
    const metadata = [
      { key: 'projectType', label: 'نوع المشروع', type: 'select', options: [['', 'غير محدد'], ['saas', 'خدمة برمجية'], ['ecommerce', 'تجارة إلكترونية'], ['services', 'خدمات'], ['retail', 'تجارة / متجر'], ['marketplace', 'منصة وساطة'], ['other', 'أخرى']] },
      { key: 'industry', label: 'المجال', maxLength: 120 },
      { key: 'stage', label: 'المرحلة', type: 'select', options: [['', 'غير محددة'], ['idea', 'فكرة'], ['validation', 'التحقق من الفكرة'], ['mvp', 'المنتج الأولي'], ['launched', 'تم الإطلاق'], ['growth', 'النمو']] },
      { key: 'targetMarket', label: 'السوق أو العملاء المستهدفون', maxLength: 500 },
      { key: 'problem', label: 'المشكلة التي يحلها المشروع', type: 'textarea', maxLength: 2000 }
    ];
    const controls = metadata.map((field) => {
      const label = document.createElement('label');
      label.className = 'label';
      label.textContent = field.label;
      const input = document.createElement(field.type === 'textarea' ? 'textarea' : field.type === 'select' ? 'select' : 'input');
      input.className = 'input';
      if (field.type === 'textarea') input.rows = 2;
      if (field.maxLength) input.maxLength = field.maxLength;
      if (field.options) field.options.forEach(([value, text]) => input.add(new Option(text, value)));
      input.value = project[field.key] || '';
      label.appendChild(input);
      return { key: field.key, label, input };
    });
    const buttonRow = document.createElement('div');
    buttonRow.className = 'flex gap-8';
    const save = document.createElement('button');
    save.className = 'btn btn-primary btn-sm';
    save.type = 'submit';
    save.textContent = 'حفظ التعديلات';
    buttonRow.appendChild(save);
    form.append(nameLabel, descriptionLabel, ...controls.map((field) => field.label), buttonRow);
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      save.disabled = true;
      try {
        await BD.api('/api/projects/' + encodeURIComponent(project.id), {
          method: 'PUT',
          body: JSON.stringify({
            name: name.value.trim(),
            description: description.value.trim(),
            ...Object.fromEntries(controls.map((field) => [field.key, field.input.value.trim()]))
          })
        });
        BD.showToast('تم تحديث المشروع');
        await load();
      } catch (error) {
        save.disabled = false;
        BD.showToast(error.message, 'error');
      }
    });
    return form;
  }

  function render() {
    const query = search.value.trim().toLowerCase();
    const visible = projects.filter((project) =>
      [project.name, project.description, project.industry, project.targetMarket, project.problem]
        .some((value) => String(value || '').toLowerCase().includes(query)));
    document.getElementById('projectCount').textContent = String(visible.length);
    projectList.textContent = '';
    if (!visible.length) {
      projectList.appendChild(emptyState(query ? 'لا توجد مشاريع مطابقة للبحث.' : 'لا توجد مشاريع بعد. أنشئ مشروعك الأول أدناه.'));
      return;
    }

    visible.forEach((project) => {
      const card = document.createElement('article');
      card.className = 'card';
      card.style.padding = '16px';
      card.style.marginBottom = '12px';
      const heading = document.createElement('div');
      heading.className = 'flex items-center justify-between gap-16';
      const name = document.createElement('h3');
      name.textContent = project.name;
      const role = document.createElement('span');
      role.className = 'badge badge-blue';
      role.textContent = project.role === 'owner' ? 'مالك' : project.role === 'project_manager' ? 'مدير مشروع' : 'عضو';
      heading.append(name, role);
      card.appendChild(heading);
      const description = document.createElement('p');
      description.textContent = project.description || 'لا يوجد وصف';
      card.appendChild(description);
      const details = [
        project.projectType && 'النوع: ' + ({ saas: 'خدمة برمجية', ecommerce: 'تجارة إلكترونية', services: 'خدمات', retail: 'تجارة / متجر', marketplace: 'منصة وساطة', other: 'أخرى' })[project.projectType],
        project.industry && 'المجال: ' + project.industry,
        project.stage && 'المرحلة: ' + ({ idea: 'فكرة', validation: 'التحقق من الفكرة', mvp: 'المنتج الأولي', launched: 'تم الإطلاق', growth: 'النمو' })[project.stage],
        project.targetMarket && 'السوق المستهدف: ' + project.targetMarket,
        project.problem && 'المشكلة: ' + project.problem
      ].filter(Boolean);
      details.forEach((detail) => {
        const paragraph = document.createElement('p');
        paragraph.className = 'small';
        paragraph.textContent = detail;
        card.appendChild(paragraph);
      });

      if (project.role === 'owner') {
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        summary.textContent = 'إدارة المشروع';
        details.append(summary, createEditForm(project));
        const archive = document.createElement('button');
        archive.className = 'btn btn-danger btn-sm mt-16';
        archive.type = 'button';
        archive.textContent = 'أرشفة المشروع';
        archive.addEventListener('click', async () => {
          if (!confirm('ستتم أرشفة المشروع وإخفاؤه من القائمة. هل تريد المتابعة؟')) return;
          archive.disabled = true;
          try {
            await BD.api('/api/projects/' + encodeURIComponent(project.id), { method: 'DELETE' });
            BD.showToast('تمت أرشفة المشروع');
            await load();
            window.dispatchEvent(new Event('bd:projects-changed'));
          } catch (error) {
            archive.disabled = false;
            BD.showToast(error.message, 'error');
          }
        });
        details.appendChild(archive);
        card.appendChild(details);
      }
      projectList.appendChild(card);
    });
  }

  async function load() {
    try {
      const data = await BD.api('/api/projects?limit=50');
      projects = data.projects || [];
      render();
    } catch (error) {
      projectList.textContent = '';
      projectList.appendChild(emptyState(error.message || 'تعذر تحميل المشاريع.'));
    }
  }

  document.getElementById('createProjectForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    const button = document.getElementById('createProjectBtn');
    const message = document.getElementById('projectFormMessage');
    const body = {
      name: document.getElementById('projectName').value.trim(),
      description: document.getElementById('projectDescription').value.trim(),
      projectType: document.getElementById('projectType').value,
      industry: document.getElementById('projectIndustry').value.trim(),
      stage: document.getElementById('projectStage').value,
      targetMarket: document.getElementById('projectTargetMarket').value.trim(),
      problem: document.getElementById('projectProblem').value.trim()
    };
    button.disabled = true;
    message.textContent = '';
    try {
      await BD.api('/api/projects', { method: 'POST', body: JSON.stringify(body) });
      event.currentTarget.reset();
      BD.showToast('تم إنشاء المشروع');
      await load();
      window.dispatchEvent(new Event('bd:projects-changed'));
    } catch (error) {
      message.textContent = error.message;
      message.style.color = 'var(--danger)';
    } finally {
      button.disabled = false;
    }
  });
  search.addEventListener('input', render);
  load();
</script>
</body>
</html>
