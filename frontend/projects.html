<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>المشاريع</title>
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<nav class="nav"><a href="index.html">الرئيسية</a><a href="projects.html">المشاريع</a><a href="friends.html">الأصدقاء</a><a href="tasks.html">المهام</a><a href="notifications.html">الإشعارات</a><a href="admin.html">الإدارة</a></nav>
<div class="container">
<div class="card"><h2>مشاريعي</h2><div id="list"></div></div>
<div class="card"><h3>إنشاء مشروع</h3>
<input id="name" placeholder="اسم المشروع"><input id="desc" placeholder="الوصف">
<button class="btn" onclick="create()">إنشاء</button><p id="msg"></p></div>
</div>
<script src="assets/js/common.js"></script>
<script>
BD.requireAuth();
async function load(){ try{ const d=await BD.api('/api/projects'); document.getElementById('list').innerHTML = d.projects.map(p=>'<div class="card"><b>'+p.name+'</b><br>'+p.description+'</div>').join('') || 'لا توجد مشاريع'; }catch(e){ document.getElementById('list').textContent=e.message;} }
async function create(){ try{ await BD.api('/api/projects',{method:'POST',body:JSON.stringify({name:document.getElementById('name').value,description:document.getElementById('desc').value})}); load(); }catch(e){ document.getElementById('msg').textContent=e.message;} }
load();
</script>
</body></html>
