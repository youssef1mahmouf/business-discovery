<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدردشة | Business Discovery</title><link rel="stylesheet" href="assets/css/main.css"></head><body>
<div class="app-shell" id="appShell">
  <aside class="sidebar" id="bdSidebar">
    <div class="sidebar-brand"><div class="brand-icon">BD</div><span class="brand-text">Business Discovery</span></div>
    <button class="sidebar-toggle" id="bdCollapseBtn">⇔</button>
    <nav class="sidebar-nav" id="bdSidebarNav"></nav>
    <div class="sidebar-footer">© 2026</div>
  </aside>
  <div class="sidebar-overlay" id="bdOverlay"></div>
  <div class="main-area">
    <header class="topbar" id="bdTopbar">
      <button class="mobile-menu-btn" id="bdMenuBtn">☰</button>
      <div class="topbar-left"><h1 class="page-title" id="bdPageTitle"></h1></div>
      <div class="topbar-search"><input type="search" id="bdSearch" placeholder="بحث في المحادثات..."></div>
      <div class="topbar-actions">
        <a href="notifications.html" class="icon-btn">🔔<span class="badge-count" id="bdNotifCount" style="display:none"></span></a>
        <div class="profile-menu">
          <button class="profile-btn" id="bdProfileBtn">👤 <span id="bdUserEmail"></span></button>
          <div class="profile-dropdown" id="bdProfileDropdown">
            <a href="settings.html">الإعدادات</a>
            <a href="#" id="bdLogout">تسجيل الخروج</a>
          </div>
        </div>
      </div>
    </header>
    <main class="content" id="bdContent">
      <div class="container">
        <div class="card">
          <div class="card-header">
            <h2>المحادثات</h2>
            <span id="convCount" class="badge badge-blue">0</span>
          </div>
          <div id="list"></div>
        </div>
      </div>
    </main>
    <footer class="app-footer" id="bdFooter">Business Discovery © 2026 — جميع الحقوق محفوظة</footer>
  </div>
</div>
<script src="assets/js/common.js"></script>
<script src="assets/js/layout.js"></script>
<script>
BD.requireAuth();
async function load(){ try{ const d=await BD.api('/api/conversations'); const list=document.getElementById('list'); const countEl=document.getElementById('convCount'); list.textContent=''; if(!d.conversations||!d.conversations.length){ list.innerHTML='<div class="empty-state"><span class="empty-icon">💬</span><h3>لا توجد محادثات</h3><p>ابدأ محادثة جديدة مع فريقك.</p></div>'; countEl.textContent='0'; return;} countEl.textContent=d.conversations.length; d.conversations.forEach(c=>{ const card=document.createElement('div'); card.className='card'; card.style.padding='16px'; card.style.marginBottom='12px'; card.style.display='flex'; card.style.justifyContent='space-between'; card.style.alignItems='center'; card.style.cursor='pointer'; card.onclick=function(){ location.href='chat.html?id='+c.id; }; const info=document.createElement('div'); const title=document.createElement('div'); title.style.fontWeight='700'; title.style.color='var(--text)'; title.textContent=c.title||c.type||'محادثة'; info.appendChild(title); const members=document.createElement('div'); members.style.color='var(--text-muted)'; members.style.fontSize='14px'; members.textContent=(c.members||[]).join(', '); info.appendChild(members); card.appendChild(info); const badge=document.createElement('span'); badge.className='badge badge-cyan'; badge.textContent='محادثة'; card.appendChild(badge); list.appendChild(card); }); }catch(e){ list.innerHTML='<div class="empty-state"><span class="empty-icon">⚠️</span><h3>حدث خطأ</h3><p>'+e.message+'</p></div>';} }
load();
</script></body></html>
