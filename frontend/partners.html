<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الشركاء | Business Discovery</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<div class="app-shell" id="appShell">
  <aside class="sidebar" id="bdSidebar">
    <div class="sidebar-brand"><div class="brand-icon">BD</div><span class="brand-text">Business Discovery</span></div>
    <button class="sidebar-toggle" id="bdCollapseBtn" type="button" aria-label="طي القائمة">⇔</button>
    <nav class="sidebar-nav" id="bdSidebarNav"></nav>
    <div class="sidebar-footer">© 2026</div>
  </aside>
  <div class="sidebar-overlay" id="bdOverlay"></div>
  <div class="main-area">
    <header class="topbar" id="bdTopbar">
      <button class="mobile-menu-btn" id="bdMenuBtn" type="button" aria-label="فتح القائمة">☰</button>
      <div class="topbar-left"><h1 class="page-title" id="bdPageTitle"></h1></div>
      <div class="topbar-search"><input type="search" id="bdSearch" placeholder="بحث عن شريك..." aria-label="بحث عن شريك"></div>
      <div class="topbar-actions">
        <a href="notifications.html" class="icon-btn" aria-label="الإشعارات">🔔<span class="badge-count" id="bdNotifCount" style="display:none"></span></a>
        <div class="profile-menu">
          <button class="profile-btn" id="bdProfileBtn" type="button">👤 <span id="bdUserEmail"></span></button>
          <div class="profile-dropdown" id="bdProfileDropdown">
            <a href="settings.html">الإعدادات</a>
            <a href="#" id="bdLogout">تسجيل الخروج</a>
          </div>
        </div>
      </div>
    </header>
    <main class="content" id="bdContent">
      <div class="container">
        <section class="card">
          <div class="card-header"><h2>دعوة شريك</h2></div>
          <form id="partnerInviteForm" class="gap-16 flex-col">
            <div>
              <label class="label" for="partnerEmail">البريد الإلكتروني</label>
              <input id="partnerEmail" class="input" type="email" autocomplete="email" required>
            </div>
            <button id="partnerInviteBtn" class="btn btn-primary" type="submit">إرسال الدعوة</button>
            <p id="partnerInviteMsg" class="small" role="status" aria-live="polite"></p>
          </form>
        </section>
        <section class="card">
          <div class="card-header"><h2>دعوات الشراكة الواردة</h2><span id="incomingCount" class="badge badge-blue">0</span></div>
          <div id="incomingList"></div>
        </section>
        <section class="card">
          <div class="card-header"><h2>الشركاء</h2><span id="partnerCount" class="badge badge-purple">0</span></div>
          <div id="partnerList"></div>
        </section>
        <section class="card">
          <div class="card-header"><h2>الدعوات المرسلة</h2><span id="sentCount" class="badge badge-cyan">0</span></div>
          <div id="sentList"></div>
        </section>
      </div>
    </main>
    <footer class="app-footer" id="bdFooter">Business Discovery © 2026 — جميع الحقوق محفوظة</footer>
  </div>
</div>
<script src="assets/js/common.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  BD.requireAuth();
  const search = document.getElementById('bdSearch');
  let partners = [];
  let incoming = [];
  let sent = [];

  function showEmpty(container, text) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    const description = document.createElement('p');
    description.textContent = text;
    empty.appendChild(description);
    container.appendChild(empty);
  }

  function actionButton(label, className, handler) {
    const button = document.createElement('button');
    button.className = 'btn ' + className + ' btn-sm';
    button.type = 'button';
    button.textContent = label;
    button.addEventListener('click', handler);
    return button;
  }

  function render() {
    const query = search.value.trim().toLowerCase();
    const incomingList = document.getElementById('incomingList');
    const partnerList = document.getElementById('partnerList');
    const sentList = document.getElementById('sentList');
    const filteredIncoming = incoming.filter((item) => String(item.from || '').toLowerCase().includes(query));
    const filteredPartners = partners.filter((email) => String(email).toLowerCase().includes(query));
    const filteredSent = sent.filter((item) => String(item.to || '').toLowerCase().includes(query));
    incomingList.textContent = '';
    partnerList.textContent = '';
    sentList.textContent = '';
    document.getElementById('incomingCount').textContent = String(filteredIncoming.length);
    document.getElementById('partnerCount').textContent = String(filteredPartners.length);
    document.getElementById('sentCount').textContent = String(filteredSent.length);

    if (!filteredIncoming.length) showEmpty(incomingList, 'لا توجد دعوات شراكة واردة.');
    filteredIncoming.forEach((invitation) => {
      const card = document.createElement('article');
      card.className = 'card';
      const email = document.createElement('strong');
      email.textContent = invitation.from;
      const actions = document.createElement('div');
      actions.className = 'flex gap-8 mt-16';
      actions.append(
        actionButton('قبول', 'btn-primary', () => resolveInvitation(invitation, 'accept')),
        actionButton('رفض', 'btn-secondary', () => resolveInvitation(invitation, 'reject')),
      );
      card.append(email, actions);
      incomingList.appendChild(card);
    });

    if (!filteredPartners.length) showEmpty(partnerList, 'ستظهر الشراكات المؤكدة هنا.');
    filteredPartners.forEach((emailValue) => {
      const card = document.createElement('article');
      card.className = 'card flex items-center justify-between gap-16';
      const email = document.createElement('strong');
      email.textContent = emailValue;
      const badge = document.createElement('span');
      badge.className = 'badge badge-purple';
      badge.textContent = 'شريك';
      card.append(email, badge);
      partnerList.appendChild(card);
    });

    if (!filteredSent.length) showEmpty(sentList, 'لا توجد دعوات شراكة معلقة أرسلتها.');
    filteredSent.forEach((invitation) => {
      const card = document.createElement('article');
      card.className = 'card flex items-center justify-between gap-16';
      const email = document.createElement('strong');
      email.textContent = invitation.to;
      const status = document.createElement('span');
      status.className = 'badge badge-cyan';
      status.textContent = 'بانتظار الرد';
      card.append(email, status);
      sentList.appendChild(card);
    });
  }

  async function resolveInvitation(invitation, action) {
    try {
      await BD.api('/api/partners/invitations/' + encodeURIComponent(invitation._id) + '/' + action, { method: 'POST' });
      BD.showToast(action === 'accept' ? 'تم قبول دعوة الشراكة' : 'تم رفض دعوة الشراكة');
      await load();
    } catch (error) {
      BD.showToast(error.message, 'error');
    }
  }

  async function load() {
    try {
      const data = await BD.api('/api/partners');
      partners = data.partners || [];
      incoming = data.pending || [];
      sent = data.sent || [];
      render();
    } catch (error) {
      BD.showToast(error.message || 'تعذر تحميل الشركاء', 'error');
    }
  }

  document.getElementById('partnerInviteForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    const button = document.getElementById('partnerInviteBtn');
    const message = document.getElementById('partnerInviteMsg');
    const email = document.getElementById('partnerEmail').value.trim();
    button.disabled = true;
    message.textContent = '';
    try {
      await BD.api('/api/partners/invitations', { method: 'POST', body: JSON.stringify({ to: email }) });
      event.currentTarget.reset();
      message.textContent = 'تم إرسال الدعوة.';
      message.style.color = 'var(--success)';
      BD.showToast('تم إرسال دعوة الشراكة');
      await load();
    } catch (error) {
      message.textContent = error.message;
      message.style.color = 'var(--danger)';
    } finally {
      button.disabled = false;
    }
  });
  search.addEventListener('input', render);
  load();
</script>
</body>
</html>
