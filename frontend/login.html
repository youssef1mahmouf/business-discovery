<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Business Discovery - Login</title>
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<div class="rd-shell">
  <div class="rd-bg"></div>
  <div class="rd-grid-overlay"></div>
  <div class="rd-blob b1"></div>
  <div class="rd-blob b2"></div>
  <div class="rd-auth">
    <div class="rd-auth-card">
      <div class="rd-logo" style="margin-bottom:18px;"><span class="rd-logo-mark">BD</span><span>Business Discovery</span></div>
      <h1>تسجيل الدخول</h1>
      <p class="sub">أهلاً بعودتك. أدخل بياناتك للمتابعة.</p>
      <form id="loginForm" onsubmit="return false;">
        <div class="rd-field">
          <label class="rd-label" for="email">البريد الإلكتروني</label>
          <input id="email" class="rd-input" type="email" placeholder="name@example.com" autocomplete="email">
          <div id="emailErr" class="rd-error"></div>
        </div>
        <div class="rd-field">
          <label class="rd-label" for="password">كلمة المرور</label>
          <div class="rd-input-wrap">
            <input id="password" class="rd-input" type="password" placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="rd-toggle-pw" onclick="togglePw('password', this)">إظهار</button>
          </div>
          <div id="pwErr" class="rd-error"></div>
        </div>
        <div class="rd-row">
          <span></span>
          <span class="rd-link" onclick="openForgot()">نسيت كلمة المرور؟</span>
        </div>
        <button id="loginBtn" class="rd-btn primary" style="width:100%;" onclick="login()">دخول</button>
        <div id="msg" class="rd-msg"></div>
      </form>
      <p style="margin-top:18px;font-size:13px;color:var(--muted);text-align:center;">
        ليس لديك حساب؟ <a class="rd-link" href="register.html">إنشاء حساب</a>
      </p>
    </div>
  </div>
</div>

<div id="forgotBackdrop" class="rd-modal-backdrop">
  <section class="rd-modal" role="dialog" aria-modal="true" aria-labelledby="forgotTitle">
    <h2 id="forgotTitle" style="margin:0 0 6px;">استعادة كلمة المرور</h2>
    <div id="forgotRequestStep">
      <p style="color:var(--muted);font-size:14px;margin:0 0 16px;">أدخل بريدك الإلكتروني لاستلام رمز استعادة صالح لمدة 15 دقيقة.</p>
      <div class="rd-field">
        <label class="rd-label" for="forgotEmail">البريد الإلكتروني</label>
        <input id="forgotEmail" class="rd-input" type="email" placeholder="name@example.com" autocomplete="email">
      </div>
      <div id="forgotRequestMsg" class="rd-msg" role="status" aria-live="polite"></div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="rd-btn ghost" style="flex:1;" onclick="closeForgot()">إلغاء</button>
        <button id="forgotRequestBtn" class="rd-btn primary" style="flex:1;" onclick="requestPasswordReset()">إرسال الرمز</button>
      </div>
    </div>
    <div id="forgotResetStep" hidden>
      <p style="color:var(--muted);font-size:14px;margin:0 0 16px;">أدخل الرمز الذي وصلك واختر كلمة مرور جديدة.</p>
      <div class="rd-field">
        <label class="rd-label" for="recoveryCode">رمز الاستعادة</label>
        <input id="recoveryCode" class="rd-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}">
      </div>
      <div class="rd-field">
        <label class="rd-label" for="recoveryPassword">كلمة المرور الجديدة</label>
        <input id="recoveryPassword" class="rd-input" type="password" autocomplete="new-password">
      </div>
      <div class="rd-field">
        <label class="rd-label" for="recoveryConfirm">تأكيد كلمة المرور</label>
        <input id="recoveryConfirm" class="rd-input" type="password" autocomplete="new-password">
      </div>
      <div id="forgotResetMsg" class="rd-msg" role="status" aria-live="polite"></div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="rd-btn ghost" style="flex:1;" onclick="closeForgot()">إلغاء</button>
        <button id="forgotResetBtn" class="rd-btn primary" style="flex:1;" onclick="completePasswordReset()">تحديث كلمة المرور</button>
      </div>
    </div>
  </section>
</div>

<script src="assets/js/common.js"></script>
<script>
  function togglePw(id, btn) {
    const el = document.getElementById(id);
    if (el.type === 'password') { el.type = 'text'; btn.textContent = 'إخفاء'; }
    else { el.type = 'password'; btn.textContent = 'إظهار'; }
  }
  function setLoading(btn, loading) {
    if (loading) { btn.disabled = true; btn.innerHTML = '<span class="rd-spinner"></span> جاري...'; }
    else { btn.disabled = false; btn.textContent = 'دخول'; }
  }
  function openForgot() {
    document.getElementById('forgotEmail').value = document.getElementById('email').value.trim();
    document.getElementById('forgotBackdrop').classList.add('open');
    document.getElementById('forgotEmail').focus();
  }
  function closeForgot() {
    document.getElementById('forgotBackdrop').classList.remove('open');
    document.getElementById('forgotRequestStep').hidden = false;
    document.getElementById('forgotResetStep').hidden = true;
    document.getElementById('recoveryCode').value = '';
    document.getElementById('recoveryPassword').value = '';
    document.getElementById('recoveryConfirm').value = '';
  }
  async function requestPasswordReset() {
    const email = document.getElementById('forgotEmail').value.trim();
    const message = document.getElementById('forgotRequestMsg');
    const button = document.getElementById('forgotRequestBtn');
    message.textContent = '';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      message.textContent = 'يرجى إدخال بريد إلكتروني صالح';
      message.className = 'rd-msg error';
      return;
    }
    button.disabled = true;
    try {
      await BD.api('/api/auth/password-recovery', { method: 'POST', body: JSON.stringify({ email }) });
      document.getElementById('forgotRequestStep').hidden = true;
      document.getElementById('forgotResetStep').hidden = false;
      document.getElementById('recoveryCode').focus();
      document.getElementById('forgotResetMsg').textContent = 'إذا كان البريد مرتبطاً بحساب، فسيصلك رمز الاستعادة. تحقق من إعدادات البريد أو تواصل مع الإدارة إذا لم يصلك.';
      document.getElementById('forgotResetMsg').className = 'rd-msg';
    } catch (error) {
      message.textContent = error.message || 'تعذر طلب استعادة كلمة المرور';
      message.className = 'rd-msg error';
    } finally {
      button.disabled = false;
    }
  }
  async function completePasswordReset() {
    const email = document.getElementById('forgotEmail').value.trim();
    const code = document.getElementById('recoveryCode').value.trim();
    const newPassword = document.getElementById('recoveryPassword').value;
    const confirmPassword = document.getElementById('recoveryConfirm').value;
    const message = document.getElementById('forgotResetMsg');
    const button = document.getElementById('forgotResetBtn');
    message.textContent = '';
    if (!/^\d{6}$/.test(code) || newPassword.length < 8 || newPassword !== confirmPassword) {
      message.textContent = newPassword !== confirmPassword ? 'كلمتا المرور غير متطابقتين' : 'تحقق من الرمز وكلمة المرور (8 أحرف على الأقل)';
      message.className = 'rd-msg error';
      return;
    }
    button.disabled = true;
    try {
      await BD.api('/api/auth/reset-password-with-code', {
        method: 'POST',
        body: JSON.stringify({ email, code, newPassword, confirmPassword })
      });
      closeForgot();
      const loginMessage = document.getElementById('msg');
      loginMessage.textContent = 'تم تحديث كلمة المرور. يمكنك تسجيل الدخول الآن.';
      loginMessage.className = 'rd-msg success';
    } catch (error) {
      message.textContent = error.message || 'تعذر تحديث كلمة المرور';
      message.className = 'rd-msg error';
    } finally {
      button.disabled = false;
    }
  }
  async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const emailErr = document.getElementById('emailErr');
    const pwErr = document.getElementById('pwErr');
    const msg = document.getElementById('msg');
    emailErr.textContent = ''; pwErr.textContent = ''; msg.textContent = ''; msg.className = 'rd-msg';
    let ok = true;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { emailErr.textContent = 'بريد إلكتروني غير صالح'; ok = false; }
    if (password.length < 8) { pwErr.textContent = 'كلمة المرور 8 أحرف على الأقل'; ok = false; }
    if (!ok) return;
    const btn = document.getElementById('loginBtn');
    setLoading(btn, true);
    try {
      const data = await BD.api('/api/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
      BD.setToken(data.token);
      if (data.user && data.user.mustChangePassword) {
        location.href = 'change-password.html';
        return;
      }
      msg.textContent = 'تم تسجيل الدخول بنجاح';
      msg.className = 'rd-msg success';
      setTimeout(() => location.href = 'projects.html', 600);
    } catch (e) {
      msg.textContent = e.message || 'فشل تسجيل الدخول';
      msg.className = 'rd-msg error';
    } finally {
      setLoading(btn, false);
    }
  }
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (!document.getElementById('forgotBackdrop').classList.contains('open')) login();
    else if (!document.getElementById('forgotRequestStep').hidden) requestPasswordReset();
    else completePasswordReset();
  });
</script>
</body></html>
