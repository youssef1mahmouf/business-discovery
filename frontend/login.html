<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Business Discovery - Login</title>
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<div class="rd-shell">
  <div class="rd-bg"></div>
  <div class="rd-grid-overlay"></div>
  <div class="rd-blob b1"></div>
  <div class="rd-blob b2"></div>
  <div class="rd-auth">
    <div class="rd-auth-card">
      <div class="rd-logo" style="margin-bottom:18px;"><span class="rd-logo-mark">BD</span><span>Business Discovery</span></div>
      <h1>تسجيل الدخول</h1>
      <p class="sub">أهلاً بعودتك. أدخل بياناتك للمتابعة.</p>
      <form id="loginForm" onsubmit="return false;">
        <div class="rd-field">
          <label class="rd-label" for="email">البريد الإلكتروني</label>
          <input id="email" class="rd-input" type="email" placeholder="name@example.com" autocomplete="email">
          <div id="emailErr" class="rd-error"></div>
        </div>
        <div class="rd-field">
          <label class="rd-label" for="password">كلمة المرور</label>
          <div class="rd-input-wrap">
            <input id="password" class="rd-input" type="password" placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="rd-toggle-pw" onclick="togglePw('password', this)">إظهار</button>
          </div>
          <div id="pwErr" class="rd-error"></div>
        </div>
        <div class="rd-row">
          <span></span>
          <span class="rd-link" onclick="openForgot()">نسيت كلمة المرور؟</span>
        </div>
        <button id="loginBtn" class="rd-btn primary" style="width:100%;" onclick="login()">دخول</button>
        <div id="msg" class="rd-msg"></div>
      </form>
      <p style="margin-top:18px;font-size:13px;color:var(--muted);text-align:center;">
        ليس لديك حساب؟ <a class="rd-link" href="register.html">إنشاء حساب</a>
      </p>
    </div>
  </div>
</div>

<div id="forgotBackdrop" class="rd-modal-backdrop">
  <div class="rd-modal">
    <h2 style="margin:0 0 6px;">استعادة كلمة المرور</h2>
    <p style="color:var(--muted);font-size:14px;margin:0 0 16px;">أدخل بريدك الإلكتروني وسنرسل تعليمات الاستعادة.</p>
    <div class="rd-field">
      <label class="rd-label">البريد الإلكتروني</label>
      <input id="forgotEmail" class="rd-input" type="email" placeholder="name@example.com">
    </div>
    <div id="forgotMsg" class="rd-msg"></div>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button class="rd-btn ghost" style="flex:1;" onclick="closeForgot()">إلغاء</button>
      <button class="rd-btn primary" style="flex:1;" onclick="submitForgot()">إرسال</button>
    </div>
  </div>
</div>

<script src="assets/js/common.js"></script>
<script>
  function togglePw(id, btn) {
    const el = document.getElementById(id);
    if (el.type === 'password') { el.type = 'text'; btn.textContent = 'إخفاء'; }
    else { el.type = 'password'; btn.textContent = 'إظهار'; }
  }
  function setLoading(btn, loading) {
    if (loading) { btn.disabled = true; btn.innerHTML = '<span class="rd-spinner"></span> جاري...'; }
    else { btn.disabled = false; btn.textContent = 'دخول'; }
  }
  function openForgot() { document.getElementById('forgotBackdrop').classList.add('open'); }
  function closeForgot() { document.getElementById('forgotBackdrop').classList.remove('open'); }
  function submitForgot() {
    const m = document.getElementById('forgotMsg');
    m.textContent = 'خدمة استعادة كلمة المرور غير متاحة في هذا الإصدار. تواصل مع المدير.';
    m.className = 'rd-msg error';
  }
  async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const emailErr = document.getElementById('emailErr');
    const pwErr = document.getElementById('pwErr');
    const msg = document.getElementById('msg');
    emailErr.textContent = ''; pwErr.textContent = ''; msg.textContent = ''; msg.className = 'rd-msg';
    let ok = true;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { emailErr.textContent = 'بريد إلكتروني غير صالح'; ok = false; }
    if (password.length < 8) { pwErr.textContent = 'كلمة المرور 8 أحرف على الأقل'; ok = false; }
    if (!ok) return;
    const btn = document.getElementById('loginBtn');
    setLoading(btn, true);
    try {
      const data = await BD.api('/api/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
      BD.setToken(data.token);
      msg.textContent = 'تم تسجيل الدخول بنجاح';
      msg.className = 'rd-msg success';
      setTimeout(() => location.href = 'projects.html', 600);
    } catch (e) {
      msg.textContent = e.message || 'فشل تسجيل الدخول';
      msg.className = 'rd-msg error';
    } finally {
      setLoading(btn, false);
    }
  }
  document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body></html>
