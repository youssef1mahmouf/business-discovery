<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأصدقاء</title><link rel="stylesheet" href="assets/css/main.css"></head><body>
<div class="app-shell" id="appShell">
  <aside class="sidebar" id="bdSidebar">
    <div class="sidebar-brand"><div class="brand-icon">BD</div><span class="brand-text">Business Discovery</span></div>
    <button class="sidebar-toggle" id="bdCollapseBtn">⇔</button>
    <nav class="sidebar-nav" id="bdSidebarNav"></nav>
    <div class="sidebar-footer">© 2026</div>
  </aside>
  <div class="sidebar-overlay" id="bdOverlay"></div>
  <div class="main-area">
    <header class="topbar" id="bdTopbar">
      <button class="mobile-menu-btn" id="bdMenuBtn">☰</button>
      <div class="topbar-left"><h1 class="page-title" id="bdPageTitle"></h1></div>
      <div class="topbar-search"><input type="search" id="bdSearch" placeholder="بحث..."></div>
      <div class="topbar-actions">
        <a href="notifications.html" class="icon-btn">🔔<span class="badge-count" id="bdNotifCount" style="display:none"></span></a>
        <div class="profile-menu">
          <button class="profile-btn" id="bdProfileBtn">👤 <span id="bdUserEmail"></span></button>
          <div class="profile-dropdown" id="bdProfileDropdown">
            <a href="settings.html">الإعدادات</a>
            <a href="#" id="bdLogout">تسجيل الخروج</a>
          </div>
        </div>
      </div>
    </header>
    <main class="content" id="bdContent">
      <div class="container">
        <div class="card"><h2>الأصدقاء والدعوات</h2><div id="list"></div></div>
        <div class="card"><h3>إرسال دعوة صداقة</h3><input id="to" placeholder="بريد الصديق"><button class="btn" onclick="send()">إرسال</button><p id="msg"></p></div>
      </div>
    </main>
    <footer class="app-footer" id="bdFooter">Business Discovery © 2026 — جميع الحقوق محفوظة</footer>
  </div>
</div>
<script src="assets/js/common.js"></script>
<script src="assets/js/layout.js"></script>
<script>
BD.requireAuth();
async function load(){ try{ const d=await BD.api('/api/friends'); const list=document.getElementById('list'); list.textContent=''; const f=document.createElement('div'); f.textContent='أصدقاء: '+(d.friends||[]).join(', ')||'لا يوجد'; list.appendChild(f); const p=document.createElement('div'); p.textContent='طلبات معلقة: '+(d.pending?d.pending.length:0); list.appendChild(p); }catch(e){ document.getElementById('list').textContent=e.message;} }
async function send(){ try{ await BD.api('/api/friends/requests',{method:'POST',body:JSON.stringify({to:document.getElementById('to').value})}); load(); }catch(e){ document.getElementById('msg').textContent=e.message;} }
load();
</script></body></html>
