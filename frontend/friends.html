<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأصدقاء</title><link rel="stylesheet" href="assets/css/main.css"></head><body>
<nav class="nav"><a href="index.html">الرئيسية</a><a href="projects.html">المشاريع</a><a href="friends.html">الأصدقاء</a><a href="tasks.html">المهام</a><a href="notifications.html">الإشعارات</a><a href="admin.html">الإدارة</a></nav>
<div class="container"><div class="card"><h2>الأصدقاء والدعوات</h2><div id="list"></div></div>
<div class="card"><h3>إرسال دعوة صداقة</h3><input id="to" placeholder="بريد الصديق"><button class="btn" onclick="send()">إرسال</button><p id="msg"></p></div></div>
<script src="assets/js/common.js"></script>
<script>
BD.requireAuth();
async function load(){ try{ const d=await BD.api('/api/friends'); document.getElementById('list').innerHTML='أصدقاء: '+(d.friends.join(', ')||'لا يوجد')+'<br>طلبات معلقة: '+d.pending.length; }catch(e){ document.getElementById('list').textContent=e.message;} }
async function send(){ try{ await BD.api('/api/friends/requests',{method:'POST',body:JSON.stringify({to:document.getElementById('to').value})}); load(); }catch(e){ document.getElementById('msg').textContent=e.message;} }
load();
</script></body></html>
