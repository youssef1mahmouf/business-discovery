<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تغيير كلمة المرور | Business Discovery</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <main class="rd-auth">
    <section class="rd-auth-card" aria-labelledby="changePasswordTitle">
      <div class="rd-logo" style="margin-bottom:18px;">
        <span class="rd-logo-mark">BD</span>
        <span>Business Discovery</span>
      </div>
      <h1 id="changePasswordTitle">تغيير كلمة المرور</h1>
      <p class="sub">يجب تحديث كلمة المرور المؤقتة قبل متابعة استخدام حسابك.</p>
      <form id="changePasswordForm">
        <div class="rd-field">
          <label class="rd-label" for="oldPassword">كلمة المرور الحالية</label>
          <input id="oldPassword" class="rd-input" type="password" autocomplete="current-password" required>
        </div>
        <div class="rd-field">
          <label class="rd-label" for="newPassword">كلمة المرور الجديدة</label>
          <input id="newPassword" class="rd-input" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="rd-field">
          <label class="rd-label" for="confirmPassword">تأكيد كلمة المرور</label>
          <input id="confirmPassword" class="rd-input" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <button id="changePasswordBtn" class="rd-btn primary" type="submit" style="width:100%;">تحديث كلمة المرور</button>
        <p id="changePasswordMsg" class="rd-msg" role="status" aria-live="polite"></p>
      </form>
      <button class="rd-btn ghost" type="button" onclick="BD.setToken(null); location.href='login.html';">تسجيل الخروج</button>
    </section>
  </main>
  <script src="assets/js/common.js"></script>
  <script>
    BD.requireAuth();
    document.getElementById('changePasswordForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const oldPassword = document.getElementById('oldPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const message = document.getElementById('changePasswordMsg');
      const button = document.getElementById('changePasswordBtn');
      message.textContent = '';
      if (newPassword.length < 8 || newPassword !== confirmPassword) {
        message.textContent = newPassword !== confirmPassword
          ? 'كلمتا المرور غير متطابقتين'
          : 'كلمة المرور يجب ألا تقل عن 8 أحرف';
        message.className = 'rd-msg error';
        return;
      }
      button.disabled = true;
      try {
        await BD.api('/api/auth/change-password', {
          method: 'POST',
          body: JSON.stringify({ oldPassword, newPassword, confirmPassword })
        });
        message.textContent = 'تم تحديث كلمة المرور';
        message.className = 'rd-msg success';
        setTimeout(() => { location.href = 'projects.html'; }, 600);
      } catch (error) {
        message.textContent = error.message || 'تعذر تحديث كلمة المرور';
        message.className = 'rd-msg error';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
